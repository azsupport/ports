# The libraries of /usr/local/az, the package az (the port az/az of
# azsupport/ports; tools/az-build.sh): builds of FreeBSD ports in two trees.
# The shared tree /usr/local/az (lib/, include/, bin/): shared libraries with
# their SONAME and the run path /usr/local/az/lib, for every package of the
# repository: PHP and its modules (pkg mode, one package per extension, built
# with phpize), Apache and the modules it loads, and the programs (curl, FFmpeg,
# multimedia/ffmpeg/files/ffmpeg.conf; ImageMagick 6 and 7,
# graphics/ImageMagick7/files/imagemagick.conf; GraphicsMagick, mc, wget, rsync,
# memcached, the BIND tools, MariaDB), which link them with that run path: one
# copy of every library for all of them, as with the libraries of the other ports
# of this tree (devel/pcre2, devel/pcre, the libcurl of ftp/curl). Our ports link
# each other's shared libraries, never a static or bundled copy (aZ, 10.11.2026).
# The static tree /usr/local/az/static (lib/, include/, bin/): static and
# position independent archives, for PHP built against them on a server (php,
# php-fpm, libphp.so; tools/config-check.sh, tools/az-menu.sh of
# azsupport/php-src), which needs no library of /usr/local/lib. Two trees,
# because the linker takes libfoo.so before libfoo.a of one directory (a static
# build would become dynamic without a word). Every library is built once per
# kind, for all of them, from the ports commit below (also that of ffmpeg.conf
# and imagemagick.conf).
#
#   ports <commit>         the freebsd-ports commit the libraries and the programs
#                          come from: their versions, distfiles and checksums
#                          (distinfo) and patches
#   lib <name> <port> <kinds>
#                          one library, in build order (later ones use earlier ones);
#                          <kinds> is static, shared or static,shared: static into
#                          the static tree /usr/local/az/static (the archives
#                          PHP built on a server links in), shared into the
#                          shared tree /usr/local/az (lib/*.so with their run
#                          path, for the packages), both against the OpenSSL of
#                          the base system. Static only: curl (the libcurl.a of
#                          PHP built on a server; the packages take libcurl.so.4
#                          of ftp/curl). Shared only: what no PHP built on a
#                          server takes (below)
#   lib <name> bundle <kinds>
#                          a library of the bundled curl (--with-curl=bundled): the
#                          release file of files/curl-deps.conf (curl:
#                          files/curl.conf), built by files/curl/build-libcurl.sh,
#                          so that both have the same ones; libcurl.a takes them in
#                          with their symbols local, they stay for the others
#                          (libzip: zstd); their shared ones are those of ftp/curl
#                          and of the other packages
#   take <name> <version> <release file> <SHA-256> <source dir>
#                          (<release file>: one address, or several of the same file
#                          separated by commas, tried in turn)
#                          a new release of the upstream that the port does not have
#                          yet. A new release is taken when its port has it; before
#                          the port only when it fixes a vulnerability that touches
#                          us, or a bug we have (rule of 04.11.2026); the port is
#                          followed for its patches and what FreeBSD needs
#                          (tools/upstream-check.py reports the port's commits after
#                          the commit above). The
#                          ports framework builds the release file instead of its own
#                          distfile (SHA-256 checked against a second source when it
#                          is taken), with the port's patches, or with those of
#                          files/deps/<name>-<version>/ when there is that
#                          directory; <source dir> is the source tree inside the
#                          extracted release (WRKSRC). Once the port has the version,
#                          the line goes (the check reports it).
#   upstream <name> <version> <releases> [<pattern> [<series>]]
#                          where tools/upstream-check.py looks for new releases of a
#                          library, and the version built now (that of the port or of
#                          its take line): a git repository (its tags, with <pattern>
#                          a regular expression whose group 1 is the version) or a
#                          directory listing ending in "/" (the names in it that match
#                          <pattern>; a group "patch" is a patch level of <series>);
#                          <series> keeps the check to one series (OpenSSL 3.5, the LTS
#                          of the port)
#
# Base system libraries are used as they are: libz, libbz2, libncursesw, libc++,
# libthr, libm, and OpenSSL (libssl and libcrypto of /usr/lib and /lib, 3.5 LTS
# in FreeBSD 15, its legacy provider a module of /usr/lib/ossl-modules) for both
# trees and for the programs, which link it as a shared library: one OpenSSL in the
# system, its fixes by freebsd-update (aZ, 10.11.2026; before, the static tree had
# the port security/openssl in it). JPEG is graphics/mozjpeg, as JPEG_PORT in
# /etc/make.conf of the servers. fontconfig takes its configuration, fonts and
# cache from the system (/usr/local/etc/fonts, /usr/local/share/fonts,
# /var/db/fontconfig), as the port does.

# freebsd-ports main of 10.11.2026 21:19, that of ports_commit of tools/build.sh
# (the latest versions of the ports, aZ); since 04.11.2026 (f16b6dd0f7c1) lcms2
# 2.20 among the libraries, and GraphicsMagick 1.3.49 (CVE-2025-55154,
# CVE-2026-56379, CVE-2026-61464, CVE-2026-103118).
ports 6e4a386577aaa191a68b11865fcb18e02f98e525

