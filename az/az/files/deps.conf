# for ImageMagick (text, colour profiles, HEIC and AVIF) and FFmpeg (H.264, AV1);
# SVT-AV1, the AV1 encoder of libheif and FFmpeg: AVIF written by ImageMagick, vips
# and FFmpeg, AV1 by FFmpeg (aZ, 11.11.2026: "да, добавь SVT-AV1")
lib expat         textproc/expat2          static,shared
lib fontconfig    x11-fonts/fontconfig     static,shared
lib lcms2         graphics/lcms2           static,shared
lib x264          multimedia/libx264       shared
lib dav1d         multimedia/dav1d         static,shared
lib libde265      multimedia/libde265      static,shared
lib svtav1        multimedia/svt-av1       static,shared
lib libheif       graphics/libheif         static,shared
# shared only, for the PHP modules of pkg mode: sqlite3 and pdo_sqlite, gmp, xsl,
# ffi, tidy (aZ 08.11.2026)
lib sqlite3       databases/sqlite3        shared
lib gmp           math/gmp                 shared
lib libxslt       textproc/libxslt         shared
lib libffi        devel/libffi             shared
lib tidy          www/tidy-html5           shared
# for net/rsync: the checksums xxh128, xxh3 and xxh64 (aZ, 10.11.2026). A library
# added to az goes after the others: tools/az-lib-hashes.sh keeps the hashes of
# those before it, so it builds again only az and the ports that link it
lib xxhash        devel/xxhash             shared
# shared, for www/apache24 and the modules Apache loads (mod_php, mod_maxminddb):
# APR and APR-util of devel/apr1, APR-util with the expat of az and the DBM of its
# own (SDBM), without database drivers, LDAP and crypto (aZ, 10.11.2026)
lib apr           devel/apr1               shared
# for www/mod_maxminddb, and nginx later (aZ, 10.11.2026)
lib libmaxminddb  net/libmaxminddb         shared
# for dns/bind-tools: BIND 9.20 needs both (aZ, 10.11.2026)
lib libuv         devel/libuv              shared
lib liburcu       sysutils/liburcu         shared
# for databases/mariadb1011-server and -client, which take fmt header-only
# (FMT_HEADER_ONLY): its headers (aZ, 10.11.2026)
lib fmt           devel/libfmt             shared

# The package curl (bin/curl, lib/libcurl.so.4 of /usr/local, in the place of
# that of the port) is the port ftp/curl of this tree: a build of its own of the
# release of the bundled curl, with the options of the port ftp/curl, against the
# shared libraries here (tools/curl-build.sh). Its libcurl.so.4 is that of every
# package (the PHP module curl, git, ...); the static libcurl.a above, with only
# what PHP needs, is for PHP built on a server.

