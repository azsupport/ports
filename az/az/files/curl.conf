# The bundled curl of the package az (the static libcurl.a of /usr/local/az/static
# for PHP, the shared libcurl.so of /usr/local/az; tools/az-curl-sources.sh,
# files/curl/build-libcurl.sh) and the curl of the port ftp/curl
# (tools/curl-build.sh): the release of the last line, with
# files/curl/curl-<version>.patch (from freebsd-ports ftp/curl). The lines per
# PHP target are those of freebsd/curl.conf of azsupport/php-src, whose
# tools/sync.sh puts the same release into ext/curl of the PHP tarballs (keep
# both in step). curl 8.18.0 and later need OpenSSL 3.0 or later.
#
# A new curl release is taken when ftp/curl has it; before the port only when it
# fixes a vulnerability that touches us (curl names the CVEs each release fixes), or
# a bug we have. The port is followed for its patches (freebsd/upstream.conf of php-src); once
# it has the version, its distinfo has to list the same SHA-256.
