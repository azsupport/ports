# The Midnight Commander of the port misc/mc (tools/mc-build.sh): the official port
# misc/mc at the ports commit of az/az/files/deps.conf, with what a server needs and
# the libraries linked in, so that the package mc needs no other package and only
# libraries of the base system (ncursesw, libutil, libz, libthr, libc). The official
# package needs glib (with Python and py-packaging), libssh2, gettext-runtime,
# libiconv, pcre2, libffi, zip, Perl and Python.
#
#   program <name> <port>   the official ports built, in this order: libffi (only for
#                           the build of GLib, whose GObject needs it; mc does not link
#                           GObject) and GLib, static, into the work directory of the
#                           script; then mc into its stage, against them and the
#                           static tree of the package az: libssh2 (with the OpenSSL of
#                           that tree), PCRE2, libintl and libiconv for GLib
#   configure <option>...   the options of the configure of mc, after --prefix and the
#                           paths of the port
#
# On, as the official port (its options EDITOR, SUBSHELL, ICONV, SFTP, NCURSES): the
# editor mcedit (F4), the subshell (Ctrl-O: tcsh, csh, bash, zsh, ksh, dash; not the
# /bin/sh of FreeBSD, the message of the package says so), the charsets (the codepage
# of a panel, of the viewer and of the editor: files in KOI8-R or CP1251), SFTP
# (sftp://, libssh2), ncurses of the base system with wide characters (UTF-8).
# On by default in mc, no library needed: the shell link over ssh (sh://user@host,
# the commands of the remote shell), FTP, tar and cpio, the filters of sfs (gzip,
# bzip2, xz, zstd: programs of the base system), extfs (the helpers of
# libexec/mc/extfs.d), the diff viewer mcdiff, background copies.
# Off: X11 (no X on the servers; X11 is in the OPTIONS_UNSET of their make.conf),
# the translations (NLS: the interface, the help and the manual in English; 2.5 MB of
# .mo files and libintl), Aspell (the spell check of the editor), PCRE2 as the search
# engine (that of GLib, itself on PCRE2, as the port), ext2fs attributes (EXTATTR:
# file systems of Linux), the undelete of ext2 (Linux), the documents (DOCS).
#
# Archives (files/archives-bsdtar.patch, aZ 10.11.2026): zip, jar, 7z, rar and ISO
# 9660 open as a directory with files/ubsdtar, an extfs helper on tar of the base
# system (bsdtar, libarchive), read only, instead of uzip (Perl), u7z (7-Zip), urar
# (rar) and iso9660 (xorriso); their views (F3) fall back to tar -tvf. Writing into
# such an archive goes to the helper of mc for its format, with programs of its own.
#
# Not dependencies (the official port depends on some of them): Perl
# (/usr/local/bin/perl: the extfs helpers of deb, rpm, patch files and mail boxes,
# writing into zip with zip), Python (python3 in PATH: s3+, torrent, uc1541), zip,
# 7-Zip, rar, GNU diff (gdiff of textproc/diffutils: mcdiff, which the patch of the
# port makes run gdiff; the diff of the base system lacks options of GNU diff); each
# works once its package is installed.

program libffi   devel/libffi
program glib     devel/glib20
program mc       misc/mc

configure --with-screen=ncurses
configure --with-internal-edit
configure --with-subshell
configure --enable-charset
configure --enable-vfs-sftp
configure --with-search-engine=glib
configure --without-x
configure --disable-nls
configure --disable-aspell
configure --without-gpm-mouse
