# Redis 8.2 of azsupport/ports: the main cache, without profiles in
# /usr/local/etc/redis.conf, with the profiles of the rc script (/etc/rc.conf:
# redis_profiles="redis session") in /usr/local/etc/redis-redis.conf
# To be reached from other hosts: an address of this host in bind, protected-mode
# no, and the port closed to the outside by the firewall
bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 32768
unixsocket /tmp/redis.sock
unixsocketperm 777
timeout 0
tcp-keepalive 300
daemonize yes
pidfile /var/run/redis/redis.pid
loglevel notice
logfile /var/log/redis/redis.log
databases 16
always-show-logo no
hide-user-data-from-log yes
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"
locale-collate ""
save ""
# Snapshots to disk: uncomment a line (save "" stays as it is)
# every hour if at least 1 key changed
#save 3600 1
# every 15 minutes if at least 1 key changed
#save 900 1
# every 5 minutes if at least 100 keys changed
#save 300 100
# the default of Redis: an hour and 1 change, 5 minutes and 100, a minute and 10000
#save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
rdb-del-sync-files no
dir /var/db/redis/
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-diskless-sync-max-replicas 0
repl-diskless-load disabled
repl-disable-tcp-nodelay no
replica-priority 100
acllog-max-len 128
maxclients 32000
# The size: per server
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 10
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes
appendonly no
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes
aof-timestamp-enabled no
# A snapshot only on stop (service redis stop, restart, reboot), none on a
# schedule: uncomment
#shutdown-on-sigterm save force
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 0
notify-keyspace-events ""
hash-max-listpack-entries 512
hash-max-listpack-value 64
list-max-listpack-size -2
list-compress-depth 0
set-max-intset-entries 512
set-max-listpack-entries 128
set-max-listpack-value 64
zset-max-listpack-entries 128
zset-max-listpack-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
jemalloc-bg-thread yes
activedefrag yes
