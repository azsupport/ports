# GraphicsMagick for the video sites and the PHP module gmagick
# (tools/graphicsmagick-build.sh; the port graphics/GraphicsMagick, in the place
# of the official one): bin/gm, static, with the formats of our ImageMagick only
# (graphics/ImageMagick7/files/imagemagick.conf: JPEG of mozjpeg, PNG, WebP,
# GIF, BMP, HEIC and AVIF through libheif, text with FreeType, colour profiles
# with lcms2), against the static libraries of /usr/local/az/static (the
# package az). Its own files have names of their own (lib/GraphicsMagick,
# share/GraphicsMagick): nothing of it is a file of ImageMagick6 or 7.
# For gmagick of PHP: the static libraries, headers and the config scripts in
# /usr/local/az/static (lib/libGraphicsMagick.a, libGraphicsMagickWand.a,
# include/GraphicsMagick, bin/GraphicsMagick-config and
# bin/GraphicsMagickWand-config with the static link line), and the same
# options once more as shared libraries against the shared tree /usr/local/az
# (lib/libGraphicsMagick.so, lib/libGraphicsMagickWand.so, run path
# /usr/local/az/lib; include/GraphicsMagick, lib/pkgconfig, the config scripts
# in bin; lib/GraphicsMagick/config, the configuration they read), for
# --with-gmagick=/usr/local/az of the PHP packages; no Magick++.
#
# GraphicsMagick has no policy.xml: the coders not built are the policy. Here
# that is (tools/graphicsmagick-build.sh, before configure):
#   - the module lines below: in a build without modules GraphicsMagick
#     registers a coder only from the table of magick/static.c; every other
#     line of it is removed, so a file of another format (found by its content,
#     whatever its name: an MVG script named photo.jpg) has no coder: "no decode
#     delegate for this image format"
#   - the lowest coder class is "primary" (magick/magick.c; the environment
#     variable MAGICK_CODER_STABILITY could still lower it): the PNG coder's MNG
#     and JNG (class stable) are not registered
#   - configure: no Ghostscript (--without-gs: no PostScript, EPS or PDF read),
#     no libxml2 (no SVG, MSL, URL), no X11, no modules, no TIFF, JPEG 2000,
#     JPEG XL, WMF, FlashPIX, JBIG, bzip2, LZMA, zstd
#   - delegates.mgk of graphics/GraphicsMagick/files has no delegate: no
#     external program is ever run (it takes the place of the generated one)
# What ImageMagick's policy refuses and GraphicsMagick cannot: text, label:
# and caption: beginning with @ read that file, and paths are not restricted
# (/etc/*, ../, standard input): the sites must not hand a user's text or file
# name to gm or gmagick as it is.
#
#   gm <name> <port>      the GraphicsMagick built against the static libraries
#                         of /usr/local/az/static, at the ports commit of
#                         az/az/files/deps.conf
#   take                  as in az/az/files/deps.conf (a new upstream release
#                         before its port, only for a vulnerability that touches
#                         us, or a bug we have)
#   module <name>...      the coders of the table of magick/static.c that stay
#                         (the module names: HEIF reads HEIC and AVIF)
#   format <name>...      the formats gm may list (gm convert -list format);
#                         one more means a coder registers more than we know of
#   configure <option>... options of configure, after --prefix and the flags of
#                         the script; then --disable-shared --enable-static (gm
#                         and the static libraries) or --enable-shared
#                         --disable-static (the shared libraries)

gm graphicsmagick  graphics/GraphicsMagick

module BMP CAPTION GIF HEIF JPEG LABEL PNG WEBP XC
# MP4: gm lists it with the coder HEIF (libheif 1.23 of az reads image sequences
# and MP4 video of the same ISO BMFF; build.yml 42526293332 of azsupport/ports)
format BMP BMP2 BMP3 CAPTION GIF GIF87 HEIF HEIC AVIF MP4 JPEG JPG LABEL PNG PNG00 PNG8 PNG24 PNG32 PNG48 PNG64 WEBP XC

configure --without-modules --with-quantum-depth=16 --with-threads --disable-openmp
configure --with-jpeg --with-png --with-webp --with-heif --with-ttf --with-lcms2 --with-zlib
configure --without-gs --without-xml --without-x --without-tiff --without-jp2 --without-jxl --without-wmf
configure --without-fpx --without-jbig --without-bzlib --without-lzma --without-zstd --without-dps
configure --without-gdi32 --without-trio --without-umem --without-perl --without-magick-plus-plus
configure --with-windows-font-dir=/usr/local/share/fonts/webfonts
# the symbols of the libraries with the prefix Gm (the headers rename the calls
# of gmagick and the test programs): libGraphicsMagickWand and libMagickWand of
# ImageMagick have the same function names. Not all of them: 1.3.42 leaves 30
# without it, among them LogMagickEvent, LogMagickEventList, SegmentImage and
# SetLogMethod, which ImageMagick 7 has too (shared.txt of the build lists them),
# so imagick and gmagick are still not for one PHP (config.m4 of ext/gmagick of
# the fork refuses to build them into one)
configure --enable-symbol-prefix
