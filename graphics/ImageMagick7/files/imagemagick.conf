# ImageMagick 6 and 7 for the video sites (the ports graphics/ImageMagick6,
# graphics/ImageMagick7 and graphics/ImageMagick67, tools/imagemagick-build.sh; the
# packages of the repository azsupport, which conflict with each other, aZ 14.11.2026):
# ImageMagick6 has ImageMagick 6 with the usual names (convert, identify, mogrify,
# composite...), ImageMagick7 has ImageMagick 7 as magick with the usual names
# linked to it, and ImageMagick67 has both side by side in /usr/local/bin, ImageMagick
# 7 as in ImageMagick7 and ImageMagick 6 with a 6 at the end of every name (convert6,
# identify6, mogrify6, composite6...: --program-suffix=6, which the port gives the
# build as AZSUPPORT_IM6_SUFFIX).
# Their own files have names of their own: etc/ImageMagick-6 and -7 (the
# configuration, with the policy), share/ImageMagick-6 and -7 in /usr/local, and
# their libraries (libMagickCore-6, libMagickWand-6; libMagickCore-7,
# libMagickWand-7) with lib/ImageMagick-6.* and -7.* in /usr/local/azsupport/lib. Shared:
# each is built with --enable-shared --disable-static (no modules), against the
# shared libraries of /usr/local/azsupport (azsupport/azsupport/files/deps.conf, with its ports commit),
# run path /usr/local/azsupport/lib, its programs linking its libraries (our ports link
# each other's shared libraries: aZ, 10.11.2026); the fonts and the configuration
# of fontconfig are those of the system (/usr/local/etc/fonts). The libraries of
# ImageMagick 7 are also those of imagick of the PHP packages (phpize,
# --with-imagick=/usr/local/azsupport): include/ImageMagick-7, lib/pkgconfig and
# bin/MagickWand-config in /usr/local/azsupport; they read the configuration and the
# policy of /usr/local/etc/ImageMagick-7, so imagick has the formats and the policy
# of the programs. ImageMagick 7 is also built static (the configure lines below
# as they are), for the static imagick of PHP built on a server: it leaves its
# static libraries, headers and .pc files in /usr/local/azsupport/static
# (lib/libMagickCore-7.a, include/ImageMagick-7, and bin/MagickWand-config with
# the static link line; --with-imagick=/usr/local/azsupport/static). Nothing links
# against the libraries of ImageMagick 6 but its programs.
#
# Only what the sites need, from the FreeBSD ports, with the options of the ports
# narrowed down: JPEG (mozjpeg, as JPEG_PORT of the servers), PNG, WebP, GIF and
# BMP (built into ImageMagick; BMP is the intermediate file of the sites'
# screenshots), HEIC and AVIF (libheif with the decoders libde265 and dav1d; AVIF
# written with SVT-AV1, aZ 11.11.2026; no HEVC encoder), text (FreeType, fontconfig),
# colour profiles (lcms2). No
# SVG, PDF, PostScript (no Ghostscript), RAW, EXR, JPEG 2000, JPEG XL, DjVu, WMF,
# TIFF, FlashPIX, X11, Perl, OpenMP, loadable modules, libxml2 (MSL, URL). The
# policy graphics/ImageMagick7/files/policy.xml (installed as etc/ImageMagick-<6|7>/
# policy.xml) allows only those formats, BMP, and a few built-in ones (xc:,
# label:, caption:), no delegate programs, no @file indirection, no reading of /etc.
#
#   im <name> <port>      an ImageMagick built against the shared libraries of
#                         /usr/local/azsupport, at the ports commit of
#                         azsupport/azsupport/files/deps.conf
#   take, upstream        as in azsupport/azsupport/files/deps.conf (take: a new upstream release
#                         before its port, only for a vulnerability that touches
#                         us, or a bug we have; the upstream lines of the
#                         libraries are in deps.conf)
#   configure <option>... options of the configure of both ImageMagicks, after
#                         --prefix and the flags of the script; configure6 and
#                         configure7 only for one of them; the packages take them
#                         with --enable-shared --disable-static --without-modules
#                         after them, the static ImageMagick 7 as they are

im imagemagick6   graphics/ImageMagick6
im imagemagick7   graphics/ImageMagick7

upstream imagemagick6  6.9.13-61  https://github.com/ImageMagick/ImageMagick6  (\d+\.\d+\.\d+-\d+)
upstream imagemagick7  7.1.2-36   https://github.com/ImageMagick/ImageMagick   (\d+\.\d+\.\d+-\d+)

# Taken on 17.11.2026 before their ports (the ports have 7.1.2-34 and 6.9.13-59),
# for GHSA fixes in what we build: the pixel cache (GHSA-v56x-r6p7-8v88), the
# import and export of pixels (GHSA-qw9c-mq27-w844, GHSA-cf7p-m88c-h9jh), the splay
# trees (GHSA-cvrx-j29f-c5q9), ShearRotateImage (GHSA-8xm2-q8hq-m68q), transform.c
# (GHSA-58v3-cmwm-hj3w, GHSA-mqmh-65w8-fgjp), annotate.c of label: and caption:
# (GHSA-f965-fvcw-9vhf), the pixel stream (GHSA-4cmr-g39q-mh38), image.c
# (GHSA-6r6f-x5h8-fw8h), constitute.c (GHSA-rm4h-gcc3-55wx) and, in ImageMagick 7,
# coders/heic.c (GHSA-g3c3-wcx5-7qrw). On 17.11.2026 only download.imagemagick.org
# had the files (the two other mirrors: 404). Their SHA-256: distinfo.yml, run
# 44112176044. The patches of graphics/ImageMagick6/files apply (write-profiles
# with an offset of 3 lines).
# Before (7.1.2-35 and 6.9.13-60), taken on 08.11.2026 before their ports, for GHSA
# fixes in what we build:
# coders/png.c (GHSA-m2p5-qpx9-5mx6), the pixel cache (GHSA-5jwm-r7f4-4m53,
# GHSA-q66g-3m63-78mh), MagickCore/image.c (GHSA-c764-55gw-gj6c), a limit to the
# profiles of an image and GIF. The ports have no patches. The file is that of the
# port's mirrors (MASTER_SITES; on 08.11.2026 only download.imagemagick.org had it):
# the release tarball of make dist, with a good signature of the ImageMagick code
# signing key 89AB63D48277377A and this SHA-256 in the digest.rdf of the mirror.
# The .tar.xz of the GitHub release is another archive with a SHA-256 of its own:
# the tree of the tag and ChangeLog.md. The C sources of the two are the same as
# the tag; the mirror's tarball adds what make dist generates (configure, the man
# pages, version.h). take-sources.yml (then of azsupport/php-src), run 42475440650.
take imagemagick6  6.9.13-61  https://download.imagemagick.org/archive/releases/ImageMagick-6.9.13-61.tar.xz,https://ftp.acc.umu.se/mirror/imagemagick.org/ftp/releases/ImageMagick-6.9.13-61.tar.xz,https://mirror.dogado.de/imagemagick/releases/ImageMagick-6.9.13-61.tar.xz  8477707063531f3ff36d2c6e1bf5c02b3fd902ab7ea940b7a92a354501e9d192  ImageMagick-6.9.13-61
take imagemagick7  7.1.2-36   https://download.imagemagick.org/archive/releases/ImageMagick-7.1.2-36.tar.xz,https://ftp.acc.umu.se/mirror/imagemagick.org/ftp/releases/ImageMagick-7.1.2-36.tar.xz,https://mirror.dogado.de/imagemagick/releases/ImageMagick-7.1.2-36.tar.xz  62b395c62498ebeaaacf14b0252263348d9f2c19cba8181aa991702a832d277a  ImageMagick-7.1.2-36

configure --disable-shared --enable-static --without-modules
configure --with-quantum-depth=16 --with-threads --disable-openmp --without-gcc-arch
configure --with-jpeg --with-png --with-webp --with-heic --with-freetype --with-fontconfig --with-lcms --with-zlib
configure --without-bzlib --without-lzma --without-zstd --without-xml --without-tiff --without-openjp2 --without-openexr
configure --without-raw --without-rsvg --without-pango --without-raqm --without-wmf --without-djvu --without-fpx
configure --without-jbig --without-fftw --without-lqr --without-gslib --without-gvc --without-flif --without-dps
configure --without-perl --without-x --without-magick-plus-plus --disable-docs --disable-deprecated
configure6 --disable-hdri
configure7 --enable-hdri --without-jxl --without-uhdr --without-zip --without-dmr
