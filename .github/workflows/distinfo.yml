name: The distinfo of a new release
# The size and SHA-256 of distribution files, for the distinfo of a port of this
# tree at a release ahead of the official tree (www/yt-dlp), when the sandbox of
# Claude cannot fetch them (a host it does not reach; on 09.11.2026 the release
# downloads of GitHub answered 504 for a while, on GitHub's side): each file
# fetched on Ubuntu from every address given (they must give the same file) and, with
# checksum files of the publisher (sha256sum or sha512sum format: Elastic publishes
# <file>.sha512), found there with the same SHA-256 or SHA-512. The lines for
# distinfo (TIMESTAMP, SHA256, SIZE) go into the summary
# of the run and into the branch runs of azsupport/azsupport (tools/runs-report.sh).
# With "list", what is in each file too, for a port made from a binary archive
# (textproc/opensearch217: the jars and plugins of the bundle): tar -tv or unzip -l,
# and the text of the members whose paths match its patterns, into a report of its
# own (<run>-list.md).
# Started by hand: Actions, "The distinfo of a new release", "Run workflow", or
# gh api -X POST repos/azsupport/ports/actions/workflows/distinfo.yml/dispatches
#   -f ref=main -f 'inputs[files]=<name>=<url>' -f 'inputs[sums]=<url>'
on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Files: <name in distinfo>=<url>[,<url>...], separated by spaces (yt-dlp/2026.10.26/yt-dlp.tar.gz=https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.tar.gz)'
        required: true
      sums:
        description: 'The checksum files of the publisher (sha256sum or sha512sum format), separated by spaces, optional'
        required: false
        default: ''
      list:
        description: 'What is in each file: its list (tar -tv, unzip -l) and the text of its members whose paths match these shell patterns (separated by spaces; "-": the list only), into a report of its own; empty: nothing'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  distinfo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and sum
        id: sum
        env:
          FILES: ${{ inputs.files }}
          SUMS: ${{ inputs.sums }}
          LIST: ${{ inputs.list }}
        run: |
          set -u
          rc=0
          mkdir -p dl
          : > notes.txt
          : > list.md
          # contents <name>: what is in dl/file, into list.md (LIST)
          contents() {
            set -f
            { echo "## $1"; echo; echo '```'
              case "$1" in *.zip|*.jar) unzip -l dl/file ;; *) tar -tvf dl/file ;; esac
              echo '```'; echo; } >> list.md
            pats=""
            for p in $LIST; do [ "$p" = - ] || pats="$pats $p"; done
            if [ -n "$pats" ]; then
              rm -rf dl/x; mkdir -p dl/x
              case "$1" in
                *.zip|*.jar) unzip -q -o dl/file $pats -d dl/x > /dev/null 2>&1 ;;
                *) tar -xf dl/file -C dl/x --wildcards $pats > /dev/null 2>&1 ;;
              esac
              (cd dl/x && find . -type f | LC_ALL=C sort) | while read -r m; do
                { echo "### ${m#./}"; echo; echo '```'; head -c 100000 "dl/x/$m"; echo; echo '```'; echo; } >> list.md
              done
              rm -rf dl/x
            fi
            set +f
          }
          { echo "# distinfo"; echo; echo '```'; echo "TIMESTAMP = $(date +%s)"; } > report.md
          : > dl/sums
          for u in $SUMS; do
            if curl -fsSL --retry 3 -o dl/sum1 "$u"; then echo "ok    the checksum file $u" >> notes.txt; cat dl/sum1 >> dl/sums
            else echo "FAIL  the checksum file $u: not fetched" >> notes.txt; rc=1; fi
          done
          for f in $FILES; do
            name="${f%%=*}"; sha=""; size=""; sha5=""
            for u in $(echo "${f#*=}" | tr ',' ' '); do
              rm -f dl/file
              if ! curl -fsSL --retry 3 -o dl/file "$u"; then
                echo "FAIL  $name: $u not fetched" >> notes.txt; rc=1; continue
              fi
              s="$(sha256sum dl/file | cut -d' ' -f1)"; z="$(stat -c %s dl/file)"
              s5="$(sha512sum dl/file | cut -d' ' -f1)"
              echo "ok    $name: $u, $z bytes, SHA-256 $s" >> notes.txt
              if [ -z "$sha" ]; then sha="$s"; size="$z"; sha5="$s5"; [ -z "$LIST" ] || contents "$name"
              elif [ "$s:$z" != "$sha:$size" ]; then echo "FAIL  $name: $u gives another file" >> notes.txt; rc=1; fi
            done
            [ -n "$sha" ] || continue
            if [ -s dl/sums ]; then
              base="${name##*/}"
              if awk -v f="$base" -v s="$sha" -v s5="$sha5" '($1 == s || $1 == s5) && ($2 == f || $2 == "*" f) { ok = 1 } END { exit !ok }' dl/sums; then
                echo "ok    $name: the SHA-256 or SHA-512 of $base in the checksum file" >> notes.txt
              else
                echo "FAIL  $name: $base is not in the checksum file with this SHA-256 or SHA-512" >> notes.txt; rc=1
              fi
            fi
            { echo "SHA256 ($name) = $sha"; echo "SIZE ($name) = $size"; } >> report.md
          done
          { echo '```'; echo; echo '```'; cat notes.txt; echo '```'; } >> report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # the report into the branch runs of the private azsupport/azsupport (secret RUNS_TOKEN)
      - name: Report to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: files=${{ inputs.files }} sums=${{ inputs.sums }}
          RUNS_STEPS: sum=${{ steps.sum.outcome }}
        run: sh tools/runs-report.sh report.md files

      # what is in the files (list), a report of its own
      - name: The contents, to azsupport/azsupport
        if: always() && inputs.list != ''
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: files=${{ inputs.files }} list=${{ inputs.list }}
          RUNS_STEPS: sum=${{ steps.sum.outcome }}
        run: sh tools/runs-report.sh list.md list
