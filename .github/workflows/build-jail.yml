name: Build the packages of the repository azsupport in the jails

# build.yml without the VM: the same tools/build.sh, checks, tests, reports and publish,
# on a self-hosted runner (github-act-runner) in a FreeBSD jail of a build server
# (labels self-hosted, azbuild and the name of the runner). What differs from build.yml:
# - tools/build.sh runs in the jail itself; each port in its chroot as always, but its
#   base system is the world of the level of the run (AZSUPPORT_WORLD of tools/build.sh), built
#   in the jail from the sources of the release (/usr/src, read only) with make.conf and
#   src.conf of that level (freebsd/<level>/ of the private azsupport/azsupport, secret
#   RUNS_TOKEN; x86-64-v2, x86-64-v3 and x86-64-v4 alike, each world made only before a
#   build of its level): the step "The world of the level" builds it again when one of
#   the three changed
#   (buildworld, installworld and distribution, then it takes the place of the old one);
#   the public log says "up to date" or "built" and why, nothing of the files;
# - the work directory (WRKDIRPREFIX, the chroots, the queue, the packages of the run)
#   is /var/azbuild/work/<level> of the jail (tmpfs), and the caches are directories of
#   the jail that stay between the runs (/var/azbuild/cache): the repository of each
#   branch and level, the distribution files, the official ports tree (AZSUPPORT_PORTSDIR at
#   the commit of tools/build.sh), the caches of the ports (AZSUPPORT_PORT_CACHE), the objects
#   of the worlds; no actions/cache, no draft releases portcache-*;
# - the packages built are saved in the repository of the level in the jail, not as
#   draft releases (tools/runs-save.sh needs the VM): the packages of a job that stopped
#   before tools/build.sh put them there go there at the start of the next job; the
#   drafts of other runs (build.yml, inputs.drafts) are taken and dropped as there;
# - the checks of PHP and the tests run in a root of their own made for the job (the
#   world of the level, read only; a copy of /etc; /var, /usr/local and /tmp empty;
#   this tree, the repository and the work directory at their paths), torn down after
#   them, so that what they install and start never reaches the jail of the runner;
# - up to "jobs" ports at once, each with make -j "make_jobs" (MAKE_JOBS_NUMBER of
#   tools/build.sh): 4 and 4 for the 15 cores and the 24 GB of the processes of the jail
#   (the VM of build.yml: 4 builds of make -j 4 in 12 GB);
# - a job has up to 23 hours (GITHUB_TOKEN lasts 24): no port starts after 18, the
#   builds still going stop at 19; the next run goes on as in build.yml;
# - the progress report (tools/runs-progress.sh, RUNS_LOCAL) reads the files here.
# Started by hand: Actions, "Build the packages of the repository azsupport in the jails".

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'
      cputype:
        description: 'x86-64 level (CPUTYPE of make.conf)'
        type: choice
        options: [x86-64-v3, x86-64-v2, x86-64-v4, both]
        default: x86-64-v3
      runner:
        description: 'The runner: level (x86-64-v3 and x86-64-v4 on azbuild1, x86-64-v2 on azbuild2: the caches of a level stay on its runner), any (the first free one), azbuild1 or azbuild2'
        type: choice
        options: [level, any, azbuild1, azbuild2]
        default: level
      ports:
        description: 'Ports to build (category/port, separated by spaces; with the ports of this tree they need), in groups separated by " ; " built one after another; empty: all, azsupport first, then PHP 5.6, 7.4, 8.1, 8.3, 8.2, 8.4, then the rest'
        required: false
        default: ''
      force:
        description: 'Build the ports also when their package with the same azsupport_hash is in the release already'
        type: boolean
        default: false
      jobs:
        description: 'Ports built at once (AZSUPPORT_JOBS of tools/build.sh, in waves); 1: one after another'
        required: false
        default: '4'
      make_jobs:
        description: 'make -j of each port (MAKE_JOBS_NUMBER of tools/build.sh): jobs times this many processes compile at once'
        required: false
        default: '4'
      configure_check:
        description: 'The configure check: each PHP port built configured once more, permissive, and compared (results/configure-check.txt); with force: every PHP port'
        type: boolean
        default: false
      plan:
        description: 'The plan only: azsupport/azsupport and the ports it needs built when they are to be, every other port decided (kept or to be built, and why: results/plan.txt), not built; no checks, never published'
        type: boolean
        default: false
      fork_ref:
        description: 'The branch of azsupport/php-src the curl of azsupport (azsupport/azsupport/files/curl*) has to be the same as (tools/curl-sync-check.sh): master, or the branch of the fork with a change of curl not yet in master'
        required: false
        default: 'master'
      publish:
        description: 'Publish the repository (the release the servers read) when everything built and every check passed'
        type: boolean
        default: false
      tests_nonblocking:
        description: 'Tests (their names: node node18 ...) whose FAIL does not keep the run from being published, for a publish of a few ports while the packages of those programs are the ones of the release (stale against this tree until a run builds them); empty: every FAIL keeps it'
        required: false
        default: ''
      publish_only:
        description: 'With publish: publish only when the repository differs from the release by packages of these ports alone (category/port, separated by spaces), else nothing; empty: whatever differs'
        required: false
        default: ''
      continuation:
        description: 'Set by a run whose time was over for the run it starts (its number in a row); 0 for a run started by hand'
        required: false
        default: '0'
      drafts:
        description: 'Other branches whose drafts wip-<level>-<branch>-* this run takes too, as those of its own (separated by spaces), once those branches went into this one'
        required: false
        default: ''
      php_checks:
        description: 'PHP versions to install and check (tools/install-php.sh, tools/check-php.sh) also when this run neither built nor took from a draft a package of theirs (separated by spaces, e.g. "7.4 8.1"; all: every core phpXY of the repository)'
        required: false
        default: ''

permissions:
  contents: write
  # the next run of this workflow, when the time of one was over (the last step)
  actions: write

defaults:
  run:
    shell: bash -e {0}

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner == 'any' && '["self-hosted", "azbuild"]' || format('["self-hosted", "azbuild", "{0}"]', inputs.runner == 'level' && (matrix.cputype == 'x86-64-v2' && 'azbuild2' || 'azbuild1') || inputs.runner)) }}
    timeout-minutes: 1380
    # both: x86-64-v3 first, then x86-64-v2 (the order of aZ, 11.11.2026)
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cputype: ${{ inputs.cputype == 'both' && fromJSON('["x86-64-v3", "x86-64-v2"]') || fromJSON(format('["{0}"]', inputs.cputype)) }}
    name: build (${{ matrix.cputype }})
    # the group of build.yml: a run here and one there of the same release, level and
    # branch never go at once (both publish the same release)
    concurrency:
      group: azsupport-ports-${{ inputs.release }}-${{ matrix.cputype }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # the start of the job (the time of the build is reckoned from it) and the files of
      # this job (AZSUPPORT_RUNS_STATE: in its temporary directory, which goes with the job)
      - name: The start of the job
        run: |
          echo "AZSUPPORT_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          st="${RUNNER_TEMP:-/tmp}/azsupport-runs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.cputype }}"
          mkdir -p "$st"
          echo "AZSUPPORT_RUNS_STATE=$st" >> "$GITHUB_ENV"
          # a progress reporter that a job before left (stopped before its end), with the
          # sleep or the command it waits for (stopped first, so that it starts no other)
          for p in $(pgrep -f 'tools/runs-progress.sh'); do kill -STOP "$p"; pkill -P "$p"; kill -KILL "$p"; done 2> /dev/null || :
          echo "the jail: $(freebsd-version -u), $(cpuset -g -p $$ | sed -n '1s/^[^:]*: *//p' | tr ',' '\n' | grep -c .) cores"

      - uses: actions/checkout@v5

      # work/, packages/, distfiles/, repo/ and portcache/ of this tree: the directories of
      # the jail (tmpfs for the work, the caches that stay between the runs). The
      # repository of a branch starts as a copy of that of main (as a branch reads the
      # caches of main in build.yml). What a job before left under the work directory
      # (stopped: a chroot of a port, the root of the checks) is unmounted first, and the
      # packages it built that its repository lacks go there
      - name: The work directory and the caches of the jail
        env:
          LEVEL: ${{ matrix.cputype }}
        run: |
          W="/var/azbuild/work/$LEVEL"; CR="/var/azbuild/work/check-$LEVEL"; C=/var/azbuild/cache
          if [ ! -d /var/azbuild/work ] || [ ! -d "$C" ]; then
            echo "::error title=jail::no /var/azbuild/work or /var/azbuild/cache: this runner is not the jail of a build server"
            exit 1
          fi
          b="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          R="$C/repo/$b/$LEVEL"
          o="$(cat "$W/.owner" 2> /dev/null || :)"
          if [ -n "$o" ] && [ -d "$o" ] && [ -d "$W/packages/All" ]; then
            n=0
            for f in $(cat "$W"/queue/made-* 2> /dev/null | LC_ALL=C sort -u); do
              p="$W/packages/All/${f##*/}"
              case "$p" in *.pkg) ;; *) continue ;; esac
              [ -f "$p" ] && [ ! -e "$o/${p##*/}" ] || continue
              cp -p "$p" "$o/" && n=$((n + 1))
            done
            echo "the packages of the job before that its repository lacked, there now: $n"
          fi
          for d in "$CR" "$W"; do
            [ -e "$d" ] || continue
            mount -p | awk -v d="$d" '$2 == d || index($2, d "/") == 1 { print length($2), $2 }' | sort -rn | cut -d ' ' -f 2- |
              while read -r m; do umount -f "$m" || echo "cannot unmount $m"; done
            if [ -n "$(mount -p | awk -v d="$d" '$2 == d || index($2, d "/") == 1')" ]; then
              echo "::error title=work::still mounted under $d"
              exit 1
            fi
            chflags -R 0 "$d" 2> /dev/null || :
            rm -rfx "$d"
          done
          mkdir -p "$W/packages" "$C/distfiles" "$C/portcache/$LEVEL" "$C/repo/$b"
          if [ ! -d "$R" ]; then
            if [ "$b" != main ] && [ -d "$C/repo/main/$LEVEL" ]; then
              cp -Rp "$C/repo/main/$LEVEL" "$R"
              echo "the repository of $b: a copy of that of main ($(ls "$R" | wc -l | tr -d ' ') files)"
            else
              mkdir -p "$R"
            fi
          fi
          echo "$R" > "$W/.owner"
          for l in work packages distfiles repo portcache; do
            [ -e "$l" ] && [ ! -L "$l" ] && { echo "::error title=work::$l is in the tree already"; exit 1; }
          done
          ln -sfn "$W" work; ln -sfn "$W/packages" packages; ln -sfn "$C/distfiles" distfiles
          ln -sfn "$R" repo; ln -sfn "$C/portcache/$LEVEL" portcache
          echo "AZSUPPORT_W=$W" >> "$GITHUB_ENV"; echo "AZSUPPORT_CR=$CR" >> "$GITHUB_ENV"
          echo "the work directory: $(df -h "$W" | awk 'NR == 2 { print $4 " free of " $2 }'); the repository: $(ls repo | wc -l | tr -d ' ') files"

      # the official tree at the commit of tools/build.sh, kept between the runs (git,
      # depth 1); tools/build.sh takes it as it is (AZSUPPORT_PORTSDIR)
      - name: The official ports tree at the commit of tools/build.sh
        run: |
          P=/var/azbuild/cache/freebsd-ports
          commit="$(sed -n 's/^ports_commit="\([0-9a-f]*\)".*/\1/p' tools/build.sh)"
          [ -n "$commit" ] || { echo "::error title=ports tree::no ports_commit in tools/build.sh"; exit 1; }
          if [ "$(git -C "$P" rev-parse HEAD 2> /dev/null)" != "$commit" ]; then
            ok=0
            for i in 1 2 3; do
              if [ ! -d "$P/.git" ]; then
                rm -rf "$P"; mkdir -p "$P"
                git -C "$P" init -q && git -C "$P" remote add origin https://github.com/freebsd/freebsd-ports
              fi
              if timeout 1800 git -C "$P" fetch -q --depth 1 origin "$commit" && git -C "$P" checkout -q -f FETCH_HEAD &&
                git -C "$P" clean -q -f -d -x; then
                ok=1; break
              fi
              echo "the official tree: try $i of 3 failed"
              sleep $((i * 30))
            done
            [ "$ok" = 1 ] || { echo "::error title=ports tree::no official tree at $commit"; exit 1; }
            git -C "$P" reflog expire --expire=now --all 2> /dev/null || :
            git -C "$P" gc -q --prune=now 2> /dev/null || :
          fi
          echo "AZSUPPORT_PORTSDIR=$P" >> "$GITHUB_ENV"
          echo "the official ports tree at $commit"

      # with the files of the release (tools/build.sh keeps the newer package of an origin)
      - name: The repository of the release, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
        run: |
          major="${RELEASE%%.*}"
          tag="azsupport-fbsd$major-amd64-${CPUTYPE#x86-64-}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir repo --skip-existing || echo "::warning title=repository::the files of the release $tag did not all download: the ports whose package is missing are built again"
          else
            echo "no release $tag yet"
          fi
          echo "repo/: $(ls repo | wc -l | tr -d ' ') files"

      # the packages that runs elsewhere saved as they were built (tools/runs-save.sh of
      # build.yml: draft releases wip-<level>-<branch>-<run>-<attempt>) and that no publish
      # took yet, as in build.yml; dropped once a publish has them (the step after Publish)
      - name: The packages saved by the runs before, not published yet
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CPUTYPE: ${{ matrix.cputype }}
          DRAFTS: ${{ inputs.drafts }}
        run: |
          : > "$AZSUPPORT_RUNS_STATE/wip-taken"
          : > drafts-packages.txt
          b="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          pres="wip-$CPUTYPE-$b-"
          for o in $DRAFTS; do
            pres="$pres wip-$CPUTYPE-$(printf '%s' "$o" | tr -c 'A-Za-z0-9._-' '-')-"
          done
          # pages <path> <jq> <file> [<per page>]: the releases 10 a page, as each comes with
          # all its files (100 a page took GitHub 10 s, its limit: HTTP 504, run 45623903407,
          # 25.11.2026), the files of a draft 100 a page
          pages() {
            : > "$3"
            p=1
            while [ "$p" -le 200 ]; do
              t=1
              until gh api "${1}per_page=${4:-100}&page=$p" --jq "$2" > "$AZSUPPORT_RUNS_STATE/page"; do
                [ "$t" -ge 5 ] && return 1
                echo "page $p of ${1%%\?*}: try $t failed, again in 20 s"
                t=$((t + 1)); sleep 20
              done
              [ -s "$AZSUPPORT_RUNS_STATE/page" ] || return 0
              cat "$AZSUPPORT_RUNS_STATE/page" >> "$3"
              p=$((p + 1))
            done
          }
          pages "repos/$GITHUB_REPOSITORY/releases?" '.[] | "\(.draft) \(.id) \(.tag_name)"' "$AZSUPPORT_RUNS_STATE/releases" 10 ||
            { echo "::warning title=saved packages::no list of the releases after 5 tries: no draft taken, what they have is built again"; exit 0; }
          awk -v pres="$pres" 'BEGIN { n = split(pres, P, " ") }
            $1 == "true" { for (i = 1; i <= n; i++) if (index($3, P[i]) == 1) { print $2, $3; next } }' \
            "$AZSUPPORT_RUNS_STATE/releases" > "$AZSUPPORT_RUNS_STATE/wip-drafts"
          [ -s "$AZSUPPORT_RUNS_STATE/wip-drafts" ] || { echo "no draft $(echo "$pres" | sed 's/- */-* /g'): nothing to take"; exit 0; }
          echo "the drafts of $pres: $(wc -l < "$AZSUPPORT_RUNS_STATE/wip-drafts" | tr -d ' ')"
          while read -r id tag; do
            n=0; bad=0
            if ! pages "repos/$GITHUB_REPOSITORY/releases/$id/assets?" '.[] | "\(.state) \(.id) \(.name)"' "$AZSUPPORT_RUNS_STATE/wip-all"; then
              echo "$tag: no list of its files: left for the next run"; continue
            fi
            awk '$1 == "uploaded" { print $2, $3 }' "$AZSUPPORT_RUNS_STATE/wip-all" > "$AZSUPPORT_RUNS_STATE/wip-assets"
            while read -r aid an; do
              [ -e "repo/$an" ] && continue
              if gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "repo/$an.part"; then
                mv -f "repo/$an.part" "repo/$an"; n=$((n + 1))
              else
                rm -f "repo/$an.part"; bad=$((bad + 1))
              fi
            done < "$AZSUPPORT_RUNS_STATE/wip-assets"
            if [ "$bad" = 0 ]; then
              echo "$tag: $n of its $(wc -l < "$AZSUPPORT_RUNS_STATE/wip-assets" | tr -d ' ') packages into repo/ (the others were there)"
              echo "$id $tag" >> "$AZSUPPORT_RUNS_STATE/wip-taken"
              awk '{ print $2 }' "$AZSUPPORT_RUNS_STATE/wip-assets" >> drafts-packages.txt
            else
              echo "::warning title=saved packages::$tag: $n packages into repo/, $bad did not download (the draft stays for the next run)"
            fi
          done < "$AZSUPPORT_RUNS_STATE/wip-drafts"

      # the release tarballs of azsupport/php-src the PHP ports need, fetched with retries
      # (the build fetches again what is missing: MASTER_SITES of the port)
      - name: The PHP tarballs of azsupport/php-src, fetched with retries
        run: |
          mkdir -p distfiles/php
          sed -n 's/^SHA256 (php\/\(php-[0-9][^)]*-fbsd-[^)]*\.tar\.xz\)) = \([0-9a-f]*\)$/\1 \2/p' lang/php*/distinfo | sort -u > "$AZSUPPORT_RUNS_STATE/php-tarballs"
          while read -r f sum; do
            v="${f#php-}"; v="${v%%-fbsd-*}"; rel="${f#*-fbsd-}"; rel="${rel%.tar.xz}"
            d="distfiles/php/$f"
            if [ -f "$d" ] && [ "$(sha256 -q "$d")" = "$sum" ]; then echo "have $f"; continue; fi
            u="https://github.com/azsupport/php-src/releases/download/freebsd-${v%.*}-$rel/$f"
            if curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o "$d.part" "$u" &&
              [ "$(sha256 -q "$d.part")" = "$sum" ]; then
              mv "$d.part" "$d"; echo "fetched $f"
            else
              rm -f "$d.part"; echo "::warning title=distfiles::$f did not download here ($u): the build tries again"
            fi
          done < "$AZSUPPORT_RUNS_STATE/php-tarballs"

      - name: The ports of this tree checked with make -V (bmake, a sparse official tree)
        env:
          CPUTYPE: ${{ matrix.cputype }}
          RELEASE: ${{ inputs.release }}
        run: sh tools/check-tree-ci.sh "$RELEASE" "$CPUTYPE"

      - name: The curl of azsupport and that of azsupport/php-src
        env:
          FORK_REF: ${{ inputs.fork_ref || 'master' }}
        run: |
          set -o pipefail
          sh tools/curl-sync-check.sh 2>&1 | tee curl-sync-check.txt

      # from the private azsupport/azsupport (secret RUNS_TOKEN), as in build.yml: the build
      # tests into tools/ (they are in .gitignore here), the distribution files no one may
      # fetch or mirror into distfiles/ (a directory of the jail, never a cache of
      # GitHub), and make.conf and src.conf of the world of the level (freebsd/<level>/),
      # into the files of this job: never into the tree, the log or a report
      - name: The build tests, the private distfiles and the make.conf and src.conf of the world
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          LEVEL: ${{ matrix.cputype }}
        run: |
          if [ -z "$RUNS_TOKEN" ]; then
            echo "::error title=world::no RUNS_TOKEN: no make.conf and src.conf of the world of $LEVEL (and no tests)"
            exit 1
          fi
          t="$AZSUPPORT_RUNS_STATE/azsupport-tests.tgz"
          curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer $RUNS_TOKEN" -H "Accept: application/vnd.github+json" \
            -o "$t" "https://api.github.com/repos/azsupport/azsupport/tarball/main"
          tar -xzf "$t" -C tools --strip-components=3 '*/tests/ports/*'
          echo "tests in tools/: $(ls tools/test-programs.sh tools/*-test.sh 2> /dev/null | wc -l | tr -d ' ') scripts"
          ref="$AZSUPPORT_RUNS_STATE/ref"
          mkdir -p "$ref"
          (umask 077 && tar -xzf "$t" -C "$ref" --strip-components=2 "*/freebsd/$LEVEL/make.conf" "*/freebsd/$LEVEL/src.conf") || :
          (umask 077 && tar -xzf "$t" -C "$ref" --strip-components=2 "*/freebsd/world-obj") 2> /dev/null || :
          if [ ! -s "$ref/$LEVEL/make.conf" ] || [ ! -s "$ref/$LEVEL/src.conf" ]; then
            echo "::error title=world::no make.conf and src.conf of $LEVEL in azsupport/azsupport"
            exit 1
          fi
          echo "AZSUPPORT_WORLD_REF=$ref/$LEVEL" >> "$GITHUB_ENV"
          mkdir -p "$AZSUPPORT_RUNS_STATE/azsupport-dist"
          tar -xzf "$t" -C "$AZSUPPORT_RUNS_STATE/azsupport-dist" --strip-components=2 '*/distfiles/*' 2> /dev/null || :
          for f in "$AZSUPPORT_RUNS_STATE"/azsupport-dist/*; do
            [ -f "$f" ] || continue
            n="${f##*/}"
            case "$n" in README*) continue ;; esac
            mv -f "$f" "distfiles/$n"
            echo "private distfile: $n ($(wc -c < "distfiles/$n" | tr -d ' ') bytes)"
          done
          rm -f "$t"

      # the base system of the chroots of the ports and of the root of the checks: the
      # world of the level (/var/azbuild/world/<level>), built from /usr/src of the jail
      # (the sources of the release, read only) with make.conf and src.conf of the level.
      # Its stamp (.az-world: the SHA-256 of the two and of sys/conf/newvers.sh, the date)
      # differs, or there is none: buildworld (the objects in the cache: the next time only
      # what changed), installworld and distribution into <level>.new, which then takes its
      # place. The objects: those of the server where the root of the jail was built
      # (section 1 of github-runner/README.md of azsupport/azsupport), mounted in the jail
      # at the path they were made at, which freebsd/world-obj of azsupport/azsupport names
      # (read here, never written to the log: no path of a server in this repository), so
      # that make finds them as they were made (their paths are absolute) and buildworld
      # goes on from them, building only what changed (aZ, 24.11.2026 21:00: «у тебя же
      # была возможность obj подмоунтить из хоста?»); without them, those of the cache
      # (/var/azbuild/cache/obj/<level>), a whole buildworld the first time. The log of
      # make goes only with the private results of the tests
      - name: The world of the level
        env:
          LEVEL: ${{ matrix.cputype }}
        run: |
          ref="$AZSUPPORT_WORLD_REF"; wd=/var/azbuild/world; wl="$wd/$LEVEL"
          [ -d "$wd" ] || { echo "::error title=world::no /var/azbuild/world in the jail"; exit 1; }
          [ -f /usr/src/sys/conf/newvers.sh ] || { echo "::error title=world::no sources of the release in /usr/src"; exit 1; }
          want="$(sha256 -q "$ref/make.conf") $(sha256 -q "$ref/src.conf") $(sha256 -q /usr/src/sys/conf/newvers.sh)"
          have="$(sed -n 1p "$wl/.az-world" 2> /dev/null | cut -d ' ' -f 1-3)"
          if [ "$have" = "$want" ] && [ -x "$wl/bin/sh" ] && [ -f "$wl/usr/lib/crt1.o" ]; then
            echo "world $LEVEL: up to date"
          else
            why=""
            if [ -z "$have" ]; then
              why="none yet"
            else
              set -- $have; h1="$1"; h2="$2"; h3="$3"
              set -- $want
              [ "$h1" = "$1" ] || why="make.conf changed"
              [ "$h2" = "$2" ] || why="${why:+$why, }src.conf changed"
              [ "$h3" = "$3" ] || why="${why:+$why, }src changed"
              [ -n "$why" ] || why="incomplete"
            fi
            t0="$(date +%s)"
            n="$(cpuset -g -p $$ | sed -n '1s/^[^:]*: *//p' | tr ',' '\n' | grep -c .)"
            [ "$n" -ge 1 ] || n=2
            op="$(sed -n 1p "$ref/../world-obj" 2> /dev/null)"
            if [ -n "$op" ] && [ -d "$op" ]; then
              obj="$op/$LEVEL"
              echo "world $LEVEL: the objects of the server"
            else
              obj="/var/azbuild/cache/obj/$LEVEL"
              echo "::warning title=world::the objects of the server are not in the jail (freebsd/world-obj and its mount): those of the cache"
            fi
            new="$wl.new"; old="$wl.old"
            log="$AZSUPPORT_RUNS_STATE/world-$LEVEL.log"
            for d in "$new" "$old"; do
              [ -e "$d" ] || continue
              chflags -R 0 "$d" 2> /dev/null || :
              rm -rfx "$d"
            done
            mkdir -p "$obj" "$new"
            mk="make -C /usr/src __MAKE_CONF=$ref/make.conf SRCCONF=$ref/src.conf"
            if env MAKEOBJDIRPREFIX="$obj" $mk -j"$n" buildworld > "$log" 2>&1 &&
              env MAKEOBJDIRPREFIX="$obj" $mk installworld DESTDIR="$new" NO_FSCHG=yes >> "$log" 2>&1 &&
              env MAKEOBJDIRPREFIX="$obj" $mk distribution DESTDIR="$new" NO_FSCHG=yes >> "$log" 2>&1 &&
              [ -x "$new/bin/sh" ] && [ -f "$new/usr/lib/crt1.o" ]; then
              [ ! -e "$wl" ] || mv "$wl" "$old"
              mv "$new" "$wl"
              echo "$want $(date -u +%Y-%m-%dT%H:%MZ)" > "$wl/.az-world"
              if [ -e "$old" ]; then chflags -R 0 "$old" 2> /dev/null || :; rm -rfx "$old"; fi
              echo "world $LEVEL: built ($why), $(( ($(date +%s) - t0) / 60 )) min"
            else
              mkdir -p results/tests && cp "$log" results/tests/
              echo "::error title=world::world $LEVEL: FAIL ($why), $(( ($(date +%s) - t0) / 60 )) min: the log of make goes with the private results of the tests"
              exit 1
            fi
          fi
          echo "AZSUPPORT_WORLD=$wl" >> "$GITHUB_ENV"

      # the time tools/build.sh has (AZSUPPORT_TIME_SOFT, AZSUPPORT_TIME_HARD), from the start of the job,
      # whose limit is 1380 minutes: no port starts after 1080 minutes, the builds still
      # going stop at 1140; the checks, the tests and the publish have the rest
      - name: The time of the build
        run: |
          now="$(date +%s)"; start="${AZSUPPORT_JOB_START:-$now}"
          soft=$((start + 1080 * 60 - now)); hard=$((start + 1140 * 60 - now))
          [ "$soft" -gt 600 ] || soft=600; [ "$hard" -gt "$soft" ] || hard="$soft"
          echo "AZSUPPORT_TIME_SOFT=$soft" >> "$GITHUB_ENV"; echo "AZSUPPORT_TIME_HARD=$hard" >> "$GITHUB_ENV"
          echo "tools/build.sh: no port starts after $((soft / 60)) minutes, the builds still going stop at $((hard / 60))"

      # the progress of the build (GitHub gives the log of a job only when it ends):
      # tools/runs-progress.sh detached (daemon), every 10 minutes into the branch runs of
      # azsupport/azsupport (secret RUNS_TOKEN), reading the files here (RUNS_LOCAL)
      - name: The progress of the build, to azsupport/azsupport
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_LOCAL: '1'
          PART: ${{ matrix.cputype }}
        run: |
          daemon -f -p "$AZSUPPORT_RUNS_STATE/runs-progress.pid" -o "$AZSUPPORT_RUNS_STATE/runs-progress.log" sh tools/runs-progress.sh "$PART" 10
          echo "tools/runs-progress.sh: every 10 minutes"

      # tools/build.sh in the jail, then the checks as in the VM of build.yml, each in the
      # root of the checks (cr_up: the world of the level read only, a copy of /etc, /var
      # of BSD.var.dist, an empty /usr/local, devfs, the cache of pkg, this tree, the
      # repository and the work directory at their paths), torn down at the end with what
      # the tests left running there (cr_down). The script never stops before its end:
      # what failed goes into results/rc, and a step after fails the job on it
      - name: Build and check in the jail
        id: build
        env:
          AZSUPPORT_CPUTYPE: ${{ matrix.cputype }}
          AZSUPPORT_PORTS: ${{ inputs.ports }}
          AZSUPPORT_FORCE: ${{ inputs.force && '1' || '' }}
          AZSUPPORT_JOBS: ${{ inputs.jobs || '4' }}
          MAKE_JOBS_NUMBER: ${{ inputs.make_jobs || '4' }}
          AZSUPPORT_CONFIGURE_CHECK: ${{ inputs.configure_check && '1' || '' }}
          AZSUPPORT_PLAN: ${{ inputs.plan && '1' || '' }}
          AZSUPPORT_PHP_CHECKS: ${{ inputs.php_checks }}
          AZSUPPORT_TESTS_NONBLOCKING: ${{ inputs.tests_nonblocking }}
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          set +e
          kf="$AZSUPPORT_RUNS_STATE/azsupport-pkg-key.b64"
          CR="$AZSUPPORT_CR"
          ws="$(pwd -P)"
          cr_mounts() {
            mount -p | awk -v d="$CR" '$2 == d || index($2, d "/") == 1 { print length($2), $2 }' | sort -rn | cut -d ' ' -f 2-
          }
          cr_kill() {
            for i in 1 2 3; do
              p="$(procstat -f -a 2> /dev/null | awk -v d="$CR" '$3 == "root" && ($NF == d || index($NF, d "/") == 1) { print $1 }' | sort -u | tr '\n' ' ')"
              [ -n "$p" ] || return 0
              kill -9 $p 2> /dev/null
              sleep 2
            done
          }
          cr_down() {
            [ -e "$CR" ] || return 0
            cr_kill
            for m in $(cr_mounts); do umount "$m" 2> /dev/null || umount -f "$m" 2> /dev/null || echo "cannot unmount $m"; done
            [ -z "$(cr_mounts)" ] || { echo "the root of the checks stays: still mounted there"; return 1; }
            chflags -R 0 "$CR" 2> /dev/null
            rm -rfx "$CR"
          }
          cr_mnt() { mkdir -p "$CR$2" && mount -t nullfs -o "$1" "$3" "$CR$2"; }
          cr_up() {
            cr_down || return 1
            mkdir -p "$CR" || return 1
            for d in /bin /sbin /lib /libexec /usr/bin /usr/sbin /usr/lib /usr/lib32 /usr/libexec /usr/include /usr/share /usr/libdata; do
              [ -d "$AZSUPPORT_WORLD$d" ] || continue
              cr_mnt ro "$d" "$AZSUPPORT_WORLD$d" || return 1
            done
            mkdir -p "$CR/etc" "$CR/tmp" "$CR/var" "$CR/root" "$CR/home" "$CR/usr/local" "$CR/dev" && chmod 1777 "$CR/tmp" || return 1
            (cd /etc && tar -cf - --exclude ./ssh .) | (cd "$CR/etc" && tar -xpf -) || return 1
            mtree -deU -f "$CR/etc/mtree/BSD.var.dist" -p "$CR/var" > /dev/null || return 1
            mount -t devfs devfs "$CR/dev" || return 1
            cr_mnt rw /var/cache/pkg /var/cache/pkg || return 1
            cr_mnt rw "$ws" "$ws" || return 1
            cr_mnt rw "$AZSUPPORT_W" "$AZSUPPORT_W" || return 1
            r="$(realpath repo)" && cr_mnt ro "$r" "$r" || return 1
            chroot "$CR" /usr/sbin/service ldconfig start > /dev/null 2>&1
            return 0
          }
          cr_run() {
            chroot "$CR" /usr/bin/env -i HOME=/root USER=root LOGNAME=root SHELL=/bin/sh TERM=dumb \
              PATH=/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/sbin:/usr/local/bin ASSUME_ALWAYS_YES=yes \
              /bin/sh -c "cd '$ws' && $1" < /dev/null
          }
          trap 'cr_down > /dev/null 2>&1; rm -f "$kf"' EXIT
          if [ -n "${PKG_SIGNING_KEY:-}" ]; then
            (umask 077 && printf '%s\n' "$PKG_SIGNING_KEY" | openssl base64 -A > "$kf")
            export AZSUPPORT_PKG_KEY_FILE="$kf"
          else
            echo "::warning title=signing key::no PKG_SIGNING_KEY: the repository will not be signed (and not published)"
          fi
          unset PKG_SIGNING_KEY
          export AZSUPPORT_WORLD AZSUPPORT_PORTSDIR
          rc=0
          sh tools/build.sh ${AZSUPPORT_FORCE:+--force} --repo repo $AZSUPPORT_PORTS || rc=$?
          mkdir -p results
          echo "$rc" > results/rc
          : > results/checks.txt
          if [ -s results/debug-check.txt ]; then
            nd="$(grep -c . results/debug-check.txt || :)"
            nf="$(grep -c '^FAIL' results/debug-check.txt || :)"
            if [ "$nf" -gt 0 ]; then
              echo "debug: FAIL ($nf of $nd packages of this run with debug information or not stripped: $(awk '$1 == "FAIL" { sub(/:$/, "", $2); printf "%s ", $2 }' results/debug-check.txt)- results/debug-check.txt)" >> results/checks.txt
              rc=1
            else
              echo "debug: OK ($nd packages of this run: no debug information, stripped)" >> results/checks.txt
            fi
          fi
          if [ -s results/docs-check.txt ]; then
            nd="$(grep -c . results/docs-check.txt || :)"
            nf="$(grep -c '^FAIL' results/docs-check.txt || :)"
            if [ "$nf" -gt 0 ]; then
              echo "docs: FAIL ($nf of $nd packages with manual pages, docs or info pages: $(awk '$1 == "FAIL" { sub(/:$/, "", $2); printf "%s ", $2 }' results/docs-check.txt | cut -c1-600)- results/docs-check.txt)" >> results/checks.txt
              rc=1
            else
              echo "docs: OK ($nd packages of the repository: no manual pages, docs or info pages)" >> results/checks.txt
            fi
          fi
          if [ -n "${AZSUPPORT_PLAN:-}" ]; then
            echo "plan (AZSUPPORT_PLAN): no checks and no tests (results/plan.txt)" >> results/checks.txt
          elif [ -f results/time-limit ]; then
            echo "time limit: no checks and no tests, the next run goes on ($(head -n 1 results/time-limit); results/time-limit)" >> results/checks.txt
          elif ! cr_up; then
            echo "checks: FAIL (no root of the checks)" >> results/checks.txt
            rc=1
          else
          crepo=repo
          if [ ! -f repo/meta.conf ] && [ -f work/repo-unsigned/meta.conf ]; then
            crepo=work/repo-unsigned
            echo "unsigned catalog: checks only, not published (work/repo-unsigned; $(tail -n 1 results/pkg-repo.log 2> /dev/null || echo 'no pkg-repo.log'))" >> results/checks.txt
          fi
          pv="$({ awk '$1 ~ /\// && $2 == "OK" { print $3 }' results/summary.txt 2> /dev/null; cat drafts-packages.txt 2> /dev/null; } | sed -n -E 's/^(mod_)?php([0-9])([0-9])-.*/\2.\3/p')"
          case " ${AZSUPPORT_PHP_CHECKS:-} " in
            *" all "*) pv="$pv $(ls "$crepo" 2> /dev/null | sed -n -E 's/^php([0-9])([0-9])-[0-9][^/]*\.pkg$/\1.\2/p')" ;;
            *) pv="$pv ${AZSUPPORT_PHP_CHECKS:-}" ;;
          esac
          for v in $(printf '%s\n' $pv | grep -E '^[0-9]\.[0-9]$' | sort -u); do
            core="lang/php$(echo "$v" | tr -d .)"
            cl="$(awk -v o="$core" '$1 == o { print; exit }' results/summary.txt 2> /dev/null || true)"
            if [ ! -f "$crepo/meta.conf" ]; then
              echo "PHP $v: SKIP (no catalog in $crepo: $(tail -n 1 results/pkg-repo.log 2> /dev/null || echo 'no pkg-repo.log'))" >> results/checks.txt
              continue
            fi
            case "$cl" in
              *" OK "*|*"in the repository already"*) ;;
              *) echo "PHP $v: SKIP (the core $core is not there: ${cl:-not in the queue})" >> results/checks.txt; continue ;;
            esac
            r=0
            cr_run "sh tools/install-php.sh --repo '$crepo' '$v'" || r=$?
            if [ "$r" = 3 ]; then
              echo "PHP $v: SKIP (the repository has no core php of $v)" >> results/checks.txt
            elif [ "$r" != 0 ]; then
              echo "PHP $v: FAIL (the packages did not install, exit $r: install-php-$v.log)" >> results/checks.txt
              rc=1
            elif [ ! -f tools/check-php.sh ]; then
              echo "PHP $v: SKIP (no tools/check-php.sh)" >> results/checks.txt
            else
              r=0
              cr_run "sh tools/check-php.sh '$v'" || r=$?
              if [ "$r" = 0 ]; then
                echo "PHP $v: OK (check-php-$v.txt)" >> results/checks.txt
              else
                echo "PHP $v: FAIL (check-php-$v.txt, exit $r)" >> results/checks.txt
                rc=1
              fi
              if [ -n "$(ls "$crepo"/php"$(echo "$v" | tr -d .)"-*-openssl-[0-9]*.pkg 2> /dev/null)" ]; then
                r=0
                cr_run "sh tools/install-php.sh --repo '$crepo' --openssl '$v'" || r=$?
                if [ "$r" != 0 ]; then
                  echo "PHP $v, the variants with OpenSSL: FAIL (they did not install, exit $r: install-php-$v-openssl.log)" >> results/checks.txt
                  rc=1
                else
                  r=0
                  cr_run "CHECK_TAG=openssl sh tools/check-php.sh '$v'" || r=$?
                  if [ "$r" = 0 ]; then
                    echo "PHP $v, the variants with OpenSSL: OK (check-php-$v-openssl.txt)" >> results/checks.txt
                  else
                    echo "PHP $v, the variants with OpenSSL: FAIL (check-php-$v-openssl.txt, exit $r)" >> results/checks.txt
                    rc=1
                  fi
                fi
              fi
              vs="$(echo "$v" | tr -d .)"
              if [ -n "$(ls "$crepo"/php"$vs"-redis-*-[0-9]*.pkg "$crepo"/php"$vs"-gd-t1lib-[0-9]*.pkg "$crepo"/php"$vs"-openssl-legacy-[0-9]*.pkg 2> /dev/null)" ]; then
                r=0
                cr_run "sh tools/check-variants.sh '$v'" || r=$?
                if [ "$r" = 0 ]; then
                  echo "PHP $v, the packages of redis, gd and openssl with the same files: OK (check-variants-$v.txt)" >> results/checks.txt
                else
                  echo "PHP $v, the packages of redis, gd and openssl with the same files: FAIL (check-variants-$v.txt, exit $r)" >> results/checks.txt
                  rc=1
                fi
              fi
            fi
          done
          r=0
          if [ -f tools/test-programs.sh ]; then
            mkdir -p results/tests
            cr_run "sh tools/test-programs.sh --repo '$crepo'" > results/tests/test-programs.out 2>&1 || r=$?
          else
            echo "programs: SKIP (no tools/test-programs.sh: the tests of azsupport/azsupport were not fetched)" >> results/checks.txt
          fi
          if [ "$r" = 1 ]; then
            # the FAIL of tests of tests_nonblocking alone does not keep the publish (it
            # stays FAIL in the checks)
            tf="$(awk '/^test [^ ]+: FAIL/ { sub(/^test /, ""); sub(/: FAIL.*/, ""); print }' results/checks.txt | sort -u | tr '\n' ' ')"
            tb=""
            for t in $tf; do
              case " $AZSUPPORT_TESTS_NONBLOCKING " in *" $t "*) ;; *) tb="$tb $t" ;; esac
            done
            if [ -n "$tf" ] && [ -z "$tb" ] && [ -n "$AZSUPPORT_TESTS_NONBLOCKING" ]; then
              echo "tests: the FAIL of ${tf% } does not keep the publish (tests_nonblocking: $AZSUPPORT_TESTS_NONBLOCKING)" >> results/checks.txt
            else
              rc=1
            fi
          fi
          # what the checks and the tests left running in their root (the children of a
          # server they started and did not stop): listed with the private results of the
          # tests, killed by cr_down below
          lp="$(procstat -f -a 2> /dev/null | awk -v d="$CR" '$3 == "root" && ($NF == d || index($NF, d "/") == 1) { print $1 }' | sort -u | tr '\n' ' ')"
          if [ -n "$lp" ]; then
            mkdir -p results/tests
            # shellcheck disable=SC2086
            ps -o pid,ppid,etime,command -p "$(echo $lp | tr ' ' ',')" > results/tests/leftovers.txt 2>&1
            # shellcheck disable=SC2086
            echo "leftovers: WARN $(echo $lp | wc -w | tr -d ' ') processes of the checks and the tests still there after them (killed; leftovers.txt of the private results of the tests)" >> results/checks.txt
          else
            echo "leftovers: OK (no process of the checks and the tests after them)" >> results/checks.txt
          fi
          fi
          cr_down || echo "the root of the checks: not torn down (the next job does it)"
          # the log of make of the world, when this job built one: with the private
          # results of the tests (azsupport/azsupport), never in this log or the artifact
          if ls "$AZSUPPORT_RUNS_STATE"/world-*.log > /dev/null 2>&1; then
            mkdir -p results/tests
            cp "$AZSUPPORT_RUNS_STATE"/world-*.log results/tests/
          fi
          cat results/checks.txt
          echo "$rc" > results/rc
          echo "results/rc: $rc"
          # the work directories of the ports and the chroots away (tmpfs: the memory of
          # the jail); packages/ and the queue stay for the start of the next job
          rm -rfx work/wrk work/ccw 2> /dev/null
          exit 0

      - name: The outcome of the build and of the checks
        id: outcome
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        run: |
          rc="$(cat results/rc 2> /dev/null || echo 'none: the build gave no results/rc')"
          echo "results/rc: $rc"
          if [ "$rc" != 0 ]; then
            echo "::error title=build::the build or a check failed (results/rc: $rc): the summary of the run, the results"
            exit 1
          fi

      # results/tests/ (the outputs of the tests, the log of a world built): into the
      # branch runs of the private azsupport/azsupport as one archive, then away from
      # results/, as in build.yml
      - name: The results of the tests, to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          PART: ${{ matrix.cputype }}
        run: |
          [ -d results/tests ] || { echo "no results/tests: no test ran"; exit 0; }
          a="${GITHUB_RUN_ID}-${PART}-tests.tar.xz"
          tar -cJf "$AZSUPPORT_RUNS_STATE/$a" -C results tests
          mv results/tests "$AZSUPPORT_RUNS_STATE/tests"
          if [ -z "$RUNS_TOKEN" ]; then
            echo "::warning title=test results::no RUNS_TOKEN: the results of the tests are not kept"
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          w="$AZSUPPORT_RUNS_STATE/runs-tests"
          timeout 600 git clone -q --depth 1 --filter=blob:none --no-checkout --branch runs --single-branch \
            "https://x-access-token:${RUNS_TOKEN}@github.com/azsupport/azsupport.git" "$w"
          git -C "$w" sparse-checkout set --no-cone "/ports-build-jail/$day/"
          timeout 600 git -C "$w" checkout -q runs
          mkdir -p "$w/ports-build-jail/$day"
          cp "$AZSUPPORT_RUNS_STATE/$a" "$w/ports-build-jail/$day/$a"
          git -C "$w" add "ports-build-jail/$day/$a"
          git -C "$w" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "ports-build-jail $PART: the results of the tests of run $GITHUB_RUN_ID"
          i=0
          until timeout 300 git -C "$w" push -q origin HEAD:runs; do
            i=$((i + 1)); [ $i -lt 10 ] || { echo "::warning title=test results::push to azsupport/azsupport failed"; exit 0; }
            sleep $((i * 3))
            timeout 600 git -C "$w" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              pull -q --rebase origin runs || :
          done
          echo "the results of the tests: azsupport/azsupport, branch runs, ports-build-jail/$day/$a"

      - name: Report
        id: report
        if: always()
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          export GITHUB_STEP_SUMMARY="$PWD/report.md"
          : > report.md
          rc=0
          sh tools/report.sh results || rc=1
          cat report.md >> "$summary"
          exit $rc

      - name: Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.cputype }}
          path: |
            results/
            !results/tests/
          if-no-files-found: ignore

      # as in build.yml: the release of the level gets the repository (repo/: that of the
      # branch and level in the jail), with the snapshots, the limit of 1000 files and the
      # packages of the same SHA-256 not uploaded again
      - name: Publish
        id: publish
        if: ${{ success() && inputs.publish && !inputs.plan && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          AZSUPPORT_SNAPSHOTS: 31
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          major="${RELEASE%%.*}"
          level="${CPUTYPE#x86-64-}"
          tag="azsupport-fbsd$major-amd64-$level"
          dir=repo
          last="$(tail -n 1 results/pkg-repo.log 2> /dev/null)"
          case "$last" in
            "pkg repo: signed"*) ;;
            *) echo "::error title=publish::the catalog is not signed ($last): not published"; exit 1 ;;
          esac
          if [ -n "$PUBLISH_ONLY" ]; then
            r=0
            sh tools/publish-gate.sh "$dir" "$tag" $PUBLISH_ONLY > gate.md || r=$?
            cat gate.md
            { echo; cat gate.md; } >> report.md
            cat gate.md >> "$summary"
            case "$r" in
              0) ;;
              3) echo "nothing new to publish in $tag"; exit 0 ;;
              1) echo "::warning title=publish::not published: the repository differs from the release $tag by more than $PUBLISH_ONLY (the summary)"; exit 0 ;;
              *) echo "::error title=publish::tools/publish-gate.sh failed (exit $r): not published"; exit 1 ;;
            esac
          fi
          if ! sh tools/release-snapshot.sh before "$tag"; then
            echo "::error title=publish::the release $tag as it is was not kept as a snapshot (tools/release-snapshot.sh): not published"
            exit 1
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          commit="$(sed -n 's/^ports_commit="\([0-9a-f]*\)".*/\1/p' tools/build.sh)"
          php="$(ls "$dir" | sed -n 's/^php\([0-9]\)\([0-9]\)-[0-9][^/]*\.pkg$/\1.\2/p' | sort -u | tr '\n' ' ' | sed 's/ $//; s/ /, /g')"
          notes="A repository of pkg for FreeBSD $major (amd64, CPUTYPE $CPUTYPE) of the packages of $GITHUB_REPOSITORY: the ports of this overlay built over freebsd-ports $commit with the make.conf of tools/make.conf.in: azsupport (the libraries of /usr/local/azsupport), curl (with SCP and SFTP), ffmpeg, ImageMagick6, ImageMagick7, GraphicsMagick, mc, yt-dlp and PHP $php (phpXY with phpXY-apache and the modules phpXY-<module>, phpXY-ssh2 among them). On a server, /usr/local/etc/pkg/repos/azsupport.conf: azsupport: { url: \"$url\", signature_type: \"pubkey\", pubkey: \"/usr/local/etc/pkg/keys/azsupport.pub\", priority: 100, enabled: yes } with the key keys/azsupport.pub of $GITHUB_REPOSITORY, then: pkg update -r azsupport, pkg install -r azsupport php84 php84-apache php84-gd ... (yt-dlp: pkg install yt-dlp, its Python packages are those of FreeBSD; README.md). Each publish is kept also as a release of its own that does not change, $tag-<YYYYMMDD>-<HHMM> (UTC, the newest $AZSUPPORT_SNAPSHOTS): its url in azsupport.conf takes a server back to it (README.md, A server and the repository azsupport)."
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "$notes" --target main ||
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          drop_asset() {
            for t in 1 2 3 4 5; do
              gh release delete-asset "$tag" "$1" --repo "$GITHUB_REPOSITORY" -y && return 0
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qxF "$1" || return 0
              sleep $((t * 10))
            done
            echo "::warning title=publish::$1 not deleted from $tag"
            return 1
          }
          have="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          nhave="$(printf '%s\n' "$have" | grep -c . || :)"
          nnew="$(ls "$dir" | while read -r f; do printf '%s\n' "$have" | grep -qxF "$f" || echo "$f"; done | grep -c . || :)"
          if [ $((nhave + nnew)) -gt 1000 ]; then
            echo "the release has $nhave files and lacks $nnew of this repository: over 1000, its old files away first"
            for a in $have; do
              [ -e "$dir/$a" ] || drop_asset "$a" || :
            done
          fi
          rid="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$rid/assets?per_page=100" \
            --jq '.[] | "\(.name) \(.digest)"' > "$AZSUPPORT_RUNS_STATE/release-digests.txt"
          pk="$(ls "$dir" | grep -E '^[^/]+-[0-9][^/]*\.pkg$' | while read -r f; do
            grep -qxF "$f sha256:$(sha256 -q "$dir/$f")" "$AZSUPPORT_RUNS_STATE/release-digests.txt" || echo "$dir/$f"
          done)"
          echo "packages to upload: $(printf '%s\n' "$pk" | grep -c . || :) of $(ls "$dir" | grep -cE '^[^/]+-[0-9][^/]*\.pkg$' || :) (the others are in the release with the same sha256)"
          # in batches of 20 with a pause between them, each batch again up to six times:
          # GitHub answers a run of uploads with HTTP 403 "You have exceeded a secondary
          # rate limit" (run 44949024609 of build.yml, 21.11.2026: 526 packages at once, the
          # publish stopped once the old files were away)
          up_batch() {
            for t in 1 2 3 4 5 6; do
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$@" && return 0
              echo "the upload of $# files failed (try $t of 6), again in $((t * 60)) s"
              sleep $((t * 60))
            done
            return 1
          }
          if [ -n "$pk" ]; then
            printf '%s\n' "$pk" > "$AZSUPPORT_RUNS_STATE/upload.txt"
            split -l 20 "$AZSUPPORT_RUNS_STATE/upload.txt" "$AZSUPPORT_RUNS_STATE/upload-part."
            for part in "$AZSUPPORT_RUNS_STATE"/upload-part.*; do
              # shellcheck disable=SC2046
              up_batch $(cat "$part") || { echo "::error title=publish::the packages of $part not uploaded"; exit 1; }
              sleep 15
            done
          fi
          # shellcheck disable=SC2046
          up_batch $(ls -d "$dir"/* | grep -v -E '/[^/]+-[0-9][^/]*\.pkg$') ||
            { echo "::error title=publish::the catalog not uploaded"; exit 1; }
          for a in $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            [ -e "$dir/$a" ] || drop_asset "$a" || :
          done
          have="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for f in $(ls "$dir"); do
            printf '%s\n' "$have" | grep -qxF "$f" || { echo "not in the release $tag: $f"; exit 1; }
          done
          echo "published: $url ($(ls "$dir" | wc -l | tr -d ' ') files)"
          echo "$tag" > "$AZSUPPORT_RUNS_STATE/published"
          sh tools/release-snapshot.sh after "$dir" "$tag" "$AZSUPPORT_SNAPSHOTS" ||
            echo "::warning title=snapshot::the repository just published is not kept as a snapshot (tools/release-snapshot.sh): the next publish keeps it first"

      - name: The drafts of the packages saved, once the release has them
        if: ${{ always() && steps.publish.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$AZSUPPORT_RUNS_STATE/published" ]; then
            echo "nothing published: the drafts stay for the next publish"
            exit 0
          fi
          [ -s "$AZSUPPORT_RUNS_STATE/wip-taken" ] || { echo "no draft was taken"; exit 0; }
          while read -r id tag; do
            if sh tools/release-drop.sh "$id" "$tag"; then
              echo "deleted: $tag (its packages are in the release now)"
            else
              echo "::warning title=drafts::$tag not deleted: the next publish tries again"
            fi
          done < "$AZSUPPORT_RUNS_STATE/wip-taken"

      - name: The log of the progress reporter
        if: always()
        continue-on-error: true
        run: |
          # the reporter and the sleep or the command it waits for (stopped first, so that it
          # starts no other; 24.11.2026: its sleep 600 stayed after the reporter)
          if [ -s "$AZSUPPORT_RUNS_STATE/runs-progress.pid" ]; then
            p="$(cat "$AZSUPPORT_RUNS_STATE/runs-progress.pid")"
            kill -STOP "$p" 2> /dev/null && { pkill -P "$p" 2> /dev/null; kill -KILL "$p" 2> /dev/null; } || :
          fi
          tail -n 20 "$AZSUPPORT_RUNS_STATE/runs-progress.log" 2> /dev/null || echo "no log of tools/runs-progress.sh"

      - name: Report to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: release=${{ inputs.release }} cputype=${{ matrix.cputype }} runner=${{ inputs.runner }} ports=${{ inputs.ports }} force=${{ inputs.force }} jobs=${{ inputs.jobs }} make_jobs=${{ inputs.make_jobs }} configure_check=${{ inputs.configure_check }} plan=${{ inputs.plan }} fork_ref=${{ inputs.fork_ref }} publish=${{ inputs.publish }} publish_only=${{ inputs.publish_only }} drafts=${{ inputs.drafts }}
          RUNS_STEPS: build=${{ steps.build.outcome }} outcome=${{ steps.outcome.outcome }} report=${{ steps.report.outcome }} publish=${{ steps.publish.outcome }}
          PART: ${{ matrix.cputype }}
        run: sh tools/runs-report.sh report.md "$PART"

      # as in build.yml: a run whose time was over (results/time-limit) and that built
      # something goes on in a new run of this workflow with the same inputs; at most 6
      # runs in a row; with "both", a v3 that goes on stops this run here
      - name: The next run, when the time of this one was over
        if: ${{ always() && !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IN_RELEASE: ${{ inputs.release }}
          IN_CPUTYPE: ${{ inputs.cputype }}
          IN_RUNNER: ${{ inputs.runner }}
          IN_PORTS: ${{ inputs.ports }}
          IN_JOBS: ${{ inputs.jobs }}
          IN_MAKE_JOBS: ${{ inputs.make_jobs }}
          IN_CCHECK: ${{ inputs.configure_check }}
          IN_FORK_REF: ${{ inputs.fork_ref }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_PUBLISH_ONLY: ${{ inputs.publish_only }}
          IN_CONT: ${{ inputs.continuation }}
          IN_DRAFTS: ${{ inputs.drafts }}
          LEVEL: ${{ matrix.cputype }}
        run: |
          [ -f results/time-limit ] || { echo "the time of this run was enough: no next run"; exit 0; }
          first="$(head -n 1 results/time-limit)"
          echo "results/time-limit: $first"
          built="$(printf '%s' "$first" | sed -n 's/.*built=\([0-9]*\).*/\1/p')"
          cached="$(printf '%s' "$first" | sed -n 's/.*cached=\([0-9]*\).*/\1/p')"
          n="${IN_CONT:-0}"; case "$n" in ''|*[!0-9]*) n=0 ;; esac
          if [ "${built:-0}" -eq 0 ] && [ "${cached:-0}" -eq 0 ]; then
            echo "::error title=time limit::this run built nothing in its time: no next run (a port that takes longer than a run?)"
            exit 1
          fi
          if [ "$n" -ge 5 ]; then
            echo "::error title=time limit::6 runs in a row and the build is not done: no next run"
            exit 1
          fi
          cp="$IN_CPUTYPE"
          [ "$IN_CPUTYPE" = both ] && [ "$LEVEL" = x86-64-v2 ] && cp=x86-64-v2
          gh workflow run build-jail.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f release="$IN_RELEASE" -f cputype="$cp" -f runner="$IN_RUNNER" -f ports="$IN_PORTS" -f force=false \
            -f jobs="$IN_JOBS" -f make_jobs="$IN_MAKE_JOBS" -f configure_check="$IN_CCHECK" -f plan=false -f fork_ref="$IN_FORK_REF" \
            -f publish="$IN_PUBLISH" -f publish_only="$IN_PUBLISH_ONLY" -f drafts="$IN_DRAFTS" -f continuation="$((n + 1))"
          echo "the next run: build-jail.yml, cputype $cp, continuation $((n + 1))" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$IN_CPUTYPE" = both ] && [ "$LEVEL" = x86-64-v3 ]; then
            echo "x86-64-v3 goes on in the next run: this run stops, so that x86-64-v2 does not start before it"
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi
