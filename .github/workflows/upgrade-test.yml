name: The upgrade of a server to the repository of a branch

# tools/upgrade-check.sh in a FreeBSD VM (vmactions, as build.yml): the packages of a server
# installed from the release azsupport-fbsd<major>-amd64-<level>, then pkg upgrade in one
# transaction to the repository of the last run of build.yml of this branch (its cache:
# repo-<level>-*), with an unsigned catalog, and checked (the split of azsupport into a port a
# library, 26.11.2026: test T4 of the plan): pkg check -d and -s, every file of the shared
# tree in one package, ldd, the modules of PHP and its smoke tests, pkg autoremove. Two jobs:
# a server, and a server that keeps the static tree (--keep-static: the package of the
# static tree marked as installed by hand before the upgrade, as a server that builds PHP
# against it). The public log has the lines "test upgrade-<check>: OK|FAIL|SKIP|INFO" only;
# the outputs of pkg, ldd and PHP go to the branch runs of the private azsupport/azsupport
# (secret RUNS_TOKEN: ports-upgrade-test/<date>/<run>-<level>-<mode>.tar.xz).
# Started by hand: Actions, "The upgrade of a server to the repository of a branch", "Run workflow".

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'
      cputype:
        description: 'x86-64 level: the release and the cache of the repository of that level'
        type: choice
        options: [x86-64-v3, x86-64-v2]
        default: x86-64-v3
      packages:
        description: 'The packages of the server, installed from the release first (those it has not are left out)'
        required: false
        default: 'php84 php84-fpm apache24-php84 php84-gd php84-intl php84-xsl php84-zip php84-sodium php84-mbstring php84-sqlite3 php84-gmp php84-ffi php84-tidy php84-mcrypt php84-memcached php84-readline php84-gettext php84-iconv php84-ssh2 php84-redis-lz4-zstd php84-imagick7 php84-gmagick php84-curl curl ffmpeg ImageMagick7 GraphicsMagick mc rsync memcached nginx-devel bind-tools vips dejavu'
      upgrade:
        description: 'The upgrade, as a server runs it (one transaction)'
        required: false
        default: 'pkg upgrade -y -r azsupport'

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        mode: [server, keep-static]
    name: upgrade (${{ inputs.cputype }}, ${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v5

      # the repository of the last run of build.yml of this branch (that of main when the
      # branch has none yet)
      - name: The repository of the branch
        uses: actions/cache/restore@v4
        with:
          path: repo
          key: repo-${{ inputs.cputype }}-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: repo-${{ inputs.cputype }}-

      - name: The old repository and the new one
        env:
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ inputs.cputype }}
        run: |
          n="$(ls repo 2> /dev/null | grep -c '\.pkg$' || :)"
          if [ "${n:-0}" -eq 0 ]; then
            echo "::error title=repository::no cache of the repository of $GITHUB_REF_NAME ($CPUTYPE): a run of build.yml first"
            exit 1
          fi
          echo "the new repository: $n packages of the cache of $GITHUB_REF_NAME"
          echo "UPGRADE_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/azsupport-fbsd${RELEASE%%.*}-amd64-${CPUTYPE#x86-64-}" >> "$GITHUB_ENV"
          mkdir -p upgrade-results

      - name: Free space on the runner (the disk of the VM grows on it)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune --all --force > /dev/null 2>&1 || true
          df -h /

      # the script never stops before its end (vmactions copies the results back only after
      # a script that ended well): its exit status into upgrade-results/rc
      - name: The upgrade in FreeBSD ${{ inputs.release }}
        id: test
        uses: vmactions/freebsd-vm@v1
        env:
          UPGRADE_MODE: ${{ matrix.mode }}
          UPGRADE_PACKAGES: ${{ inputs.packages }}
          UPGRADE_CMD: ${{ inputs.upgrade }}
        with:
          release: ${{ inputs.release }}
          mem: 8192
          envs: 'UPGRADE_URL UPGRADE_MODE UPGRADE_PACKAGES UPGRADE_CMD'
          # the package mirror as in build.yml (tools/pkg-mirror.sh), 3 tries 60 s apart
          prepare: |
            i=1
            while :; do
              sh tools/pkg-mirror.sh || echo "pkg-mirror: try $i: no address of the mirror answers, pkg goes by the resolver"
              env ASSUME_ALWAYS_YES=yes timeout 600 pkg update -f && break
              [ "$i" -ge 3 ] && { echo "pkg: no catalog after $i tries"; exit 1; }
              echo "pkg: try $i failed, again in 60 s"; i=$((i + 1)); sleep 60
            done
          run: |
            rc=0
            ks=""
            [ "$UPGRADE_MODE" = keep-static ] && ks=--keep-static
            sh tools/upgrade-check.sh $ks "$UPGRADE_URL" repo upgrade-results/out $UPGRADE_PACKAGES > upgrade-results/lines.txt 2>&1 || rc=$?
            echo "$rc" > upgrade-results/rc
            # the hard links of the new repository stay in the VM
            rm -rf upgrade-results/upgrade-repo
            exit 0

      - name: The checks
        id: outcome
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        env:
          MODE: ${{ matrix.mode }}
        run: |
          rc="$(cat upgrade-results/rc 2> /dev/null || echo 'none: the VM gave no upgrade-results/rc')"
          # the lines of the checks only (the rest of the output goes to the private results)
          grep -E '^(test upgrade-|result:)' upgrade-results/lines.txt 2> /dev/null | cut -c1-400 > upgrade-results/public.txt || :
          cat upgrade-results/public.txt
          { echo "### The upgrade of a server ($MODE)"; echo; echo '```'; cat upgrade-results/public.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep '^test upgrade-.*: FAIL' upgrade-results/public.txt | while read -r l; do
            printf '::error title=upgrade (%s)::%s\n' "$MODE" "$l"
          done
          if [ "$rc" != 0 ]; then
            echo "::error title=upgrade::the upgrade or a check failed ($MODE, exit $rc)"
            exit 1
          fi

      # the outputs (pkg, ldd, PHP): into the branch runs of the private azsupport/azsupport, as
      # the results of the tests of build.yml, never into this public log or an artifact
      - name: The outputs of the test, to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          PART: ${{ inputs.cputype }}-${{ matrix.mode }}
        run: |
          [ -d upgrade-results ] || { echo "no upgrade-results"; exit 0; }
          if [ -z "$RUNS_TOKEN" ]; then
            echo "::warning title=upgrade results::no RUNS_TOKEN: the outputs of the test are not kept"
            exit 0
          fi
          a="${GITHUB_RUN_ID}-${PART}.tar.xz"
          tar -cJf "$RUNNER_TEMP/$a" upgrade-results
          day="$(date -u +%Y-%m-%d)"
          w="$RUNNER_TEMP/runs-upgrade"
          timeout 600 git clone -q --depth 1 --filter=blob:none --no-checkout --branch runs --single-branch \
            "https://x-access-token:${RUNS_TOKEN}@github.com/azsupport/azsupport.git" "$w"
          git -C "$w" sparse-checkout set --no-cone "/ports-upgrade-test/$day/"
          timeout 600 git -C "$w" checkout -q runs
          mkdir -p "$w/ports-upgrade-test/$day"
          cp "$RUNNER_TEMP/$a" "$w/ports-upgrade-test/$day/$a"
          git -C "$w" add "ports-upgrade-test/$day/$a"
          git -C "$w" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "ports-upgrade-test $PART: the outputs of run $GITHUB_RUN_ID"
          i=0
          until timeout 300 git -C "$w" push -q origin HEAD:runs; do
            i=$((i + 1)); [ $i -lt 10 ] || { echo "::warning title=upgrade results::push to azsupport/azsupport failed"; exit 0; }
            sleep $((i * 3))
            timeout 600 git -C "$w" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              pull -q --rebase origin runs || :
          done
          echo "the outputs of the test: azsupport/azsupport, branch runs, ports-upgrade-test/$day/$a"
