name: ubuntu

# Our FFmpeg and ImageMagick 7 for Ubuntu 24.04 and 22.04 and for Debian 13 and 12 (amd64;
# aZ, 25.11.2026: «надо ешё для ubuntu 22, дополни к 24»; «на deb можно ещё варианты для
# дебияна положить вместе с вариантами для убунты?»): tools/ubuntu/build.sh on each release
# (the glibc and libstdc++ of 24.04 are newer than those of 22.04, those of Debian 13 than
# those of Debian 12), an
# archive per level (x86-64-v3, x86-64-v2) with ffmpeg, ffprobe (NVIDIA codecs and CUDA
# filters too: tools/ubuntu/ffmpeg-nvidia.conf) and magick, and the Debian packages
# azsupport-ffmpeg and azsupport-imagemagick7 of the same files (tools/ubuntu/deb.sh), installed by
# apt here for the tests and tested as the FreeBSD
# packages are, with tests/ports/ffmpeg-test.sh and imagemagick-test.sh of the private
# azsupport/azsupport (secret RUNS_TOKEN; their output only into its branch runs, here
# only "test <name>: OK|FAIL"; the samples made with the ffmpeg and the ImageMagick of
# the system), and published (input publish, on main) as the releases
# azsupport-<ubuntu24|ubuntu22|debian13|debian12>-amd64-<v3|v2> of this repository:
#   https://github.com/azsupport/ports/releases/download/azsupport-ubuntu24-amd64-v3/azsupport-ubuntu24-amd64-v3.tar.xz
# On the runners of GitHub (our runners are FreeBSD jails): Ubuntu on the runner of its
# release (ubuntu-24.04, ubuntu-22.04), Debian in a container of its release (debian:13,
# debian:12) on ubuntu-24.04.

on:
  workflow_dispatch:
    inputs:
      ubuntu:
        description: 'The releases of Ubuntu: both, 24.04, 22.04 or none'
        required: false
        default: 'both'
      debian:
        description: 'The releases of Debian: both, 13, 12 or none'
        required: false
        default: 'both'
      cputype:
        description: 'The levels: both, x86-64-v3 or x86-64-v2'
        required: false
        default: 'both'
      publish:
        description: 'Publish the archives and packages (releases azsupport-<ubuntu24|ubuntu22|debian13|debian12>-amd64-<level>) when built and tested (main only)'
        type: boolean
        default: false
      ffmpeg_lto:
        description: 'The LTO of FFmpeg: auto or no (AZSUPPORT_FFMPEG_LTO)'
        required: false
        default: 'auto'
      x264_lto:
        description: 'The LTO of x264: false or true (AZSUPPORT_X264_LTO; tools/ubuntu/build.sh, b_x264: why not)'
        required: false
        default: 'false'
      debug:
        description: 'After a failed test of ffmpeg: backtraces (gdb) of a few of its commands'
        type: boolean
        default: false

permissions:
  contents: write

# the runs that publish one after another (per branch); the others side by side
concurrency:
  group: ubuntu-${{ inputs.publish && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # the systems of the inputs ubuntu and debian, each with the runner of GitHub it is built
  # on and its container (none for Ubuntu): name (the suffix of the versions of the
  # packages, ~ubuntu24.04, ~debian12), rel (in the names of the files: azsupport-ubuntu24,
  # azsupport-debian12), label
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      systems: ${{ steps.plan.outputs.systems }}
    steps:
      - name: The systems
        id: plan
        env:
          UBUNTU: ${{ inputs.ubuntu }}
          DEBIAN: ${{ inputs.debian }}
        run: |
          case "$UBUNTU" in both) u="24.04 22.04" ;; 24.04|22.04) u="$UBUNTU" ;; none) u="" ;;
            *) echo "::error title=inputs::ubuntu is both, 24.04, 22.04 or none, not $UBUNTU"; exit 1 ;; esac
          case "$DEBIAN" in both) d="13 12" ;; 13|12) d="$DEBIAN" ;; none) d="" ;;
            *) echo "::error title=inputs::debian is both, 13, 12 or none, not $DEBIAN"; exit 1 ;; esac
          s=""
          for v in $u; do
            s="$s,{\"name\":\"ubuntu$v\",\"rel\":\"ubuntu${v%%.*}\",\"label\":\"Ubuntu $v\",\"runner\":\"ubuntu-$v\",\"image\":\"\"}"
          done
          for v in $d; do
            s="$s,{\"name\":\"debian$v\",\"rel\":\"debian$v\",\"label\":\"Debian $v\",\"runner\":\"ubuntu-24.04\",\"image\":\"debian:$v\"}"
          done
          [ -n "$s" ] || { echo "::error title=inputs::no system: ubuntu and debian are both none"; exit 1; }
          echo "systems=[${s#,}]" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build (${{ matrix.system.name }}, ${{ matrix.cputype }})
    runs-on: ${{ matrix.system.runner }}
    # Debian: its container; Ubuntu: none (an empty container runs on the runner itself)
    container: ${{ matrix.system.image }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.plan.outputs.systems) }}
        cputype: ${{ fromJSON(inputs.cputype == 'both' && '["x86-64-v3","x86-64-v2"]' || format('["{0}"]', inputs.cputype)) }}
    env:
      AZSUPPORT_SYSTEM: ${{ matrix.system.name }}
      AZSUPPORT_REL: ${{ matrix.system.rel }}
      AZSUPPORT_LABEL: ${{ matrix.system.label }}
      AZSUPPORT_CPUTYPE: ${{ matrix.cputype }}
      AZSUPPORT_FFMPEG_LTO: ${{ inputs.ffmpeg_lto }}
      AZSUPPORT_X264_LTO: ${{ inputs.x264_lto }}
    steps:
      # the container of Debian has neither git (actions/checkout would take the files
      # without .git: no commit in VERSIONS, no clone of the branch runs for the results),
      # sudo (the steps are those of the runners of Ubuntu; root here), the certificates nor
      # curl; git takes the checkout (of the user of the runner) as safe. gh (Publish; the
      # runners of Ubuntu have it) from the apt repository of GitHub CLI, only for a run
      # that publishes (on another branch than main too: it is installed, nothing published)
      - name: The container
        if: matrix.system.image != ''
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates curl git sudo xz-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$PUBLISH" = true ]; then
            curl -fsSL -o /usr/share/keyrings/githubcli-archive-keyring.gpg https://cli.github.com/packages/githubcli-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
            apt-get update -q
            apt-get install -y -q --no-install-recommends gh
            gh --version | head -n 1
          fi

      - uses: actions/checkout@v5

      - name: The build tools
        run: sudo sh tools/ubuntu/build.sh --tools

      - name: Build
        id: build
        run: sh tools/ubuntu/build.sh

      # the tests of the FreeBSD packages from the private azsupport/azsupport, into
      # tools/ (they are in .gitignore here); the samples made with the ffmpeg and the
      # ImageMagick of the system (FFMPEG_REF, IM_REF), before our archive is installed;
      # their output into results/tests/ only, here "test <name>: OK|FAIL"
      - name: Tests
        id: tests
        if: steps.build.outcome == 'success'
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
        run: |
          mkdir -p results/tests
          if [ -z "$RUNS_TOKEN" ]; then
            echo "::error title=tests::no RUNS_TOKEN: no tests"
            exit 1
          fi
          t="$RUNNER_TEMP/azsupport-tests.tgz"
          curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer $RUNS_TOKEN" -H "Accept: application/vnd.github+json" \
            -o "$t" "https://api.github.com/repos/azsupport/azsupport/tarball/main"
          tar -xzf "$t" -C tools --wildcards --strip-components=3 '*/tests/ports/ffmpeg-test.sh' '*/tests/ports/imagemagick-test.sh'
          # the codecs of libheif: the plugins where the system has them as packages
          # (Ubuntu 24.04, Debian 13), else inside libheif1 (Ubuntu 22.04, Debian 12)
          heif=""
          for p in libheif-plugin-x265 libheif-plugin-aomenc libheif-plugin-dav1d libheif-plugin-libde265; do
            apt-cache show "$p" > /dev/null 2>&1 && heif="$heif $p"
          done
          echo "the plugins of libheif:${heif:- none (inside libheif1)}"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ffmpeg imagemagick \
            fontconfig fonts-dejavu-core $heif \
            > results/tests/apt.log 2>&1 || { echo "::error title=tests::apt-get install of the references failed"; exit 1; }
          # convert of the ImageMagick of the system: 6 on Ubuntu and Debian 12, 7 on Debian 13
          # (magick where there is no convert)
          IM_REF=/usr/bin/convert
          [ -x "$IM_REF" ] || IM_REF=/usr/bin/magick
          export FFMPEG_REF=/usr/bin/ffmpeg IM_REF IM_ONLY=imagemagick7
          export AZSUPPORT_FFMPEG_CONF="$PWD/ubuntu-results/ffmpeg.conf"
          AZSUPPORT_RESULTS=results/tests/ffmpeg sh tools/ffmpeg-test.sh --samples > results/tests/ffmpeg-samples.log 2>&1
          AZSUPPORT_RESULTS=results/tests/imagemagick sh tools/imagemagick-test.sh --samples > results/tests/imagemagick-samples.log 2>&1
          # our packages, with apt (their Depends and preinst), in the place of the archive
          l="${AZSUPPORT_CPUTYPE#x86-64-}"
          r="$AZSUPPORT_REL"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -q "./azsupport-ffmpeg-$r-amd64-$l.deb" \
            "./azsupport-imagemagick7-$r-amd64-$l.deb" > results/tests/apt-az.log 2>&1 ||
            { echo "::error title=tests::apt-get install of azsupport-ffmpeg and azsupport-imagemagick7 failed"; tail -n 5 results/tests/apt-az.log; exit 1; }
          dpkg -s azsupport-ffmpeg azsupport-imagemagick7 | grep -E '^(Package|Status|Version):'
          rc=0
          : > results/checks.txt
          for n in ffmpeg imagemagick; do
            if AZSUPPORT_RESULTS="results/tests/$n" sh "tools/$n-test.sh" > "results/tests/$n.log" 2>&1; then s=OK; else s=FAIL; rc=1; fi
            echo "test $n: $s" | tee -a results/checks.txt
          done
          exit $rc

      # the unstripped ffmpeg of the build (ffmpeg_g) under gdb, on the samples of the
      # test: the command, the signal and the backtrace of the thread that got it
      - name: Backtraces of ffmpeg
        if: ${{ always() && inputs.debug && steps.tests.outcome == 'failure' }}
        continue-on-error: true
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends gdb > /dev/null 2>&1
          g="/tmp/azsupport-ubuntu-${AZSUPPORT_CPUTYPE#x86-64-}/src/ffmpeg/ffmpeg_g"
          T=/var/tmp/ffmpeg-test
          ls -la "$g" "$T"/h264_aac.mp4 "$T"/vp9_opus.webm "$T"/av1_aac.mp4 2>&1 | sed 's/^/    /'
          bt() {
            echo "=== ffmpeg $*"
            timeout 300 gdb -q -batch -ex 'set pagination off' -ex run -ex 'info signal' -ex 'bt 25' -ex 'info registers rip rsp' \
              -ex 'x/6i $pc-12' --args "$g" -hide_banner -nostdin -y "$@" 2>&1 | grep -v -e '^\[New Thread' -e '^\[Thread .* exited' | tail -n 60
          }
          bt -ss 1 -i "$T/vp9_opus.webm" -frames:v 1 /tmp/shot-vp9.jpg
          bt -i "$T/h264_aac.mp4" -vcodec libx264 -an -f mp4 /tmp/kvs-h264.mp4
          bt -i "$T/av1_aac.mp4" -vn -acodec aac -f mp4 /tmp/aac.mp4
          bt -f lavfi -i testsrc2=size=320x240:rate=25:duration=1 -frames:v 1 /tmp/lavfi.png

      - name: The results of the tests, to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          PART: ${{ matrix.system.name }}-${{ matrix.cputype }}
        run: |
          [ -d results/tests ] || { echo "no results/tests: no test ran"; exit 0; }
          a="${GITHUB_RUN_ID}-${PART}-tests.tar.xz"
          tar -cJf "$RUNNER_TEMP/$a" -C results tests
          rm -rf results/tests
          if [ -z "$RUNS_TOKEN" ]; then
            echo "::warning title=test results::no RUNS_TOKEN: the results of the tests are not kept"
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          w="$RUNNER_TEMP/runs-tests"
          timeout 600 git clone -q --depth 1 --filter=blob:none --no-checkout --branch runs --single-branch \
            "https://x-access-token:${RUNS_TOKEN}@github.com/azsupport/azsupport.git" "$w"
          git -C "$w" sparse-checkout set --no-cone "/ports-ubuntu/$day/"
          timeout 600 git -C "$w" checkout -q runs
          mkdir -p "$w/ports-ubuntu/$day"
          cp "$RUNNER_TEMP/$a" "$w/ports-ubuntu/$day/$a"
          git -C "$w" add "ports-ubuntu/$day/$a"
          git -C "$w" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "ports-ubuntu $PART: the results of the tests of run $GITHUB_RUN_ID"
          i=0
          until timeout 300 git -C "$w" push -q origin HEAD:runs; do
            i=$((i + 1)); [ $i -lt 10 ] || { echo "::warning title=test results::push to azsupport/azsupport failed"; exit 0; }
            sleep $((i * 3))
            timeout 600 git -C "$w" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              pull -q --rebase origin runs || :
          done
          echo "the results of the tests: azsupport/azsupport, branch runs, ports-ubuntu/$day/$a"

      - name: Report
        id: report
        if: always()
        run: |
          {
            echo "## $AZSUPPORT_LABEL $AZSUPPORT_CPUTYPE"
            echo
            echo "build: ${{ steps.build.outcome }}, tests: ${{ steps.tests.outcome }}"
            echo
            echo '```'
            cat ubuntu-results/summary.txt ubuntu-results/bins.txt 2> /dev/null || :
            cat results/checks.txt 2> /dev/null || :
            for f in ubuntu-results/*.tail ubuntu-results/bins-bad.txt; do
              [ -s "$f" ] || continue
              echo "== ${f#ubuntu-results/}"
              tail -n 40 "$f"
            done
            echo '```'
            if [ -s ubuntu-results/VERSIONS ]; then
              echo
              echo '<details><summary>VERSIONS</summary>'
              echo
              echo '```'
              cat ubuntu-results/VERSIONS
              echo '```'
              echo '</details>'
            fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.system.name }}-${{ matrix.cputype }}
          retention-days: 14
          path: |
            ubuntu-results/
            azsupport-${{ matrix.system.rel }}-amd64-*.tar.xz
            azsupport-${{ matrix.system.rel }}-amd64-*.tar.xz.sha256
            azsupport-*-${{ matrix.system.rel }}-amd64-*.deb
            azsupport-*-${{ matrix.system.rel }}-amd64-*.deb.sha256

      # the release azsupport-<ubuntu24|ubuntu22|debian13|debian12>-amd64-<level>: the archive, the packages and their
      # .sha256 in the place of those before (the same addresses), VERSIONS (with the
      # commit of the build) as its notes; never the latest release of the repository. Its
      # tag is not moved: the token of the workflow may not set a tag to a commit whose
      # workflows differ from those of main (HTTP 403 "Resource not accessible by
      # integration", run 45592038224: the tags of 24.04 moved to db39298 after a968722
      # added ubuntu-apt.yml); a new release has its tag on the head of main
      - name: Publish
        id: publish
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' && steps.tests.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          r="$AZSUPPORT_REL"
          tag="azsupport-$r-amd64-${AZSUPPORT_CPUTYPE#x86-64-}"
          a="$tag.tar.xz"
          dff="azsupport-ffmpeg-$r-amd64-${AZSUPPORT_CPUTYPE#x86-64-}.deb"
          dim="azsupport-imagemagick7-$r-amd64-${AZSUPPORT_CPUTYPE#x86-64-}.deb"
          {
            echo "FFmpeg and ImageMagick 7 of this repository for $AZSUPPORT_LABEL (amd64, $AZSUPPORT_CPUTYPE): tools/ubuntu/build.sh,"
            echo "run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, commit $GITHUB_SHA."
            echo
            echo "The packages (apt installs their dependencies):"
            echo
            echo '```'
            for f in "$dff" "$dim"; do
              echo "curl -fLO $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$f"
              echo "curl -fLO $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$f.sha256"
            done
            echo "sha256sum -c $dff.sha256 $dim.sha256"
            echo "sudo apt-get install -y ./$dff ./$dim"
            echo '```'
            echo
            echo "Or, on a server, from the apt repository of them, https://deb.azsupport.dev (azsupport/deb; it takes"
            echo "these files within the hour). Or the archive of the same files:"
            echo
            echo '```'
            echo "curl -fLO $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$a"
            echo "curl -fLO $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$a.sha256"
            echo "sha256sum -c $a.sha256"
            echo "sudo apt-get install -y fontconfig-config fonts-dejavu-core"
            echo "sudo tar -xJf $a -C /"
            echo '```'
            echo
            echo '```'
            cat ubuntu-results/VERSIONS
            echo '```'
          } > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$a" "$a.sha256" "$dff" "$dff.sha256" "$dim" "$dim.sha256" --clobber
            gh release edit "$tag" --notes-file notes.md --latest=false
          else
            head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            gh release create "$tag" "$a" "$a.sha256" "$dff" "$dff.sha256" "$dim" "$dim.sha256" --target "$head" --title "$tag" --notes-file notes.md --latest=false
          fi
          echo "published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$a" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: system=${{ matrix.system.name }} cputype=${{ matrix.cputype }} publish=${{ inputs.publish }} ffmpeg_lto=${{ inputs.ffmpeg_lto }} x264_lto=${{ inputs.x264_lto }} debug=${{ inputs.debug }}
          RUNS_STEPS: build=${{ steps.build.outcome }} tests=${{ steps.tests.outcome }} report=${{ steps.report.outcome }} publish=${{ steps.publish.outcome }}
          PART: ${{ matrix.system.name }}-${{ matrix.cputype }}
        run: sh tools/runs-report.sh report.md "$PART"
