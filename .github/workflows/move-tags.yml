name: Move a release tag

# Moves the tag of a release of this repository (azsupport-fbsd<major>-amd64-<level>) to
# another commit of main, with GITHUB_TOKEN (a tag cannot be pushed from Claude's
# sessions). Made after the rewrite of the history of 16.11.2026: the release, its files
# and its notes stay; only the commit the tag names changes. A tag that is not that of a
# release, or a commit that is not in main, is refused.
# Started by hand: Actions, "Move a release tag", "Run workflow"; or
#   gh api -X POST repos/azsupport/ports/actions/workflows/move-tags.yml/dispatches \
#     -f ref=main -f 'inputs[tag]=azsupport-fbsd15-amd64-v3' -f 'inputs[sha]=<full SHA in main>'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag of a release: azsupport-fbsd<major>-amd64-<level>'
        required: true
      sha:
        description: 'The commit of main it is to name (full SHA)'
        required: true

permissions:
  contents: write

jobs:
  move:
    runs-on: [self-hosted, azlight]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the tag
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in azsupport-fbsd[0-9]*-amd64-v[0-9]*) ;; *) echo "::error::not the tag of a release: $TAG"; exit 1 ;; esac
          case "$SHA" in *[!0-9a-f]*|"") echo "::error::not a full SHA: $SHA"; exit 1 ;; esac
          [ "${#SHA}" = 40 ] || { echo "::error::not a full SHA: $SHA"; exit 1; }
          gh release view "$TAG" > /dev/null || { echo "::error::no release $TAG"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not a commit of main"; exit 1; }
          old="$(git rev-parse "refs/tags/$TAG^{commit}" 2>/dev/null || echo none)"
          git push --force origin "$SHA:refs/tags/$TAG"
          echo "$TAG: $old -> $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
