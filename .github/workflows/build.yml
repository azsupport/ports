name: Build the packages of the repository az

# Builds the ports of this overlay (tools/build.sh) in a FreeBSD VM, with the
# make.conf of aZ's servers for an x86-64 level (tools/make.conf.in), over the
# official ports tree at the commit pinned in tools/build.sh; when PHP was built,
# installs its packages from the new repository (tools/install-php.sh) and checks
# them (tools/check-php.sh); installs the programs and libraries from it and tests
# them (tools/test-programs.sh); and publishes
# the repository of pkg as the files of the release az-fbsd<major>-amd64-<level>
# of this repository (its address goes into /usr/local/etc/pkg/repos/az.conf of a
# server, README.md). The repository of the last run (a cache, kept also when a run
# fails) and the files of that release come first: a port whose package with the
# same az_hash is there already is not built again (unless force), and they go into
# the new repository with the new ones. Before the VM, tools/check-tree.sh checks the
# ports of this tree with make -V against a sparse official tree (bmake). Up to
# "jobs" ports build at once (AZ_JOBS of tools/build.sh: waves of the ports whose
# dependencies are done; 1: one after another, as before). With "configure_check"
# each PHP port built is configured once more, with the errors of C of GCC 14+ and
# clang 16+ as warnings, and compared with its build (AZ_CONFIGURE_CHECK of
# tools/build.sh: results/configure-check.txt, a section of the report).
# Started by hand: Actions, "Build the packages of the repository az", "Run workflow".

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'
      cputype:
        description: 'x86-64 level (CPUTYPE of make.conf)'
        type: choice
        options: [x86-64-v3, x86-64-v2, both]
        default: x86-64-v3
      ports:
        description: 'Ports to build (category/port, separated by spaces; with the ports of this tree they need); empty: all'
        required: false
        default: ''
      force:
        description: 'Build the ports also when their package with the same az_hash is in the release already'
        type: boolean
        default: false
      jobs:
        description: 'Ports built at once (AZ_JOBS of tools/build.sh, in waves); 1: one after another'
        required: false
        default: '4'
      # AZ_CONFIGURE_CHECK of tools/build.sh: one more configure of each PHP port built
      configure_check:
        description: 'The configure check: each PHP port built configured once more, permissive, and compared (results/configure-check.txt); with force: every PHP port'
        type: boolean
        default: false
      # off by default: the repository the servers read is published on aZ's word
      publish:
        description: 'Publish the repository (the release the servers read) when everything built and every check passed'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        cputype: ${{ inputs.cputype == 'both' && fromJSON('["x86-64-v3", "x86-64-v2"]') || fromJSON(format('["{0}"]', inputs.cputype)) }}
    name: build (${{ matrix.cputype }})
    # one job at a time for a release, a level and a branch: a run of main
    # publishes the release of its level, a run of another branch only tries its
    # ports (its caches are its own: GitHub gives a branch the caches of main, never
    # main those of another branch). The levels have their own releases and caches,
    # so a run of x86-64-v2 goes while one of x86-64-v3 does (and the two jobs of
    # both); a job of a level waits for the one of the same level
    concurrency:
      group: az-ports-${{ inputs.release }}-${{ matrix.cputype }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # the repository of the last run, published or not (a run that fails in PHP keeps
      # az and the libraries for the next one): the newest cache of the level
      - name: The repository of the last run
        uses: actions/cache/restore@v4
        with:
          path: repo
          key: repo-${{ matrix.cputype }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: repo-${{ matrix.cputype }}-

      # with the files of the release (tools/build.sh keeps the newer package of an origin)
      - name: The repository of the release, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
        run: |
          major="${RELEASE%%.*}"
          tag="az-fbsd$major-amd64-${CPUTYPE#x86-64-}"
          mkdir -p repo
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir repo --skip-existing || echo "::warning title=repository::the files of the release $tag did not all download: the ports whose package is missing are built again"
          else
            echo "no release $tag yet"
          fi
          ls -l repo

      # the distribution files of the ports, kept between the runs (the VM fetches what is missing)
      - name: The distribution files of the runs before
        id: dist
        uses: actions/cache/restore@v4
        with:
          path: distfiles
          key: distfiles-${{ hashFiles('**/distinfo') }}
          restore-keys: distfiles-

      # the release tarballs of azsupport/php-src the PHP ports need, fetched here with
      # retries before the VM: GitHub answered the fetch of the VM with 504 more than
      # once (run 42571397680), and the distfiles cache of FreeBSD has none of them.
      # What does not download here, the VM tries again (MASTER_SITES of the port)
      - name: The PHP tarballs of azsupport/php-src, fetched with retries
        run: |
          mkdir -p distfiles/php
          sed -n 's/^SHA256 (php\/\(php-[0-9][^)]*-fbsd-[^)]*\.tar\.xz\)) = \([0-9a-f]*\)$/\1 \2/p' lang/php*/distinfo | sort -u > /tmp/php-tarballs
          while read -r f sum; do
            v="${f#php-}"; v="${v%%-fbsd-*}"; rel="${f#*-fbsd-}"; rel="${rel%.tar.xz}"
            d="distfiles/php/$f"
            if [ -f "$d" ] && [ "$(sha256sum < "$d" | cut -c1-64)" = "$sum" ]; then echo "have $f"; continue; fi
            u="https://github.com/azsupport/php-src/releases/download/freebsd-${v%.*}-$rel/$f"
            if curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o "$d.part" "$u" &&
              [ "$(sha256sum < "$d.part" | cut -c1-64)" = "$sum" ]; then
              mv "$d.part" "$d"; echo "fetched $f"
            else
              rm -f "$d.part"; echo "::warning title=distfiles::$f did not download here ($u): the VM tries again"
            fi
          done < /tmp/php-tarballs

      # the ports of this tree with make -V against the official tree, before the VM:
      # a port that names a missing origin, a wrong PKGORIGIN, two ports of one PKGNAME
      # (tools/check-tree.sh) stop the run here, not after an hour of az/az
      - name: The ports of this tree checked with make -V (bmake, a sparse official tree)
        env:
          CPUTYPE: ${{ matrix.cputype }}
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq bmake > /dev/null
          commit="$(sed -n 's/^ports_commit="\([0-9a-f]*\)".*/\1/p' tools/build.sh)"
          off="$RUNNER_TEMP/freebsd-ports"
          mkdir -p "$off"
          git -C "$off" init -q
          git -C "$off" remote add origin https://github.com/freebsd/freebsd-ports
          git -C "$off" fetch -q --depth 1 --filter=blob:none origin "$commit"
          git -C "$off" sparse-checkout set --no-cone '/Mk/' '/Templates/' '/Keywords/' '/Makefile*' '/*/Makefile*' '/*/*/Makefile*' '/*/*/*.mk' '/*/*/distinfo'
          git -C "$off" checkout -q FETCH_HEAD
          sed -n '1,/^# The paths of tools\/build.sh/p' tools/make.conf.in | sed "s|@CPUTYPE@|$CPUTYPE|" > "$RUNNER_TEMP/make.conf"
          set -o pipefail
          MAKE_CONF="$RUNNER_TEMP/make.conf" sh tools/check-tree.sh "$off" 2>&1 | tee check-tree.txt

      - name: Free space on the runner (the disk of the VM grows on it)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune --all --force > /dev/null 2>&1 || true
          df -h /

      # the key of the repository az (the secret PKG_SIGNING_KEY, PEM) in one line for envs:
      # of the VM, masked; tools/pkg-repo-sign.sh signs with it there (no key: unsigned)
      - name: The signing key of the repository, for the VM
        id: key
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          if [ -n "$PKG_SIGNING_KEY" ]; then
            b64="$(printf '%s\n' "$PKG_SIGNING_KEY" | base64 -w0)"
            echo "::add-mask::$b64"
            echo "b64=$b64" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=signing key::no PKG_SIGNING_KEY: the repository will not be signed (and not published)"
          fi

      - name: Build and check in FreeBSD ${{ inputs.release }}
        id: build
        uses: vmactions/freebsd-vm@v1
        env:
          AZ_CPUTYPE: ${{ matrix.cputype }}
          AZ_PORTS: ${{ inputs.ports }}
          AZ_FORCE: ${{ inputs.force && '1' || '' }}
          AZ_JOBS: ${{ inputs.jobs || '4' }}
          AZ_CONFIGURE_CHECK: ${{ inputs.configure_check && '1' || '' }}
          AZ_PKG_KEY: ${{ steps.key.outputs.b64 }}
        with:
          release: ${{ inputs.release }}
          # the runner has 16 GB: 12 GB for the VM (up to 4 builds at once, each with
          # make -j of the 4 vCPUs), about 4 GB left to the host
          mem: 12288
          envs: 'AZ_CPUTYPE AZ_PORTS AZ_FORCE AZ_JOBS AZ_CONFIGURE_CHECK AZ_PKG_KEY'
          prepare: |
            if [ -n "${AZ_PKG_KEY:-}" ]; then (umask 077 && printf '%s' "$AZ_PKG_KEY" > /root/.az-pkg-key.b64); fi; unset AZ_PKG_KEY
            env ASSUME_ALWAYS_YES=yes pkg install -y git-lite
          # the script never stops before its end (vmactions copies results/ and repo/ back
          # only after a script that ended well): what failed goes into results/rc (0: the
          # build and every check passed), and a step after the caches fails the job on it
          run: |
            if [ -n "${AZ_PKG_KEY:-}" ]; then (umask 077 && printf '%s' "$AZ_PKG_KEY" > /root/.az-pkg-key.b64); fi; unset AZ_PKG_KEY
            trap 'rm -f /root/.az-pkg-key.b64' EXIT
            if [ -s /root/.az-pkg-key.b64 ]; then export AZ_PKG_KEY_FILE=/root/.az-pkg-key.b64; fi
            rc=0
            sh tools/build.sh ${AZ_FORCE:+--force} --repo repo $AZ_PORTS || rc=$?
            mkdir -p results
            echo "$rc" > results/rc
            # the PHP of each version a package of which was built: installed from the
            # repository as a server installs it, and checked, when the repository has its
            # catalog and the core of the version is there
            : > results/checks.txt
            # the catalog the checks read: the signed one of repo/, else the unsigned one
            # of this run (work/repo-unsigned of build.sh: checks only, never published)
            crepo=repo
            if [ ! -f repo/meta.conf ] && [ -f work/repo-unsigned/meta.conf ]; then
              crepo=work/repo-unsigned
              echo "unsigned catalog: checks only, not published (work/repo-unsigned; $(tail -n 1 results/pkg-repo.log 2>/dev/null || echo 'no pkg-repo.log'))" >> results/checks.txt
            fi
            for v in $(awk '$1 ~ /\// && $2 == "OK" { print $3 }' results/summary.txt 2>/dev/null | sed -n -E 's/^(mod_)?php([0-9])([0-9])-.*/\2.\3/p' | sort -u); do
              core="lang/php$(echo "$v" | tr -d .)"
              cl="$(awk -v o="$core" '$1 == o { print; exit }' results/summary.txt 2>/dev/null || true)"
              if [ ! -f "$crepo/meta.conf" ]; then
                echo "PHP $v: SKIP (no catalog in $crepo: $(tail -n 1 results/pkg-repo.log 2>/dev/null || echo 'no pkg-repo.log'))" >> results/checks.txt
                continue
              fi
              case "$cl" in
                *" OK "*|*"in the repository already"*) ;;
                *) echo "PHP $v: SKIP (the core $core is not there: ${cl:-not in the queue})" >> results/checks.txt; continue ;;
              esac
              r=0
              sh tools/install-php.sh --repo "$crepo" "$v" || r=$?
              if [ "$r" = 3 ]; then
                echo "PHP $v: SKIP (the repository has no core php of $v)" >> results/checks.txt
              elif [ "$r" != 0 ]; then
                echo "PHP $v: FAIL (the packages did not install, exit $r: install-php-$v.log)" >> results/checks.txt
                rc=1
              elif [ ! -f tools/check-php.sh ]; then
                echo "PHP $v: SKIP (no tools/check-php.sh)" >> results/checks.txt
              else
                r=0
                sh tools/check-php.sh "$v" || r=$?
                if [ "$r" = 0 ]; then
                  echo "PHP $v: OK (check-php-$v.txt)" >> results/checks.txt
                else
                  echo "PHP $v: FAIL (check-php-$v.txt, exit $r)" >> results/checks.txt
                  rc=1
                fi
              fi
            done
            # the programs and libraries (az, curl, ffmpeg, ImageMagick6 and 7, GraphicsMagick)
            # installed from the repository and tested (the samples with the official
            # packages first); exit 2: no catalog, said in checks.txt
            r=0
            sh tools/test-programs.sh --repo "$crepo" || r=$?
            if [ "$r" = 1 ]; then rc=1; fi
            cat results/checks.txt
            echo "$rc" > results/rc
            echo "results/rc: $rc"
            # not back to the runner: the official tree, the work directories, the packages (they are in repo/)
            rm -rf work packages
            exit 0

      # vmactions copies repo/ back without deleting: what tools/build.sh removed there (an
      # older package of an origin, an origin the tree has no more, a name with a comma)
      # would stay here, in the cache and in the release. results/repo-files.txt has the
      # files the VM left in repo/
      - name: The repository as the VM left it
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        run: |
          if [ ! -f results/repo-files.txt ]; then
            echo "no results/repo-files.txt (tools/build.sh did not get that far): repo/ stays as it is"
            exit 0
          fi
          for f in repo/*; do
            [ -e "$f" ] || continue
            if ! grep -qxF "${f##*/}" results/repo-files.txt; then
              echo "removed, not in the repository of the VM: ${f##*/}"
              rm -rf "$f"
            fi
          done
          ls repo | wc -l

      # the repository of this run for the next one, also when the run failed (only repo/:
      # the caches of a repository have 10 GB)
      - name: The repository of this run, kept for the next one
        if: ${{ always() && steps.build.outcome != 'skipped' && hashFiles('repo/*.pkg') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: repo
          key: repo-${{ matrix.cputype }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: The distribution files, kept for the next run
        if: ${{ always() && steps.build.outcome != 'skipped' && steps.dist.outputs.cache-hit != 'true' && hashFiles('distfiles/**') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: distfiles
          key: ${{ steps.dist.outputs.cache-primary-key }}

      # the outcome of the build and of the checks of the VM (results/rc), after the caches
      # are saved: the job fails here, and nothing is published
      - name: The outcome of the build and of the checks
        id: outcome
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        run: |
          rc="$(cat results/rc 2>/dev/null || echo 'none: the VM gave no results/rc')"
          echo "results/rc: $rc"
          if [ "$rc" != 0 ]; then
            echo "::error title=build::the build or a check failed (results/rc: $rc): the summary of the run, the results"
            exit 1
          fi

      - name: Report
        id: report
        if: always()
        run: |
          # the summary goes to report.md first (tools/runs-report.sh commits it), then to the job summary
          summary="$GITHUB_STEP_SUMMARY"
          export GITHUB_STEP_SUMMARY="$PWD/report.md"
          : > report.md
          rc=0
          sh tools/report.sh results || rc=1
          cat report.md >> "$summary"
          exit $rc

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.cputype }}
          path: results/
          if-no-files-found: ignore

      - name: Publish
        id: publish
        # the servers read what main builds: a run of another branch never publishes
        if: ${{ success() && inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
        run: |
          major="${RELEASE%%.*}"
          level="${CPUTYPE#x86-64-}"
          tag="az-fbsd$major-amd64-$level"
          dir=repo
          # the servers read the catalog with signature_type pubkey: an unsigned one is not published
          last="$(tail -n 1 results/pkg-repo.log 2>/dev/null)"
          case "$last" in
            "pkg repo: signed"*) ;;
            *) echo "::error title=publish::the catalog is not signed ($last): not published"; exit 1 ;;
          esac
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          commit="$(sed -n 's/^ports_commit="\([0-9a-f]*\)".*/\1/p' tools/build.sh)"
          # the versions of PHP of the repository: its cores phpXY-<version>.pkg
          php="$(ls "$dir" | sed -n 's/^php\([0-9]\)\([0-9]\)-[0-9][^/]*\.pkg$/\1.\2/p' | sort -u | tr '\n' ' ' | sed 's/ $//; s/ /, /g')"
          notes="A repository of pkg for FreeBSD $major (amd64, CPUTYPE $CPUTYPE) of the packages of $GITHUB_REPOSITORY: the ports of this overlay built over freebsd-ports $commit with the make.conf of tools/make.conf.in: az (the libraries of /usr/local/az), curl, ffmpeg, ImageMagick6, ImageMagick7, GraphicsMagick, yt-dlp and PHP $php (phpXY with mod_phpXY and the modules phpXY-<module>). On a server, /usr/local/etc/pkg/repos/az.conf: az: { url: \"$url\", signature_type: \"pubkey\", pubkey: \"/usr/local/etc/pkg/keys/az.pub\", priority: 100, enabled: yes } with the key keys/az.pub of $GITHUB_REPOSITORY, then: pkg update -r az, pkg install -r az php84 mod_php84 php84-gd ... (yt-dlp: pkg install yt-dlp, its Python packages are those of FreeBSD; README.md)."
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "$notes" --target "$GITHUB_SHA" ||
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          # the packages first, the catalog of pkg repo last (the files that are not
          # <name>-<version>.pkg), then away with what the repository has no more
          pk="$(ls "$dir" | grep -E '^[^/]+-[0-9][^/]*\.pkg$' | sed "s#^#$dir/#")"
          if [ -n "$pk" ]; then gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $pk; fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $(ls -d "$dir"/* | grep -v -E '/[^/]+-[0-9][^/]*\.pkg$')
          for a in $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            [ -e "$dir/$a" ] || gh release delete-asset "$tag" "$a" --repo "$GITHUB_REPOSITORY" -y
          done
          # every file of the repository is in the release under its own name
          have="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for f in $(ls "$dir"); do
            printf '%s\n' "$have" | grep -qxF "$f" || { echo "not in the release $tag: $f"; exit 1; }
          done
          echo "published: $url ($(ls "$dir" | wc -l) files)"

      # the report into the branch runs of the private azsupport/azsupport (secret RUNS_TOKEN)
      - name: Report to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: release=${{ inputs.release }} cputype=${{ matrix.cputype }} ports=${{ inputs.ports }} force=${{ inputs.force }} jobs=${{ inputs.jobs }} configure_check=${{ inputs.configure_check }} publish=${{ inputs.publish }}
          RUNS_STEPS: build=${{ steps.build.outcome }} outcome=${{ steps.outcome.outcome }} report=${{ steps.report.outcome }} publish=${{ steps.publish.outcome }}
          PART: ${{ matrix.cputype }}
        run: sh tools/runs-report.sh report.md "$PART"
