name: Build the packages of the repository az

# Builds the ports of this overlay (tools/build.sh) in a FreeBSD VM, with the
# make.conf of aZ's servers for an x86-64 level (tools/make.conf.in), over the
# official ports tree at the commit pinned in tools/build.sh; when PHP was built,
# installs its packages from the new repository (tools/install-php.sh) and checks
# them (tools/check-php.sh), then the variants with OpenSSL in the places of their
# modules (install-php.sh --openssl, CHECK_TAG=openssl check-php.sh) and the other
# packages of redis, of gd of 5.6, of swoole of 8.1 to 8.4 and openssl-legacy (with
# ssh2 in the same process) one by one (tools/check-variants.sh); installs the
# programs and libraries from it and tests
# them (tools/test-programs.sh); and publishes
# the repository of pkg as the files of the release az-fbsd<major>-amd64-<level>
# of this repository (its address goes into /usr/local/etc/pkg/repos/az.conf of a
# server, README.md); with publish_only (the runs of yt-dlp-update.yml) only when the
# repository differs from the release by packages of those ports alone
# (tools/publish-gate.sh). The repository of the last run (a cache, kept also when a run
# fails) and the files of that release come first: a port whose package with the
# same az_hash is there already is not built again (unless force), and they go into
# the new repository with the new ones. Before the VM, tools/check-tree.sh checks the
# ports of this tree with make -V against a sparse official tree (bmake). Each port
# builds in a chroot of its own with only its dependencies (tools/build.sh: nothing of
# a build is left in the /usr/local of the VM for the checks after it). Up to
# "jobs" ports build at once (AZ_JOBS of tools/build.sh: waves of the ports whose
# dependencies are done; 1: one after another, as before), stage after stage: the
# groups of "ports" separated by ";", or for all of them the order of aZ (11.11.2026):
# az, then PHP 5.6, 7.4, 8.1, 8.3, 8.2, 8.4 (each with mod_php and its modules), then
# the rest; with "both", x86-64-v3 first, then x86-64-v2. With "configure_check"
# each PHP port built is configured once more, with the errors of C of GCC 14+ and
# clang 16+ as warnings, and compared with its build (AZ_CONFIGURE_CHECK of
# tools/build.sh: results/configure-check.txt, a section of the report).
# Started by hand: Actions, "Build the packages of the repository az", "Run workflow".

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'
      cputype:
        description: 'x86-64 level (CPUTYPE of make.conf)'
        type: choice
        options: [x86-64-v3, x86-64-v2, both]
        default: x86-64-v3
      ports:
        description: 'Ports to build (category/port, separated by spaces; with the ports of this tree they need), in groups separated by " ; " built one after another; empty: all, az first, then PHP 5.6, 7.4, 8.1, 8.3, 8.2, 8.4, then the rest'
        required: false
        default: ''
      force:
        description: 'Build the ports also when their package with the same az_hash is in the release already'
        type: boolean
        default: false
      jobs:
        description: 'Ports built at once (AZ_JOBS of tools/build.sh, in waves); 1: one after another'
        required: false
        default: '4'
      # AZ_CONFIGURE_CHECK of tools/build.sh: one more configure of each PHP port built
      configure_check:
        description: 'The configure check: each PHP port built configured once more, permissive, and compared (results/configure-check.txt); with force: every PHP port'
        type: boolean
        default: false
      # AZ_PLAN of tools/build.sh: what the run would build, cheaply (az/az first, when it
      # is to be built: the ports that need az are decided by the interfaces of the new az)
      plan:
        description: 'The plan only: az/az and the ports it needs built when they are to be, every other port decided (kept or to be built, and why: results/plan.txt), not built; no checks, never published'
        type: boolean
        default: false
      # the branch of azsupport/php-src whose freebsd/curl* the curl of az is compared with
      # (tools/curl-sync-check.sh, FORK_REF): a change of curl goes to a branch of the fork
      # first, and into master of the fork when the branch here goes into main
      fork_ref:
        description: 'The branch of azsupport/php-src the curl of az (az/az/files/curl*) has to be the same as (tools/curl-sync-check.sh): master, or the branch of the fork with a change of curl not yet in master'
        required: false
        default: 'master'
      # off by default: the repository the servers read is published on aZ's word
      publish:
        description: 'Publish the repository (the release the servers read) when everything built and every check passed'
        type: boolean
        default: false
      # the automatic publish of yt-dlp-update.yml (aZ, 12.11.2026): tools/publish-gate.sh
      publish_only:
        description: 'With publish: publish only when the repository differs from the release by packages of these ports alone (category/port, separated by spaces; yt-dlp-update.yml), else nothing; empty: whatever differs'
        required: false
        default: ''
      continuation:
        description: 'Set by a run whose time was over for the run it starts (its number in a row); 0 for a run started by hand'
        required: false
        default: '0'

permissions:
  contents: write
  # the next run of this workflow, when the time of one was over (the last step)
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # both: x86-64-v3 first, then x86-64-v2 (the order of aZ, 11.11.2026: v3 is needed first)
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cputype: ${{ inputs.cputype == 'both' && fromJSON('["x86-64-v3", "x86-64-v2"]') || fromJSON(format('["{0}"]', inputs.cputype)) }}
    name: build (${{ matrix.cputype }})
    # one job at a time for a release, a level and a branch: a run of main
    # publishes the release of its level, a run of another branch only tries its
    # ports (its caches are its own: GitHub gives a branch the caches of main, never
    # main those of another branch). The levels have their own releases and caches,
    # so a run of x86-64-v2 goes while one of x86-64-v3 does (and the two jobs of
    # both); a job of a level waits for the one of the same level
    concurrency:
      group: az-ports-${{ inputs.release }}-${{ matrix.cputype }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # the start of the job: the time of the build in the VM is reckoned from it
      - name: The start of the job
        run: echo "AZ_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      # the repository of the last run, published or not (a run that fails in PHP keeps
      # az and the libraries for the next one): the newest cache of the level
      - name: The repository of the last run
        uses: actions/cache/restore@v4
        with:
          path: repo
          key: repo-${{ matrix.cputype }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: repo-${{ matrix.cputype }}-

      # with the files of the release (tools/build.sh keeps the newer package of an origin)
      - name: The repository of the release, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
        run: |
          major="${RELEASE%%.*}"
          tag="az-fbsd$major-amd64-${CPUTYPE#x86-64-}"
          mkdir -p repo
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir repo --skip-existing || echo "::warning title=repository::the files of the release $tag did not all download: the ports whose package is missing are built again"
          else
            echo "no release $tag yet"
          fi
          ls -l repo

      # the distribution files of the ports, kept between the runs (the VM fetches what is missing)
      - name: The distribution files of the runs before
        id: dist
        uses: actions/cache/restore@v4
        with:
          path: distfiles
          key: distfiles-${{ hashFiles('**/distinfo') }}
          restore-keys: distfiles-

      # the release tarballs of azsupport/php-src the PHP ports need, fetched here with
      # retries before the VM: GitHub answered the fetch of the VM with 504 more than
      # once (run 42571397680), and the distfiles cache of FreeBSD has none of them.
      # What does not download here, the VM tries again (MASTER_SITES of the port)
      - name: The PHP tarballs of azsupport/php-src, fetched with retries
        run: |
          mkdir -p distfiles/php
          sed -n 's/^SHA256 (php\/\(php-[0-9][^)]*-fbsd-[^)]*\.tar\.xz\)) = \([0-9a-f]*\)$/\1 \2/p' lang/php*/distinfo | sort -u > /tmp/php-tarballs
          while read -r f sum; do
            v="${f#php-}"; v="${v%%-fbsd-*}"; rel="${f#*-fbsd-}"; rel="${rel%.tar.xz}"
            d="distfiles/php/$f"
            if [ -f "$d" ] && [ "$(sha256sum < "$d" | cut -c1-64)" = "$sum" ]; then echo "have $f"; continue; fi
            u="https://github.com/azsupport/php-src/releases/download/freebsd-${v%.*}-$rel/$f"
            if curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o "$d.part" "$u" &&
              [ "$(sha256sum < "$d.part" | cut -c1-64)" = "$sum" ]; then
              mv "$d.part" "$d"; echo "fetched $f"
            else
              rm -f "$d.part"; echo "::warning title=distfiles::$f did not download here ($u): the VM tries again"
            fi
          done < /tmp/php-tarballs

      # the ports of this tree with make -V against the official tree, before the VM:
      # a port that names a missing origin, a wrong PKGORIGIN, two ports of one PKGNAME
      # (tools/check-tree.sh) stop the run here, not after an hour of az/az; bmake and
      # the sparse official tree as tools/check-tree-ci.sh makes them (yt-dlp-update.yml too)
      - name: The ports of this tree checked with make -V (bmake, a sparse official tree)
        env:
          CPUTYPE: ${{ matrix.cputype }}
          RELEASE: ${{ inputs.release }}
        run: sh tools/check-tree-ci.sh "$RELEASE" "$CPUTYPE"

      # the curl of az (az/az/files/curl.conf, curl-deps.conf, curl/) must be that of
      # the PHP of azsupport/php-src (freebsd/ there, on master, or on the branch of
      # fork_ref): the same releases and patches. A difference stops the run here,
      # before the VM
      - name: The curl of az and that of azsupport/php-src
        env:
          FORK_REF: ${{ inputs.fork_ref || 'master' }}
        run: |
          set -o pipefail
          sh tools/curl-sync-check.sh 2>&1 | tee curl-sync-check.txt

      - name: Free space on the runner (the disk of the VM grows on it)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune --all --force > /dev/null 2>&1 || true
          df -h /

      # the key of the repository az (the secret PKG_SIGNING_KEY, PEM) in one line for envs:
      # of the VM, masked; tools/pkg-repo-sign.sh signs with it there (no key: unsigned)
      - name: The signing key of the repository, for the VM
        id: key
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          if [ -n "$PKG_SIGNING_KEY" ]; then
            b64="$(printf '%s\n' "$PKG_SIGNING_KEY" | base64 -w0)"
            echo "::add-mask::$b64"
            echo "b64=$b64" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=signing key::no PKG_SIGNING_KEY: the repository will not be signed (and not published)"
          fi

      # the progress of the build while the VM builds (GitHub gives the log of a job only
      # when it ends): tools/runs-progress.sh in the background, every 10 minutes into
      # the branch runs of azsupport/azsupport (secret RUNS_TOKEN), until the VM gives
      # results/ back; its own log for the step at the end
      - name: The progress of the build, to azsupport/azsupport
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          PART: ${{ matrix.cputype }}
        run: |
          nohup sh tools/runs-progress.sh "$PART" 10 > "$RUNNER_TEMP/runs-progress.log" 2>&1 &
          echo "tools/runs-progress.sh: pid $!, every 10 minutes"

      # the build tests (tools/test-programs.sh and the *-test.sh) are kept in the
      # private azsupport/azsupport (tests/ports/), not in this public repo; fetch them
      # into tools/ with RUNS_TOKEN so the VM runs them (the workspace is synced into the
      # VM). They are in .gitignore here. No token: the VM runs no tests.
      - name: The build tests of azsupport/azsupport, into tools/
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
        run: |
          if [ -z "$RUNS_TOKEN" ]; then
            echo "::warning title=tests::no RUNS_TOKEN: the VM runs no tests"
            exit 0
          fi
          t="$RUNNER_TEMP/az-tests.tgz"
          curl -fsSL -H "Authorization: Bearer $RUNS_TOKEN" -H "Accept: application/vnd.github+json" \
            -o "$t" "https://api.github.com/repos/azsupport/azsupport/tarball/main"
          tar -xzf "$t" -C tools --strip-components=3 --wildcards '*/tests/ports/*'
          rm -f "$t"
          echo "tests in tools/: $(ls tools/test-programs.sh tools/*-test.sh 2>/dev/null | wc -l) scripts"

      # the time the build in the VM has (tools/build.sh: AZ_TIME_SOFT, AZ_TIME_HARD), from
      # the start of the job, whose limit is 350 minutes: no port starts after 245 minutes,
      # the builds still going stop at 285; less 8 minutes for the boot of the VM. Then
      # the VM writes the repository, gives results/ and repo/ back, and the steps after
      # it keep the packages in the cache for the next run (which the last step starts)
      - name: The time of the build
        run: |
          now="$(date +%s)"; start="${AZ_JOB_START:-$now}"
          soft=$((start + 245 * 60 - 480 - now)); hard=$((start + 285 * 60 - 480 - now))
          [ "$soft" -gt 600 ] || soft=600; [ "$hard" -gt "$soft" ] || hard="$soft"
          echo "AZ_TIME_SOFT=$soft" >> "$GITHUB_ENV"; echo "AZ_TIME_HARD=$hard" >> "$GITHUB_ENV"
          echo "the VM: no port starts after $((soft / 60)) minutes, the builds still going stop at $((hard / 60)) (from the start of tools/build.sh)"

      - name: Build and check in FreeBSD ${{ inputs.release }}
        id: build
        uses: vmactions/freebsd-vm@v1
        env:
          AZ_CPUTYPE: ${{ matrix.cputype }}
          AZ_PORTS: ${{ inputs.ports }}
          AZ_FORCE: ${{ inputs.force && '1' || '' }}
          AZ_JOBS: ${{ inputs.jobs || '4' }}
          AZ_CONFIGURE_CHECK: ${{ inputs.configure_check && '1' || '' }}
          AZ_PLAN: ${{ inputs.plan && '1' || '' }}
          AZ_PKG_KEY: ${{ steps.key.outputs.b64 }}
        with:
          release: ${{ inputs.release }}
          # the runner has 16 GB: 12 GB for the VM (up to 4 builds at once, each with
          # make -j of the 4 vCPUs), about 4 GB left to the host
          mem: 12288
          envs: 'AZ_CPUTYPE AZ_PORTS AZ_FORCE AZ_JOBS AZ_CONFIGURE_CHECK AZ_PLAN AZ_PKG_KEY AZ_TIME_SOFT AZ_TIME_HARD'
          prepare: |
            if [ -n "${AZ_PKG_KEY:-}" ]; then (umask 077 && printf '%s' "$AZ_PKG_KEY" > /root/.az-pkg-key.b64); fi; unset AZ_PKG_KEY
            env ASSUME_ALWAYS_YES=yes pkg install -y git-lite
          # the script never stops before its end (vmactions copies results/ and repo/ back
          # only after a script that ended well): what failed goes into results/rc (0: the
          # build and every check passed), and a step after the caches fails the job on it
          run: |
            if [ -n "${AZ_PKG_KEY:-}" ]; then (umask 077 && printf '%s' "$AZ_PKG_KEY" > /root/.az-pkg-key.b64); fi; unset AZ_PKG_KEY
            trap 'rm -f /root/.az-pkg-key.b64' EXIT
            if [ -s /root/.az-pkg-key.b64 ]; then export AZ_PKG_KEY_FILE=/root/.az-pkg-key.b64; fi
            rc=0
            sh tools/build.sh ${AZ_FORCE:+--force} --repo repo $AZ_PORTS || rc=$?
            mkdir -p results
            echo "$rc" > results/rc
            # the PHP of each version a package of which was built: installed from the
            # repository as a server installs it, and checked, when the repository has its
            # catalog and the core of the version is there (not in a plan: AZ_PLAN)
            : > results/checks.txt
            # no debug (aZ, 17.11.2026): every package of this run without debug
            # information and stripped (tools/debug-check.sh in tools/build.sh); a FAIL
            # keeps the run from being published
            if [ -s results/debug-check.txt ]; then
              nd="$(grep -c . results/debug-check.txt || :)"
              nf="$(grep -c '^FAIL' results/debug-check.txt || :)"
              if [ "$nf" -gt 0 ]; then
                echo "debug: FAIL ($nf of $nd packages of this run with debug information or not stripped: $(awk '$1 == "FAIL" { sub(/:$/, "", $2); printf "%s ", $2 }' results/debug-check.txt)- results/debug-check.txt)" >> results/checks.txt
                rc=1
              else
                echo "debug: OK ($nd packages of this run: no debug information, stripped)" >> results/checks.txt
              fi
            fi
            if [ -n "${AZ_PLAN:-}" ]; then
              echo "plan (AZ_PLAN): no checks and no tests (results/plan.txt)" >> results/checks.txt
            elif [ -f results/time-limit ]; then
              echo "time limit: no checks and no tests, the next run goes on ($(head -n 1 results/time-limit); results/time-limit)" >> results/checks.txt
            else
            # the catalog the checks read: the signed one of repo/, else the unsigned one
            # of this run (work/repo-unsigned of build.sh: checks only, never published)
            crepo=repo
            if [ ! -f repo/meta.conf ] && [ -f work/repo-unsigned/meta.conf ]; then
              crepo=work/repo-unsigned
              echo "unsigned catalog: checks only, not published (work/repo-unsigned; $(tail -n 1 results/pkg-repo.log 2>/dev/null || echo 'no pkg-repo.log'))" >> results/checks.txt
            fi
            for v in $(awk '$1 ~ /\// && $2 == "OK" { print $3 }' results/summary.txt 2>/dev/null | sed -n -E 's/^(mod_)?php([0-9])([0-9])-.*/\2.\3/p' | sort -u); do
              core="lang/php$(echo "$v" | tr -d .)"
              cl="$(awk -v o="$core" '$1 == o { print; exit }' results/summary.txt 2>/dev/null || true)"
              if [ ! -f "$crepo/meta.conf" ]; then
                echo "PHP $v: SKIP (no catalog in $crepo: $(tail -n 1 results/pkg-repo.log 2>/dev/null || echo 'no pkg-repo.log'))" >> results/checks.txt
                continue
              fi
              case "$cl" in
                *" OK "*|*"in the repository already"*) ;;
                *) echo "PHP $v: SKIP (the core $core is not there: ${cl:-not in the queue})" >> results/checks.txt; continue ;;
              esac
              r=0
              sh tools/install-php.sh --repo "$crepo" "$v" || r=$?
              if [ "$r" = 3 ]; then
                echo "PHP $v: SKIP (the repository has no core php of $v)" >> results/checks.txt
              elif [ "$r" != 0 ]; then
                echo "PHP $v: FAIL (the packages did not install, exit $r: install-php-$v.log)" >> results/checks.txt
                rc=1
              elif [ ! -f tools/check-php.sh ]; then
                echo "PHP $v: SKIP (no tools/check-php.sh)" >> results/checks.txt
              else
                r=0
                sh tools/check-php.sh "$v" || r=$?
                if [ "$r" = 0 ]; then
                  echo "PHP $v: OK (check-php-$v.txt)" >> results/checks.txt
                else
                  echo "PHP $v: FAIL (check-php-$v.txt, exit $r)" >> results/checks.txt
                  rc=1
                fi
                # the variants with OpenSSL (phpXY-<module>-openssl) in the places of
                # their modules, checked the same way, when the repository has them
                if [ -n "$(ls "$crepo"/php"$(echo "$v" | tr -d .)"-*-openssl-[0-9]*.pkg 2>/dev/null)" ]; then
                  r=0
                  sh tools/install-php.sh --repo "$crepo" --openssl "$v" || r=$?
                  if [ "$r" != 0 ]; then
                    echo "PHP $v, the variants with OpenSSL: FAIL (they did not install, exit $r: install-php-$v-openssl.log)" >> results/checks.txt
                    rc=1
                  else
                    r=0
                    CHECK_TAG=openssl sh tools/check-php.sh "$v" || r=$?
                    if [ "$r" = 0 ]; then
                      echo "PHP $v, the variants with OpenSSL: OK (check-php-$v-openssl.txt)" >> results/checks.txt
                    else
                      echo "PHP $v, the variants with OpenSSL: FAIL (check-php-$v-openssl.txt, exit $r)" >> results/checks.txt
                      rc=1
                    fi
                  fi
                fi
                # the packages of a module with the same files (redis with compression,
                # gd of 5.6 with T1lib, openssl-legacy with ssh2 in the same process),
                # each in turn: tools/check-variants.sh
                vs="$(echo "$v" | tr -d .)"
                if [ -n "$(ls "$crepo"/php"$vs"-redis-*-[0-9]*.pkg "$crepo"/php"$vs"-gd-t1lib-[0-9]*.pkg "$crepo"/php"$vs"-openssl-legacy-[0-9]*.pkg 2>/dev/null)" ]; then
                  r=0
                  sh tools/check-variants.sh "$v" || r=$?
                  if [ "$r" = 0 ]; then
                    echo "PHP $v, the packages of redis, gd and openssl with the same files: OK (check-variants-$v.txt)" >> results/checks.txt
                  else
                    echo "PHP $v, the packages of redis, gd and openssl with the same files: FAIL (check-variants-$v.txt, exit $r)" >> results/checks.txt
                    rc=1
                  fi
                fi
              fi
            done
            # the programs and libraries (az, curl, ffmpeg, ImageMagick6 and 7, GraphicsMagick, mc)
            # installed from the repository and tested (the samples with the official
            # packages first); exit 2: no catalog, said in checks.txt
            r=0
            if [ -f tools/test-programs.sh ]; then
              # its output and every result of a test go into results/tests/, which goes
              # only to the private azsupport/azsupport (the step "The results of the tests"):
              # this public log gets "test <name>: OK|FAIL|SKIP" of results/checks.txt alone
              mkdir -p results/tests
              sh tools/test-programs.sh --repo "$crepo" > results/tests/test-programs.out 2>&1 || r=$?
            else
              echo "programs: SKIP (no tools/test-programs.sh: the tests of azsupport/azsupport were not fetched)" >> results/checks.txt
            fi
            if [ "$r" = 1 ]; then rc=1; fi
            fi
            cat results/checks.txt
            echo "$rc" > results/rc
            echo "results/rc: $rc"
            # not back to the runner: the official tree, the work directories, the
            # chroots, the packages (they are in repo/). tools/build.sh tears its chroots
            # down itself (work/ch); what is still mounted under work/ goes first, and rm
            # never crosses a mount point (-x): the distfiles and the base system mounted
            # in a chroot are never removed, and none goes back to the runner
            mount -p | awk -v d="$(pwd -P)/work/" 'index($2, d) == 1 { print length($2), $2 }' | sort -rn | cut -d ' ' -f 2- |
              while read -r m; do umount -f "$m" || echo "cannot unmount $m"; done
            rm -rfx work packages
            exit 0

      # vmactions copies repo/ back without deleting: what tools/build.sh removed there (an
      # older package of an origin, an origin the tree has no more, a name with a comma)
      # would stay here, in the cache and in the release. results/repo-files.txt has the
      # files the VM left in repo/
      - name: The repository as the VM left it
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        run: |
          if [ ! -f results/repo-files.txt ]; then
            echo "no results/repo-files.txt (tools/build.sh did not get that far): repo/ stays as it is"
            exit 0
          fi
          for f in repo/*; do
            [ -e "$f" ] || continue
            if ! grep -qxF "${f##*/}" results/repo-files.txt; then
              echo "removed, not in the repository of the VM: ${f##*/}"
              rm -rf "$f"
            fi
          done
          ls repo | wc -l

      # the repository of this run for the next one, also when the run failed (only repo/:
      # the caches of a repository have 10 GB)
      - name: The repository of this run, kept for the next one
        if: ${{ always() && steps.build.outcome != 'skipped' && hashFiles('repo/*.pkg') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: repo
          key: repo-${{ matrix.cputype }}-${{ github.run_id }}-${{ github.run_attempt }}

      # by a run of main alone: a branch reads those of main and fetches what it adds, while
      # a copy of its own (3.5 GB, its distinfo differs) pushed the repository of packages of
      # main out of the 10 GB of the caches of the repository (13.11.2026: the run of a
      # branch then found no packages of main and built its ports from nothing)
      - name: The distribution files, kept for the next run
        if: ${{ always() && github.ref_name == github.event.repository.default_branch && steps.build.outcome != 'skipped' && steps.dist.outputs.cache-hit != 'true' && hashFiles('distfiles/**') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: distfiles
          key: ${{ steps.dist.outputs.cache-primary-key }}

      # the outcome of the build and of the checks of the VM (results/rc), after the caches
      # are saved: the job fails here, and nothing is published
      - name: The outcome of the build and of the checks
        id: outcome
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        run: |
          rc="$(cat results/rc 2>/dev/null || echo 'none: the VM gave no results/rc')"
          echo "results/rc: $rc"
          if [ "$rc" != 0 ]; then
            echo "::error title=build::the build or a check failed (results/rc: $rc): the summary of the run, the results"
            exit 1
          fi

      # results/tests/ (the outputs of the tests, their whole lines of the checks): into the
      # branch runs of the private azsupport/azsupport as one archive
      # (ports-build/<date>/<run>-<level>-tests.tar.xz), then away from results/, so that
      # neither the job summary nor the public artifact results-<level> has a line of them
      - name: The results of the tests, to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          PART: ${{ matrix.cputype }}
        run: |
          [ -d results/tests ] || { echo "no results/tests: no test ran"; exit 0; }
          a="${GITHUB_RUN_ID}-${PART}-tests.tar.xz"
          tar -cJf "$RUNNER_TEMP/$a" -C results tests
          mv results/tests "$RUNNER_TEMP/tests"
          if [ -z "$RUNS_TOKEN" ]; then
            echo "::warning title=test results::no RUNS_TOKEN: the results of the tests are not kept"
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          w="$RUNNER_TEMP/runs-tests"
          git clone -q --depth 1 --branch runs --single-branch \
            "https://x-access-token:${RUNS_TOKEN}@github.com/azsupport/azsupport.git" "$w"
          mkdir -p "$w/ports-build/$day"
          cp "$RUNNER_TEMP/$a" "$w/ports-build/$day/$a"
          git -C "$w" add "ports-build/$day/$a"
          git -C "$w" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "ports-build $PART: the results of the tests of run $GITHUB_RUN_ID"
          i=0
          until git -C "$w" push -q origin HEAD:runs; do
            i=$((i + 1)); [ $i -lt 10 ] || { echo "::warning title=test results::push to azsupport/azsupport failed"; exit 0; }
            sleep $((i * 3))
            # the rebase rewrites the commit: it needs the identity the commit was made with
            git -C "$w" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              pull -q --rebase origin runs || :
          done
          echo "the results of the tests: azsupport/azsupport, branch runs, ports-build/$day/$a"

      - name: Report
        id: report
        if: always()
        run: |
          # the summary goes to report.md first (tools/runs-report.sh commits it), then to the job summary
          summary="$GITHUB_STEP_SUMMARY"
          export GITHUB_STEP_SUMMARY="$PWD/report.md"
          : > report.md
          rc=0
          sh tools/report.sh results || rc=1
          cat report.md >> "$summary"
          exit $rc

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.cputype }}
          # never the results of the tests (they went to azsupport/azsupport above)
          path: |
            results/
            !results/tests/
          if-no-files-found: ignore

      - name: Publish
        id: publish
        # the servers read what main builds: a run of another branch never publishes, nor a plan
        if: ${{ success() && inputs.publish && !inputs.plan && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          major="${RELEASE%%.*}"
          level="${CPUTYPE#x86-64-}"
          tag="az-fbsd$major-amd64-$level"
          dir=repo
          # the servers read the catalog with signature_type pubkey: an unsigned one is not published
          last="$(tail -n 1 results/pkg-repo.log 2>/dev/null)"
          case "$last" in
            "pkg repo: signed"*) ;;
            *) echo "::error title=publish::the catalog is not signed ($last): not published"; exit 1 ;;
          esac
          # publish_only (yt-dlp-update.yml): the release takes the repository only when
          # it differs from it by packages of these ports alone; else nothing is published,
          # the report says so, and what the run built goes out with the next publish of
          # aZ (the cache of the run keeps it): tools/publish-gate.sh
          if [ -n "$PUBLISH_ONLY" ]; then
            r=0
            sh tools/publish-gate.sh "$dir" "$tag" $PUBLISH_ONLY > gate.md || r=$?
            cat gate.md
            { echo; cat gate.md; } >> report.md
            cat gate.md >> "$GITHUB_STEP_SUMMARY"
            case "$r" in
              0) ;;
              3) echo "nothing new to publish in $tag"; exit 0 ;;
              1) echo "::warning title=publish::not published: the repository differs from the release $tag by more than $PUBLISH_ONLY (the summary)"; exit 0 ;;
              *) echo "::error title=publish::tools/publish-gate.sh failed (exit $r): not published"; exit 1 ;;
            esac
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          commit="$(sed -n 's/^ports_commit="\([0-9a-f]*\)".*/\1/p' tools/build.sh)"
          # the versions of PHP of the repository: its cores phpXY-<version>.pkg
          php="$(ls "$dir" | sed -n 's/^php\([0-9]\)\([0-9]\)-[0-9][^/]*\.pkg$/\1.\2/p' | sort -u | tr '\n' ' ' | sed 's/ $//; s/ /, /g')"
          notes="A repository of pkg for FreeBSD $major (amd64, CPUTYPE $CPUTYPE) of the packages of $GITHUB_REPOSITORY: the ports of this overlay built over freebsd-ports $commit with the make.conf of tools/make.conf.in: az (the libraries of /usr/local/az), curl (with SCP and SFTP), ffmpeg, ImageMagick6, ImageMagick7, GraphicsMagick, mc, yt-dlp and PHP $php (phpXY with mod_phpXY and the modules phpXY-<module>, phpXY-ssh2 among them). On a server, /usr/local/etc/pkg/repos/az.conf: az: { url: \"$url\", signature_type: \"pubkey\", pubkey: \"/usr/local/etc/pkg/keys/az.pub\", priority: 100, enabled: yes } with the key keys/az.pub of $GITHUB_REPOSITORY, then: pkg update -r az, pkg install -r az php84 mod_php84 php84-gd ... (yt-dlp: pkg install yt-dlp, its Python packages are those of FreeBSD; README.md)."
          # a new release: its tag at the head of main. The token of a run may not make a
          # ref whose files of .github/workflows differ from those of main: HTTP 403
          # "Resource not accessible by integration" for the tag az-fbsd15-amd64-v2 at
          # the commit of the run (e6ab6bb, run 42687480870) and at a66ae75 (run
          # 42710559503), each made while main was at a commit with another build.yml;
          # the tag of x86-64-v3 was made at the head of main (e10d5f6). The tag only
          # names the release, the files are those of this run
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "$notes" --target main ||
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          # GitHub keeps at most 1000 files in a release (HTTP 422 "file_count limited to
          # 1000 assets per release": run 43930987665, 16.11.2026, after a build of every
          # port gave every package a new name): when the files of the release and those of
          # this repository it lacks would pass 1000, away first with what this repository
          # has no more (until the new catalog is up, the catalog of the release still names
          # them: a pkg upgrade of a server in those minutes fails and is done again)
          have="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          nhave="$(printf '%s\n' "$have" | grep -c . || :)"
          nnew="$(ls "$dir" | while read -r f; do printf '%s\n' "$have" | grep -qxF "$f" || echo "$f"; done | grep -c . || :)"
          if [ $((nhave + nnew)) -gt 1000 ]; then
            echo "the release has $nhave files and lacks $nnew of this repository: over 1000, its old files away first"
            for a in $have; do
              [ -e "$dir/$a" ] || gh release delete-asset "$tag" "$a" --repo "$GITHUB_REPOSITORY" -y
            done
          fi
          # the packages first, the catalog of pkg repo last (the files that are not
          # <name>-<version>.pkg), then away with what the repository has no more
          pk="$(ls "$dir" | grep -E '^[^/]+-[0-9][^/]*\.pkg$' | sed "s#^#$dir/#")"
          if [ -n "$pk" ]; then gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $pk; fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $(ls -d "$dir"/* | grep -v -E '/[^/]+-[0-9][^/]*\.pkg$')
          for a in $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            [ -e "$dir/$a" ] || gh release delete-asset "$tag" "$a" --repo "$GITHUB_REPOSITORY" -y
          done
          # every file of the repository is in the release under its own name
          have="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for f in $(ls "$dir"); do
            printf '%s\n' "$have" | grep -qxF "$f" || { echo "not in the release $tag: $f"; exit 1; }
          done
          echo "published: $url ($(ls "$dir" | wc -l) files)"

      - name: The log of the progress reporter
        if: always()
        continue-on-error: true
        run: tail -n 20 "$RUNNER_TEMP/runs-progress.log" 2>/dev/null || echo "no log of tools/runs-progress.sh"

      # the report into the branch runs of the private azsupport/azsupport (secret RUNS_TOKEN)
      - name: Report to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: release=${{ inputs.release }} cputype=${{ matrix.cputype }} ports=${{ inputs.ports }} force=${{ inputs.force }} jobs=${{ inputs.jobs }} configure_check=${{ inputs.configure_check }} plan=${{ inputs.plan }} fork_ref=${{ inputs.fork_ref }} publish=${{ inputs.publish }} publish_only=${{ inputs.publish_only }}
          RUNS_STEPS: build=${{ steps.build.outcome }} outcome=${{ steps.outcome.outcome }} report=${{ steps.report.outcome }} publish=${{ steps.publish.outcome }}
          PART: ${{ matrix.cputype }}
        run: sh tools/runs-report.sh report.md "$PART"

      # a run whose time was over (results/time-limit) and that built something goes on in
      # a new run of this workflow with the same inputs (not force: what it built is in the
      # cache of the repository); GITHUB_TOKEN may start a workflow_dispatch, and the new
      # job waits for this one (the concurrency of the level). With "both", a v3 that goes
      # on stops this run here, so that x86-64-v2 does not start before v3 is done (aZ,
      # 11.11.2026). At most 6 runs in a row
      - name: The next run, when the time of this one was over
        if: ${{ always() && !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IN_RELEASE: ${{ inputs.release }}
          IN_CPUTYPE: ${{ inputs.cputype }}
          IN_PORTS: ${{ inputs.ports }}
          IN_JOBS: ${{ inputs.jobs }}
          IN_CCHECK: ${{ inputs.configure_check }}
          IN_FORK_REF: ${{ inputs.fork_ref }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_PUBLISH_ONLY: ${{ inputs.publish_only }}
          IN_CONT: ${{ inputs.continuation }}
          LEVEL: ${{ matrix.cputype }}
        run: |
          [ -f results/time-limit ] || { echo "the time of this run was enough: no next run"; exit 0; }
          first="$(head -n 1 results/time-limit)"
          echo "results/time-limit: $first"
          built="$(printf '%s' "$first" | sed -n 's/.*built=\([0-9]*\).*/\1/p')"
          n="${IN_CONT:-0}"; case "$n" in ''|*[!0-9]*) n=0 ;; esac
          if [ "${built:-0}" -eq 0 ]; then
            echo "::error title=time limit::this run built nothing in its time: no next run (a port that takes longer than a run?)"
            exit 1
          fi
          if [ "$n" -ge 5 ]; then
            echo "::error title=time limit::6 runs in a row and the build is not done: no next run"
            exit 1
          fi
          cp="$IN_CPUTYPE"
          [ "$IN_CPUTYPE" = both ] && [ "$LEVEL" = x86-64-v2 ] && cp=x86-64-v2
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f release="$IN_RELEASE" -f cputype="$cp" -f ports="$IN_PORTS" -f force=false \
            -f jobs="$IN_JOBS" -f configure_check="$IN_CCHECK" -f plan=false -f fork_ref="$IN_FORK_REF" \
            -f publish="$IN_PUBLISH" -f publish_only="$IN_PUBLISH_ONLY" -f continuation="$((n + 1))"
          echo "the next run: build.yml, cputype $cp, continuation $((n + 1))" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$IN_CPUTYPE" = both ] && [ "$LEVEL" = x86-64-v3 ]; then
            echo "x86-64-v3 goes on in the next run: this run stops, so that x86-64-v2 does not start before it"
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi
