name: Build the packages of the repository azsupport

# Builds the ports of this overlay (tools/build.sh) in a FreeBSD VM, with the
# make.conf of aZ's servers for an x86-64 level (tools/make.conf.in), over the
# official ports tree at the commit pinned in tools/build.sh; when PHP was built, or
# taken from the drafts of the runs before (the builds of 13Z0), or named in
# php_checks, installs its packages from the new repository (tools/install-php.sh) and
# checks them (tools/check-php.sh), then the variants with OpenSSL in the places of their
# modules (install-php.sh --openssl, CHECK_TAG=openssl check-php.sh) and the other
# packages of redis, of gd of 5.6, of swoole of 8.1 to 8.4 and openssl-legacy (with
# ssh2 in the same process) one by one (tools/check-variants.sh); installs the
# programs and libraries from it and tests
# them (tools/test-programs.sh); and publishes
# the repository of pkg as the files of the release azsupport-fbsd<major>-amd64-<level>
# of this repository (its address goes into /usr/local/etc/pkg/repos/azsupport.conf of a
# server, README.md); with publish_only (the runs of yt-dlp-update.yml) only when the
# repository differs from the release by packages of those ports alone
# (tools/publish-gate.sh). The repository of the last run (a cache, kept also when a run
# fails) and the files of that release come first: a port whose package with the
# same azsupport_hash is there already is not built again (unless force), and they go into
# the new repository with the new ones. Before the VM, tools/check-tree.sh checks the
# ports of this tree with make -V against a sparse official tree (bmake). Each port
# builds in a chroot of its own with only its dependencies (tools/build.sh: nothing of
# a build is left in the /usr/local of the VM for the checks after it). Up to
# "jobs" ports build at once (AZSUPPORT_JOBS of tools/build.sh: waves of the ports whose
# dependencies are done; 1: one after another, as before), stage after stage: the
# groups of "ports" separated by ";", or for all of them the order of aZ (11.11.2026):
# azsupport, then PHP 5.6, 7.4, 8.1, 8.3, 8.2, 8.4 (each with mod_php and its modules), then
# the rest; with "both", x86-64-v3 first, then x86-64-v2. With "configure_check"
# each PHP port built is configured once more, with the errors of C of GCC 14+ and
# clang 16+ as warnings, and compared with its build (AZSUPPORT_CONFIGURE_CHECK of
# tools/build.sh: results/configure-check.txt, a section of the report).
# Started by hand: Actions, "Build the packages of the repository azsupport", "Run workflow".

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'
      cputype:
        description: 'x86-64 level (CPUTYPE of make.conf)'
        type: choice
        options: [x86-64-v3, x86-64-v2, both]
        default: x86-64-v3
      ports:
        description: 'Ports to build (category/port, separated by spaces; with the ports of this tree they need), in groups separated by " ; " built one after another; empty: all, azsupport first, then PHP 5.6, 7.4, 8.1, 8.3, 8.2, 8.4, then the rest'
        required: false
        default: ''
      force:
        description: 'Build the ports also when their package with the same azsupport_hash is in the release already'
        type: boolean
        default: false
      jobs:
        description: 'Ports built at once (AZSUPPORT_JOBS of tools/build.sh, in waves); 1: one after another'
        required: false
        default: '4'
      # the memory of the VM in MB: the runner has 16 GB and no swap; with 12 GB for the VM,
      # QEMU holds 12.3 GB from the start (the page cache of the VM fills its memory) and
      # the runner keeps 2.2 GB (run 45150597203, 23.11.2026). Less for a run that builds
      # nothing heavy (a publish of packages already built): with 10 GB the runner keeps
      # 4.2-4.5 GB (runs 45158786947 and 45171925669). The VM that stopped answering ssh at
      # the end of the tests in three runs of 23.11.2026 was not short of memory, with
      # 10 GB either
      vm_mem:
        description: 'Memory of the VM in MB (12288; 10240 leaves the runner 2 GB more, for a run that builds nothing heavy)'
        required: false
        default: '12288'
      # AZSUPPORT_CONFIGURE_CHECK of tools/build.sh: one more configure of each PHP port built
      configure_check:
        description: 'The configure check: each PHP port built configured once more, permissive, and compared (results/configure-check.txt); with force: every PHP port'
        type: boolean
        default: false
      # AZSUPPORT_PLAN of tools/build.sh: what the run would build, cheaply (azsupport/azsupport first, when it
      # is to be built: the ports that need azsupport are decided by the interfaces of the new azsupport)
      plan:
        description: 'The plan only: azsupport/azsupport and the ports it needs built when they are to be, every other port decided (kept or to be built, and why: results/plan.txt), not built; no checks, never published'
        type: boolean
        default: false
      # the branch of azsupport/php-src whose freebsd/curl* the curl of azsupport is compared with
      # (tools/curl-sync-check.sh, FORK_REF): a change of curl goes to a branch of the fork
      # first, and into master of the fork when the branch here goes into main
      fork_ref:
        description: 'The branch of azsupport/php-src the curl of azsupport (azsupport/azsupport/files/curl*) has to be the same as (tools/curl-sync-check.sh): master, or the branch of the fork with a change of curl not yet in master'
        required: false
        default: 'master'
      # off by default: the repository the servers read is published on aZ's word
      publish:
        description: 'Publish the repository (the release the servers read) when everything built and every check passed'
        type: boolean
        default: false
      # the automatic publish of yt-dlp-update.yml (aZ, 12.11.2026): tools/publish-gate.sh
      publish_only:
        description: 'With publish: publish only when the repository differs from the release by packages of these ports alone (category/port, separated by spaces; yt-dlp-update.yml), else nothing; empty: whatever differs'
        required: false
        default: ''
      continuation:
        description: 'Set by a run whose time was over for the run it starts (its number in a row); 0 for a run started by hand'
        required: false
        default: '0'
      # the packages that other branches built and that went into this one with them: the
      # x86-64-v3 builds on the 16-core runner of 13Z0 save theirs as drafts of their branch
      # (aZ, 18.11.2026 19:13), and the run of main that publishes them takes those drafts
      drafts:
        description: 'Other branches whose drafts wip-<level>-<branch>-* this run takes too, as those of its own (separated by spaces), once those branches went into this one'
        required: false
        default: ''
      # the PHP checks of versions none of whose packages this run built or took from a
      # draft (those it did are checked anyway): the PHP of the repository checked again
      php_checks:
        description: 'PHP versions to install and check (tools/install-php.sh, tools/check-php.sh) also when this run neither built nor took from a draft a package of theirs (separated by spaces, e.g. "7.4 8.1"; all: every core phpXY of the repository)'
        required: false
        default: ''

permissions:
  contents: write
  # the next run of this workflow, when the time of one was over (the last step)
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # both: x86-64-v3 first, then x86-64-v2 (the order of aZ, 11.11.2026: v3 is needed first)
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cputype: ${{ inputs.cputype == 'both' && fromJSON('["x86-64-v3", "x86-64-v2"]') || fromJSON(format('["{0}"]', inputs.cputype)) }}
    name: build (${{ matrix.cputype }})
    env:
      # the files of tools/runs-progress.sh and tools/runs-save.sh, outside /home/runner/work,
      # which vmactions copies into the VM and back (back over what changed meanwhile)
      AZSUPPORT_RUNS_STATE: /tmp/azsupport-runs
    # one job at a time for a release, a level and a branch: a run of main
    # publishes the release of its level, a run of another branch only tries its
    # ports (its caches are its own: GitHub gives a branch the caches of main, never
    # main those of another branch). The levels have their own releases and caches,
    # so a run of x86-64-v2 goes while one of x86-64-v3 does (and the two jobs of
    # both); a job of a level waits for the one of the same level
    concurrency:
      group: azsupport-ports-${{ inputs.release }}-${{ matrix.cputype }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # the start of the job: the time of the build in the VM is reckoned from it
      - name: The start of the job
        run: echo "AZSUPPORT_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      # the repository of the last run, published or not (a run that fails in PHP keeps
      # azsupport and the libraries for the next one): the newest cache of the level
      - name: The repository of the last run
        uses: actions/cache/restore@v4
        with:
          path: repo
          key: repo-${{ matrix.cputype }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: repo-${{ matrix.cputype }}-

      # with the files of the release (tools/build.sh keeps the newer package of an origin)
      - name: The repository of the release, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
        run: |
          major="${RELEASE%%.*}"
          tag="azsupport-fbsd$major-amd64-${CPUTYPE#x86-64-}"
          mkdir -p repo
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir repo --skip-existing || echo "::warning title=repository::the files of the release $tag did not all download: the ports whose package is missing are built again"
          else
            echo "no release $tag yet"
          fi
          ls -l repo

      # the packages that runs of this branch and level saved as they were built
      # (tools/runs-save.sh: draft releases wip-<level>-<branch>-<run>-<attempt>) and that
      # no publish took yet: into repo/ what it lacks (when the cache of the last run is
      # there, nothing), where tools/build.sh keeps the newest package of each origin and
      # builds no port whose package has its azsupport_hash. The drafts taken go once a publish
      # has their packages (the step after Publish), those of a branch with it
      # (delete-branches.yml): the cache alone lost 179 packages built and not published
      # (17.11.2026, run 44188852322: GitHub pushed that of main out past the 10 GB of the
      # caches while a branch saved its own)
      - name: The packages saved by the runs before, not published yet
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CPUTYPE: ${{ matrix.cputype }}
          DRAFTS: ${{ inputs.drafts }}
        run: |
          mkdir -p repo "$AZSUPPORT_RUNS_STATE"
          : > "$AZSUPPORT_RUNS_STATE/wip-taken"
          # the packages of the drafts taken, for the PHP checks in the VM (the versions of
          # those of PHP are checked as those built: the builds of 13Z0 are not checked there)
          : > drafts-packages.txt
          b="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          # the prefixes of the drafts: this branch, and those of the input drafts
          pres="wip-$CPUTYPE-$b-"
          for o in $DRAFTS; do
            pres="$pres wip-$CPUTYPE-$(printf '%s' "$o" | tr -c 'A-Za-z0-9._-' '-')-"
          done
          # pages <path> <jq> <file>: every page of a list of the API into the file (it gives
          # at most 100 a page: page 1 alone took 100 of the 323 packages of a draft and 100
          # of 271 of another, and runs 44188852322 and 44205092140 built the rest again,
          # 17-18.11.2026); the jq of a line has the field to stop on first. Each page is
          # tried 5 times 20 s apart: the list of the releases answered HTTP 504 and a
          # cancelled stream, and run 45182012408 (23.11.2026) took none of the drafts of
          # x86-64-v2 and built again what they had. The releases go 10 a page (the 4th
          # argument), as each comes with all its files: 100 a page took GitHub 10 s, its
          # limit (HTTP 504 five times, run 45623903407, 25.11.2026)
          pages() {
            : > "$3"
            p=1
            while [ "$p" -le 200 ]; do
              t=1
              until gh api "${1}per_page=${4:-100}&page=$p" --jq "$2" > "$AZSUPPORT_RUNS_STATE/page"; do
                [ "$t" -ge 5 ] && return 1
                echo "page $p of ${1%%\?*}: try $t failed, again in 20 s"
                t=$((t + 1)); sleep 20
              done
              [ -s "$AZSUPPORT_RUNS_STATE/page" ] || return 0
              cat "$AZSUPPORT_RUNS_STATE/page" >> "$3"
              p=$((p + 1))
            done
          }
          pages "repos/$GITHUB_REPOSITORY/releases?" '.[] | "\(.draft) \(.id) \(.tag_name)"' "$AZSUPPORT_RUNS_STATE/releases" 10 ||
            { echo "::warning title=saved packages::no list of the releases after 5 tries: no draft taken, what they have is built again"; exit 0; }
          awk -v pres="$pres" 'BEGIN { n = split(pres, P, " ") }
            $1 == "true" { for (i = 1; i <= n; i++) if (index($3, P[i]) == 1) { print $2, $3; next } }' \
            "$AZSUPPORT_RUNS_STATE/releases" > "$AZSUPPORT_RUNS_STATE/wip-drafts"
          [ -s "$AZSUPPORT_RUNS_STATE/wip-drafts" ] || { echo "no draft $(echo "$pres" | sed 's/- */-* /g'): nothing to take"; exit 0; }
          echo "the drafts of $pres: $(wc -l < "$AZSUPPORT_RUNS_STATE/wip-drafts" | tr -d ' ')"
          while read -r id tag; do
            n=0; bad=0
            if ! pages "repos/$GITHUB_REPOSITORY/releases/$id/assets?" '.[] | "\(.state) \(.id) \(.name)"' "$AZSUPPORT_RUNS_STATE/wip-all"; then
              echo "$tag: no list of its files: left for the next run"; continue
            fi
            awk '$1 == "uploaded" { print $2, $3 }' "$AZSUPPORT_RUNS_STATE/wip-all" > "$AZSUPPORT_RUNS_STATE/wip-assets"
            while read -r aid an; do
              [ -e "repo/$an" ] && continue
              if gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "repo/$an.part"; then
                mv -f "repo/$an.part" "repo/$an"; n=$((n + 1))
              else
                rm -f "repo/$an.part"; bad=$((bad + 1))
              fi
            done < "$AZSUPPORT_RUNS_STATE/wip-assets"
            if [ "$bad" = 0 ]; then
              echo "$tag: $n of its $(wc -l < "$AZSUPPORT_RUNS_STATE/wip-assets" | tr -d ' ') packages into repo/ (the others were there)"
              echo "$id $tag" >> "$AZSUPPORT_RUNS_STATE/wip-taken"
              awk '{ print $2 }' "$AZSUPPORT_RUNS_STATE/wip-assets" >> drafts-packages.txt
            else
              echo "::warning title=saved packages::$tag: $n packages into repo/, $bad did not download (the draft stays for the next run)"
            fi
          done < "$AZSUPPORT_RUNS_STATE/wip-drafts"

      # the distribution files of the ports, kept between the runs (the VM fetches what is missing)
      - name: The distribution files of the runs before
        id: dist
        uses: actions/cache/restore@v4
        with:
          path: distfiles
          key: distfiles-${{ hashFiles('**/distinfo') }}
          restore-keys: distfiles-

      # the release tarballs of azsupport/php-src the PHP ports need, fetched here with
      # retries before the VM: GitHub answered the fetch of the VM with 504 more than
      # once (run 42571397680), and the distfiles cache of FreeBSD has none of them.
      # What does not download here, the VM tries again (MASTER_SITES of the port)
      - name: The PHP tarballs of azsupport/php-src, fetched with retries
        run: |
          mkdir -p distfiles/php
          sed -n 's/^SHA256 (php\/\(php-[0-9][^)]*-fbsd-[^)]*\.tar\.xz\)) = \([0-9a-f]*\)$/\1 \2/p' lang/php*/distinfo | sort -u > /tmp/php-tarballs
          while read -r f sum; do
            v="${f#php-}"; v="${v%%-fbsd-*}"; rel="${f#*-fbsd-}"; rel="${rel%.tar.xz}"
            d="distfiles/php/$f"
            if [ -f "$d" ] && [ "$(sha256sum < "$d" | cut -c1-64)" = "$sum" ]; then echo "have $f"; continue; fi
            u="https://github.com/azsupport/php-src/releases/download/freebsd-${v%.*}-$rel/$f"
            if curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o "$d.part" "$u" &&
              [ "$(sha256sum < "$d.part" | cut -c1-64)" = "$sum" ]; then
              mv "$d.part" "$d"; echo "fetched $f"
            else
              rm -f "$d.part"; echo "::warning title=distfiles::$f did not download here ($u): the VM tries again"
            fi
          done < /tmp/php-tarballs

      # the ports of this tree with make -V against the official tree, before the VM:
      # a port that names a missing origin, a wrong PKGORIGIN, two ports of one PKGNAME
      # (tools/check-tree.sh) stop the run here, not after an hour of azsupport/azsupport; bmake and
      # the sparse official tree as tools/check-tree-ci.sh makes them (yt-dlp-update.yml too)
      - name: The ports of this tree checked with make -V (bmake, a sparse official tree)
        env:
          CPUTYPE: ${{ matrix.cputype }}
          RELEASE: ${{ inputs.release }}
        run: sh tools/check-tree-ci.sh "$RELEASE" "$CPUTYPE"

      # the curl of azsupport (azsupport/azsupport/files/curl.conf, curl-deps.conf, curl/) must be that of
      # the PHP of azsupport/php-src (freebsd/ there, on master, or on the branch of
      # fork_ref): the same releases and patches. A difference stops the run here,
      # before the VM
      - name: The curl of azsupport and that of azsupport/php-src
        env:
          FORK_REF: ${{ inputs.fork_ref || 'master' }}
        run: |
          set -o pipefail
          sh tools/curl-sync-check.sh 2>&1 | tee curl-sync-check.txt

      - name: Free space on the runner (the disk of the VM grows on it)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune --all --force > /dev/null 2>&1 || true
          df -h /

      # the caches of the ports that keep one between the runs (AZSUPPORT_PORT_CACHE of their
      # Makefile: the disk cache of Bazel of databases/mongodb80; tools/build.sh): the
      # newest draft release portcache-<level>-<key>-<run> of each key, its parts
      # (tar | zstd, split below 2 GB) into portcache/<key>/, so that a build the time of
      # a run stopped goes on from what it did (aZ, 18.11.2026: MongoDB «с докачкой»)
      - name: The caches of the ports between the runs (portcache/)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CPUTYPE: ${{ matrix.cputype }}
        run: |
          mkdir -p portcache "$AZSUPPORT_RUNS_STATE"
          # every page of the releases (10 a page: each comes with all its files)
          : > "$AZSUPPORT_RUNS_STATE/portcache-rel"
          for p in $(seq 1 200); do
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10&page=$p" --jq '.[] | select(.draft) | "\(.id) \(.tag_name) \(.created_at)"' > "$AZSUPPORT_RUNS_STATE/portcache-page" ||
              { echo "no list of the releases"; exit 0; }
            [ -s "$AZSUPPORT_RUNS_STATE/portcache-page" ] || break
            cat "$AZSUPPORT_RUNS_STATE/portcache-page" >> "$AZSUPPORT_RUNS_STATE/portcache-rel"
          done
          awk -v pre="portcache-$CPUTYPE-" 'index($2, pre) == 1' "$AZSUPPORT_RUNS_STATE/portcache-rel" | sort -k3,3r > "$AZSUPPORT_RUNS_STATE/portcache-drafts"
          [ -s "$AZSUPPORT_RUNS_STATE/portcache-drafts" ] || { echo "no draft portcache-$CPUTYPE-*: no cache to take"; exit 0; }
          : > "$AZSUPPORT_RUNS_STATE/portcache-taken"
          while read -r id tag created; do
            k="${tag#portcache-$CPUTYPE-}"; k="${k%-*}"
            grep -qx "$k" "$AZSUPPORT_RUNS_STATE/portcache-taken" && continue
            echo "$k" >> "$AZSUPPORT_RUNS_STATE/portcache-taken"
            gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --jq '.[] | select(.state == "uploaded") | "\(.id) \(.name)"' |
              sort -k2,2 > "$AZSUPPORT_RUNS_STATE/portcache-assets" || { echo "$tag: no list of its files"; continue; }
            rm -rf "portcache/$k"; mkdir -p "portcache/$k"
            ok=1
            while read -r aid an; do
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$aid" || { ok=0; break; }
            done < "$AZSUPPORT_RUNS_STATE/portcache-assets" | zstd -dc | tar -xf - -C "portcache/$k" || ok=0
            if [ "$ok" = 1 ]; then
              echo "$tag ($created): portcache/$k, $(du -sh "portcache/$k" | cut -f1)"
            else
              echo "::warning title=portcache::$tag did not come whole: portcache/$k starts empty"
              rm -rf "portcache/$k"; mkdir -p "portcache/$k"
            fi
          done < "$AZSUPPORT_RUNS_STATE/portcache-drafts"
          du -sh portcache

      # the key of the repository azsupport (the secret PKG_SIGNING_KEY, PEM) in one line for envs:
      # of the VM, masked; tools/pkg-repo-sign.sh signs with it there (no key: unsigned)
      - name: The signing key of the repository, for the VM
        id: key
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          if [ -n "$PKG_SIGNING_KEY" ]; then
            b64="$(printf '%s\n' "$PKG_SIGNING_KEY" | base64 -w0)"
            echo "::add-mask::$b64"
            echo "b64=$b64" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=signing key::no PKG_SIGNING_KEY: the repository will not be signed (and not published)"
          fi

      # the progress of the build while the VM builds (GitHub gives the log of a job only
      # when it ends): tools/runs-progress.sh in the background, every 10 minutes into
      # the branch runs of azsupport/azsupport (secret RUNS_TOKEN), until the VM gives
      # results/ back; its own log for the step at the end
      - name: The progress of the build, to azsupport/azsupport
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          PART: ${{ matrix.cputype }}
        run: |
          mkdir -p "$AZSUPPORT_RUNS_STATE"
          nohup sh tools/runs-progress.sh "$PART" 10 > "$AZSUPPORT_RUNS_STATE/runs-progress.log" 2>&1 &
          echo "tools/runs-progress.sh: pid $!, every 10 minutes"

      # each package the VM made, saved as soon as its port built (tools/runs-save.sh: the
      # draft release wip-<level>-<branch>-<run>-<attempt>), so that a VM that dies or a job
      # that stops loses none (aZ, 17.11.2026); its own log for the step at the end
      - name: The packages built, saved as they come
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ matrix.cputype }}
        run: |
          mkdir -p "$AZSUPPORT_RUNS_STATE"
          # a process group of its own (setsid): the step after the VM stops it with what it
          # runs (curl, scp, ssh) before its last pass
          setsid nohup sh tools/runs-save.sh "$PART" 5 > "$AZSUPPORT_RUNS_STATE/runs-save.log" 2>&1 < /dev/null &
          echo $! > "$AZSUPPORT_RUNS_STATE/runs-save.pid"
          echo "tools/runs-save.sh: pid $!, every 5 minutes"

      # the build tests (tools/test-programs.sh and the *-test.sh) are kept in the
      # private azsupport/azsupport (tests/ports/), not in this public repo; fetch them
      # into tools/ with RUNS_TOKEN so the VM runs them (the workspace is synced into the
      # VM). They are in .gitignore here. No token: the VM runs no tests. From the same
      # tarball the distribution files no one may fetch or mirror (distfiles/ there:
      # arcconf of Microchip), into distfiles/ for the VM; the list of their names in
      # $AZSUPPORT_RUNS_STATE/private-distfiles, so that the cache of the distfiles never
      # keeps them (the step before its save)
      - name: The build tests and the private distfiles of azsupport/azsupport
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
        run: |
          mkdir -p "$AZSUPPORT_RUNS_STATE"; : > "$AZSUPPORT_RUNS_STATE/private-distfiles"
          if [ -z "$RUNS_TOKEN" ]; then
            echo "::warning title=tests::no RUNS_TOKEN: the VM runs no tests and has no private distfiles"
            exit 0
          fi
          t="$RUNNER_TEMP/azsupport-tests.tgz"
          curl -fsSL -H "Authorization: Bearer $RUNS_TOKEN" -H "Accept: application/vnd.github+json" \
            -o "$t" "https://api.github.com/repos/azsupport/azsupport/tarball/main"
          tar -xzf "$t" -C tools --strip-components=3 --wildcards '*/tests/ports/*'
          echo "tests in tools/: $(ls tools/test-programs.sh tools/*-test.sh 2>/dev/null | wc -l) scripts"
          mkdir -p distfiles "$RUNNER_TEMP/azsupport-dist"
          tar -xzf "$t" -C "$RUNNER_TEMP/azsupport-dist" --strip-components=2 --wildcards '*/distfiles/*' || true
          for f in "$RUNNER_TEMP"/azsupport-dist/*; do
            [ -f "$f" ] || continue
            n="${f##*/}"
            case "$n" in README*) continue ;; esac
            mv "$f" "distfiles/$n"
            echo "$n" >> "$AZSUPPORT_RUNS_STATE/private-distfiles"
            echo "private distfile: $n ($(wc -c < "distfiles/$n") bytes)"
          done
          rm -f "$t"

      # the time the build in the VM has (tools/build.sh: AZSUPPORT_TIME_SOFT, AZSUPPORT_TIME_HARD), from
      # the start of the job, whose limit is 350 minutes: no port starts after 245 minutes,
      # the builds still going stop at 285; less 8 minutes for the boot of the VM. Then
      # the VM writes the repository, gives results/ and repo/ back, and the steps after
      # it keep the packages in the cache for the next run (which the last step starts)
      - name: The time of the build
        run: |
          now="$(date +%s)"; start="${AZSUPPORT_JOB_START:-$now}"
          soft=$((start + 245 * 60 - 480 - now)); hard=$((start + 285 * 60 - 480 - now))
          [ "$soft" -gt 600 ] || soft=600; [ "$hard" -gt "$soft" ] || hard="$soft"
          echo "AZSUPPORT_TIME_SOFT=$soft" >> "$GITHUB_ENV"; echo "AZSUPPORT_TIME_HARD=$hard" >> "$GITHUB_ENV"
          echo "the VM: no port starts after $((soft / 60)) minutes, the builds still going stop at $((hard / 60)) (from the start of tools/build.sh)"

      - name: Build and check in FreeBSD ${{ inputs.release }}
        id: build
        uses: vmactions/freebsd-vm@v1
        env:
          AZSUPPORT_CPUTYPE: ${{ matrix.cputype }}
          AZSUPPORT_PORTS: ${{ inputs.ports }}
          AZSUPPORT_FORCE: ${{ inputs.force && '1' || '' }}
          AZSUPPORT_JOBS: ${{ inputs.jobs || '4' }}
          AZSUPPORT_CONFIGURE_CHECK: ${{ inputs.configure_check && '1' || '' }}
          AZSUPPORT_PLAN: ${{ inputs.plan && '1' || '' }}
          AZSUPPORT_PHP_CHECKS: ${{ inputs.php_checks }}
          AZSUPPORT_PKG_KEY: ${{ steps.key.outputs.b64 }}
        with:
          release: ${{ inputs.release }}
          # the runner has 16 GB and no swap: 12 GB for the VM by default (up to 4 builds at
          # once, each with make -j of the 4 vCPUs), the input vm_mem for less
          mem: ${{ inputs.vm_mem || '12288' }}
          envs: 'AZSUPPORT_CPUTYPE AZSUPPORT_PORTS AZSUPPORT_FORCE AZSUPPORT_JOBS AZSUPPORT_CONFIGURE_CHECK AZSUPPORT_PLAN AZSUPPORT_PHP_CHECKS AZSUPPORT_PKG_KEY AZSUPPORT_TIME_SOFT AZSUPPORT_TIME_HARD'
          # the package mirror: every address of its names tried, the first that answers in
          # /etc/hosts (tools/pkg-mirror.sh; aZ, 18.11.2026 23:23); 10 minutes a try of pkg,
          # 3 tries 60 s apart, then the job fails instead of waiting for hours. A try where
          # no address answers goes on to the next one: the prepare script runs with -e, so
          # the exit 1 of pkg-mirror.sh stopped it at once (runs 44431760719 attempt 2 and
          # 44438540544, 19.11.2026 01:47-01:50 UTC: pkgmir.geo.freebsd.org gave Not Found for
          # the catalogue of FreeBSD:15:amd64/latest, then no answer on 443)
          prepare: |
            if [ -n "${AZSUPPORT_PKG_KEY:-}" ]; then (umask 077 && printf '%s' "$AZSUPPORT_PKG_KEY" > /root/.az-pkg-key.b64); fi; unset AZSUPPORT_PKG_KEY
            i=1
            while :; do
              sh tools/pkg-mirror.sh || echo "pkg-mirror: try $i: no address of the mirror answers, pkg goes by the resolver"
              env ASSUME_ALWAYS_YES=yes timeout 600 pkg install -y git-lite && break
              [ "$i" -ge 3 ] && { echo "pkg: no git-lite after $i tries"; exit 1; }
              echo "pkg: try $i failed, again in 60 s"; i=$((i + 1)); sleep 60
            done
          # the script never stops before its end (vmactions copies results/ and repo/ back
          # only after a script that ended well): what failed goes into results/rc (0: the
          # build and every check passed), and a step after the caches fails the job on it
          run: |
            if [ -n "${AZSUPPORT_PKG_KEY:-}" ]; then (umask 077 && printf '%s' "$AZSUPPORT_PKG_KEY" > /root/.az-pkg-key.b64); fi; unset AZSUPPORT_PKG_KEY
            trap 'rm -f /root/.az-pkg-key.b64' EXIT
            if [ -s /root/.az-pkg-key.b64 ]; then export AZSUPPORT_PKG_KEY_FILE=/root/.az-pkg-key.b64; fi
            rc=0
            sh tools/build.sh ${AZSUPPORT_FORCE:+--force} --repo repo $AZSUPPORT_PORTS || rc=$?
            mkdir -p results
            echo "$rc" > results/rc
            # the PHP of each version a package of which was built or taken from a draft, or
            # that php_checks names: installed from the repository as a server installs it,
            # and checked, when the repository has its catalog and the core of the version
            # is there (not in a plan: AZSUPPORT_PLAN)
            : > results/checks.txt
            # no debug (aZ, 17.11.2026): every package of this run without debug
            # information and stripped (tools/debug-check.sh in tools/build.sh); a FAIL
            # keeps the run from being published
            if [ -s results/debug-check.txt ]; then
              nd="$(grep -c . results/debug-check.txt || :)"
              nf="$(grep -c '^FAIL' results/debug-check.txt || :)"
              if [ "$nf" -gt 0 ]; then
                echo "debug: FAIL ($nf of $nd packages of this run with debug information or not stripped: $(awk '$1 == "FAIL" { sub(/:$/, "", $2); printf "%s ", $2 }' results/debug-check.txt)- results/debug-check.txt)" >> results/checks.txt
                rc=1
              else
                echo "debug: OK ($nd packages of this run: no debug information, stripped)" >> results/checks.txt
              fi
            fi
            # no manual pages, docs or info pages (aZ, 20.11.2026): every package of the
            # repository (tools/docs-check.sh in tools/build.sh); a FAIL keeps the run from
            # being published
            if [ -s results/docs-check.txt ]; then
              nd="$(grep -c . results/docs-check.txt || :)"
              nf="$(grep -c '^FAIL' results/docs-check.txt || :)"
              if [ "$nf" -gt 0 ]; then
                echo "docs: FAIL ($nf of $nd packages with manual pages, docs or info pages: $(awk '$1 == "FAIL" { sub(/:$/, "", $2); printf "%s ", $2 }' results/docs-check.txt | cut -c1-600)- results/docs-check.txt)" >> results/checks.txt
                rc=1
              else
                echo "docs: OK ($nd packages of the repository: no manual pages, docs or info pages)" >> results/checks.txt
              fi
            fi
            # every run dependency of a package of the repository a package of it, pkg aside
            # (aZ, 26.11.2026: tools/repo-deps-check.sh on the catalog the run wrote, the
            # signed one or that of work/repo-unsigned): a warning for now, which keeps no
            # publish; its lines in results/repo-deps.txt, its last one in checks.txt
            if [ -f tools/repo-deps-check.sh ]; then
              rdir=repo
              if [ ! -f repo/meta.conf ] && [ -f work/repo-unsigned/meta.conf ]; then rdir=work/repo-unsigned; fi
              sh tools/repo-deps-check.sh "$rdir" > results/repo-deps.txt 2>&1 || :
              tail -n 1 results/repo-deps.txt >> results/checks.txt
            fi
            if [ -n "${AZSUPPORT_PLAN:-}" ]; then
              echo "plan (AZSUPPORT_PLAN): no checks and no tests (results/plan.txt)" >> results/checks.txt
            elif [ -f results/time-limit ]; then
              echo "time limit: no checks and no tests, the next run goes on ($(head -n 1 results/time-limit); results/time-limit)" >> results/checks.txt
            else
            # the catalog the checks read: the signed one of repo/, else the unsigned one
            # of this run (work/repo-unsigned of build.sh: checks only, never published)
            crepo=repo
            if [ ! -f repo/meta.conf ] && [ -f work/repo-unsigned/meta.conf ]; then
              crepo=work/repo-unsigned
              echo "unsigned catalog: checks only, not published (work/repo-unsigned; $(tail -n 1 results/pkg-repo.log 2>/dev/null || echo 'no pkg-repo.log'))" >> results/checks.txt
            fi
            # the versions: of the packages built (results/summary.txt), of those taken from
            # the drafts of the runs before (drafts-packages.txt of the step of the drafts:
            # the builds of 13Z0 save theirs there, and their PHP went unchecked, 19.11.2026)
            # and of php_checks (AZSUPPORT_PHP_CHECKS; all: every core phpXY of the repository)
            pv="$({ awk '$1 ~ /\// && $2 == "OK" { print $3 }' results/summary.txt 2>/dev/null; cat drafts-packages.txt 2>/dev/null; } | sed -n -E 's/^(mod_)?php([0-9])([0-9])-.*/\2.\3/p')"
            case " ${AZSUPPORT_PHP_CHECKS:-} " in
              *" all "*) pv="$pv $(ls "$crepo" 2>/dev/null | sed -n -E 's/^php([0-9])([0-9])-[0-9][^/]*\.pkg$/\1.\2/p')" ;;
              *) pv="$pv ${AZSUPPORT_PHP_CHECKS:-}" ;;
            esac
            for v in $(printf '%s\n' $pv | grep -E '^[0-9]\.[0-9]$' | sort -u); do
              core="lang/php$(echo "$v" | tr -d .)"
              cl="$(awk -v o="$core" '$1 == o { print; exit }' results/summary.txt 2>/dev/null || true)"
              if [ ! -f "$crepo/meta.conf" ]; then
                echo "PHP $v: SKIP (no catalog in $crepo: $(tail -n 1 results/pkg-repo.log 2>/dev/null || echo 'no pkg-repo.log'))" >> results/checks.txt
                continue
              fi
              case "$cl" in
                *" OK "*|*"in the repository already"*) ;;
                *) echo "PHP $v: SKIP (the core $core is not there: ${cl:-not in the queue})" >> results/checks.txt; continue ;;
              esac
              r=0
              sh tools/install-php.sh --repo "$crepo" "$v" || r=$?
              if [ "$r" = 3 ]; then
                echo "PHP $v: SKIP (the repository has no core php of $v)" >> results/checks.txt
              elif [ "$r" != 0 ]; then
                echo "PHP $v: FAIL (the packages did not install, exit $r: install-php-$v.log)" >> results/checks.txt
                rc=1
              elif [ ! -f tools/check-php.sh ]; then
                echo "PHP $v: SKIP (no tools/check-php.sh)" >> results/checks.txt
              else
                r=0
                sh tools/check-php.sh "$v" || r=$?
                if [ "$r" = 0 ]; then
                  echo "PHP $v: OK (check-php-$v.txt)" >> results/checks.txt
                else
                  echo "PHP $v: FAIL (check-php-$v.txt, exit $r)" >> results/checks.txt
                  rc=1
                fi
                # the variants with OpenSSL (phpXY-<module>-openssl) in the places of
                # their modules, checked the same way, when the repository has them
                if [ -n "$(ls "$crepo"/php"$(echo "$v" | tr -d .)"-*-openssl-[0-9]*.pkg 2>/dev/null)" ]; then
                  r=0
                  sh tools/install-php.sh --repo "$crepo" --openssl "$v" || r=$?
                  if [ "$r" != 0 ]; then
                    echo "PHP $v, the variants with OpenSSL: FAIL (they did not install, exit $r: install-php-$v-openssl.log)" >> results/checks.txt
                    rc=1
                  else
                    r=0
                    CHECK_TAG=openssl sh tools/check-php.sh "$v" || r=$?
                    if [ "$r" = 0 ]; then
                      echo "PHP $v, the variants with OpenSSL: OK (check-php-$v-openssl.txt)" >> results/checks.txt
                    else
                      echo "PHP $v, the variants with OpenSSL: FAIL (check-php-$v-openssl.txt, exit $r)" >> results/checks.txt
                      rc=1
                    fi
                  fi
                fi
                # the packages of a module with the same files (redis with compression,
                # gd of 5.6 with T1lib, openssl-legacy with ssh2 in the same process),
                # each in turn: tools/check-variants.sh
                vs="$(echo "$v" | tr -d .)"
                if [ -n "$(ls "$crepo"/php"$vs"-redis-*-[0-9]*.pkg "$crepo"/php"$vs"-gd-t1lib-[0-9]*.pkg "$crepo"/php"$vs"-openssl-legacy-[0-9]*.pkg 2>/dev/null)" ]; then
                  r=0
                  sh tools/check-variants.sh "$v" || r=$?
                  if [ "$r" = 0 ]; then
                    echo "PHP $v, the packages of redis, gd and openssl with the same files: OK (check-variants-$v.txt)" >> results/checks.txt
                  else
                    echo "PHP $v, the packages of redis, gd and openssl with the same files: FAIL (check-variants-$v.txt, exit $r)" >> results/checks.txt
                    rc=1
                  fi
                fi
              fi
            done
            # the programs and libraries (azsupport, curl, ffmpeg, ImageMagick6 and 7, GraphicsMagick, mc)
            # installed from the repository and tested (the samples with the official
            # packages first); exit 2: no catalog, said in checks.txt
            r=0
            if [ -f tools/test-programs.sh ]; then
              # its output and every result of a test go into results/tests/, which goes
              # only to the private azsupport/azsupport (the step "The results of the tests"):
              # this public log gets "test <name>: OK|FAIL|SKIP" of results/checks.txt alone
              mkdir -p results/tests
              sh tools/test-programs.sh --repo "$crepo" > results/tests/test-programs.out 2>&1 || r=$?
            else
              echo "programs: SKIP (no tools/test-programs.sh: the tests of azsupport/azsupport were not fetched)" >> results/checks.txt
            fi
            if [ "$r" = 1 ]; then rc=1; fi
            fi
            cat results/checks.txt
            echo "$rc" > results/rc
            echo "results/rc: $rc"
            # not back to the runner: the official tree, the work directories, the
            # chroots, the packages (they are in repo/). tools/build.sh tears its chroots
            # down itself (work/ch); what is still mounted under work/ goes first, and rm
            # never crosses a mount point (-x): the distfiles and the base system mounted
            # in a chroot are never removed, and none goes back to the runner
            mount -p | awk -v d="$(pwd -P)/work/" 'index($2, d) == 1 { print length($2), $2 }' | sort -rn | cut -d ' ' -f 2- |
              while read -r m; do umount -f "$m" || echo "cannot unmount $m"; done
            rm -rfx work packages
            exit 0

      # the caches the ports built in this run with (results/portcache.txt): each one as a
      # new draft release portcache-<level>-<key>-<run> (tar | zstd, parts below 2 GB),
      # then the older drafts of its key away; the next run takes the newest (above)
      - name: The caches of the ports, kept for the next run
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CPUTYPE: ${{ matrix.cputype }}
        run: |
          [ -s results/portcache.txt ] || { echo "no port of this run builds with a cache between the runs"; exit 0; }
          while read -r k; do
            [ -d "portcache/$k" ] && [ -n "$(ls -A "portcache/$k")" ] || { echo "$k: its cache is empty"; continue; }
            tag="portcache-$CPUTYPE-$k-$GITHUB_RUN_ID"
            t="$RUNNER_TEMP/pc-$k"; rm -rf "$t"; mkdir -p "$t"
            tar -cf - -C "portcache/$k" . | zstd -T0 -3 -q | split -b 1900m -d -a 3 - "$t/$k.tar.zst."
            id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f name="$tag" -F draft=true \
              -f body="The cache of $k between the runs of build.yml ($CPUTYPE; run $GITHUB_RUN_ID, $GITHUB_REF_NAME): tools/build.sh, AZSUPPORT_PORT_CACHE." --jq .id)" ||
              { echo "::warning title=portcache::$k: no draft release $tag"; continue; }
            up=1
            for f in "$t"/*; do
              curl -sS -f --max-time 1800 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=${f##*/}" > /dev/null || { up=0; break; }
            done
            if [ "$up" = 1 ]; then
              echo "$k: $(du -sh "portcache/$k" | cut -f1) as $(ls "$t" | wc -l) parts ($(du -sh "$t" | cut -f1)) in $tag"
              for p in $(seq 1 200); do
                gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10&page=$p" --jq '.[] | select(.draft) | "\(.id) \(.tag_name)"' > "$t.page" || break
                [ -s "$t.page" ] || break
                cat "$t.page"
              done | awk -v pre="portcache-$CPUTYPE-$k-" -v me="$tag" 'index($2, pre) == 1 && $2 != me { print $1, $2 }' |
                while read -r oid otag; do sh tools/release-drop.sh "$oid" "$otag" > /dev/null && echo "older: $otag deleted"; done
            else
              echo "::warning title=portcache::$k: the upload to $tag failed: the older drafts stay"
              sh tools/release-drop.sh "$id" "$tag" || :
            fi
            rm -rf "$t"
          done < results/portcache.txt

      # vmactions copies repo/ back without deleting: what tools/build.sh removed there (an
      # older package of an origin, an origin the tree has no more, a name with a comma)
      # would stay here, in the cache and in the release. results/repo-files.txt has the
      # files the VM left in repo/
      - name: The repository as the VM left it
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        run: |
          if [ ! -f results/repo-files.txt ]; then
            echo "no results/repo-files.txt (tools/build.sh did not get that far): repo/ stays as it is"
            exit 0
          fi
          for f in repo/*; do
            [ -e "$f" ] || continue
            if ! grep -qxF "${f##*/}" results/repo-files.txt; then
              echo "removed, not in the repository of the VM: ${f##*/}"
              rm -rf "$f"
            fi
          done
          ls repo | wc -l

      # what the VM built in the last minutes of the saver (it looks every 5): the saver
      # stopped with what it runs, then once more over work/queue/made-* from the files the
      # VM gave back, so that the draft of this run has every package it built
      - name: The packages built, the last of them saved
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ matrix.cputype }}
        run: |
          if [ -s "$AZSUPPORT_RUNS_STATE/runs-save.pid" ]; then
            kill -TERM -- "-$(cat "$AZSUPPORT_RUNS_STATE/runs-save.pid")" 2> /dev/null || :
            sleep 3
          fi
          sh tools/runs-save.sh "$PART" final >> "$AZSUPPORT_RUNS_STATE/runs-save.log" 2>&1 || :
          tail -n 3 "$AZSUPPORT_RUNS_STATE/runs-save.log"

      # the repository of this run for the next one, also when the run failed (only repo/:
      # the caches of a repository have 10 GB)
      - name: The repository of this run, kept for the next one
        id: save
        if: ${{ always() && steps.build.outcome != 'skipped' && hashFiles('repo/*.pkg') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: repo
          key: repo-${{ matrix.cputype }}-${{ github.run_id }}-${{ github.run_attempt }}

      # the caches of the repository of the runs before of this level and branch, away once
      # this one is saved: each run saves one under a key of its own, and past the 10 GB of
      # the caches of the repository GitHub pushes out the least used (17.11.2026: that of
      # main, while a branch saved its own); the newest has every package they had
      - name: The repository of the runs before, out of the caches
        if: ${{ always() && steps.save.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: repo-${{ matrix.cputype }}-${{ github.run_id }}-${{ github.run_attempt }}
          PREFIX: repo-${{ matrix.cputype }}-
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$PREFIX&ref=$GITHUB_REF&per_page=100" \
            --jq '.actions_caches[] | "\(.id) \(.key) \(.size_in_bytes)"' > "$AZSUPPORT_RUNS_STATE/caches-repo" ||
            { echo "no list of the caches"; exit 0; }
          while read -r id key size; do
            [ "$key" = "$KEY" ] && continue
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" > /dev/null; then
              echo "deleted: $key ($((size / 1048576)) MB)"
            else
              echo "not deleted: $key"
            fi
          done < "$AZSUPPORT_RUNS_STATE/caches-repo"
          echo "kept: $KEY"

      # by a run of main alone: a branch reads those of main and fetches what it adds, while
      # a copy of its own (3.5 GB, its distinfo differs) pushed the repository of packages of
      # main out of the 10 GB of the caches of the repository (13.11.2026: the run of a
      # branch then found no packages of main and built its ports from nothing)
      # the private distfiles (the step of the tests) never go into a cache of this public
      # repository: away before its save
      - name: The private distfiles, out of distfiles/ before its cache
        if: ${{ always() }}
        run: |
          [ -s "$AZSUPPORT_RUNS_STATE/private-distfiles" ] || exit 0
          while read -r n; do rm -f "distfiles/$n"; echo "removed: $n"; done < "$AZSUPPORT_RUNS_STATE/private-distfiles"

      - name: The distribution files, kept for the next run
        id: distsave
        if: ${{ always() && github.ref_name == github.event.repository.default_branch && steps.build.outcome != 'skipped' && steps.dist.outputs.cache-hit != 'true' && hashFiles('distfiles/**') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: distfiles
          key: ${{ steps.dist.outputs.cache-primary-key }}

      # the distribution files of the runs before, away once these are saved (a cache of
      # about 5 GB for each distinfo of the tree; the newest has what the next run needs)
      - name: The distribution files of the runs before, out of the caches
        if: ${{ always() && steps.distsave.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.dist.outputs.cache-primary-key }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=distfiles-&ref=$GITHUB_REF&per_page=100" \
            --jq '.actions_caches[] | "\(.id) \(.key) \(.size_in_bytes)"' > "$AZSUPPORT_RUNS_STATE/caches-dist" ||
            { echo "no list of the caches"; exit 0; }
          while read -r id key size; do
            [ "$key" = "$KEY" ] && continue
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" > /dev/null; then
              echo "deleted: $key ($((size / 1048576)) MB)"
            else
              echo "not deleted: $key"
            fi
          done < "$AZSUPPORT_RUNS_STATE/caches-dist"
          echo "kept: $KEY"

      # the outcome of the build and of the checks of the VM (results/rc), after the caches
      # are saved: the job fails here, and nothing is published
      - name: The outcome of the build and of the checks
        id: outcome
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        run: |
          rc="$(cat results/rc 2>/dev/null || echo 'none: the VM gave no results/rc')"
          echo "results/rc: $rc"
          if [ "$rc" != 0 ]; then
            echo "::error title=build::the build or a check failed (results/rc: $rc): the summary of the run, the results"
            exit 1
          fi

      # results/tests/ (the outputs of the tests, their whole lines of the checks): into the
      # branch runs of the private azsupport/azsupport as one archive
      # (ports-build/<date>/<run>-<level>-tests.tar.xz), then away from results/, so that
      # neither the job summary nor the public artifact results-<level> has a line of them
      - name: The results of the tests, to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          PART: ${{ matrix.cputype }}
        run: |
          [ -d results/tests ] || { echo "no results/tests: no test ran"; exit 0; }
          a="${GITHUB_RUN_ID}-${PART}-tests.tar.xz"
          tar -cJf "$RUNNER_TEMP/$a" -C results tests
          mv results/tests "$RUNNER_TEMP/tests"
          if [ -z "$RUNS_TOKEN" ]; then
            echo "::warning title=test results::no RUNS_TOKEN: the results of the tests are not kept"
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          w="$RUNNER_TEMP/runs-tests"
          # without blobs and with only its directory checked out (the branch runs: 2.9 GB,
          # 321 000 files on 17.11.2026), as tools/runs-report.sh
          timeout 600 git clone -q --depth 1 --filter=blob:none --no-checkout --branch runs --single-branch \
            "https://x-access-token:${RUNS_TOKEN}@github.com/azsupport/azsupport.git" "$w"
          git -C "$w" sparse-checkout set --no-cone "/ports-build/$day/"
          timeout 600 git -C "$w" checkout -q runs
          mkdir -p "$w/ports-build/$day"
          cp "$RUNNER_TEMP/$a" "$w/ports-build/$day/$a"
          git -C "$w" add "ports-build/$day/$a"
          git -C "$w" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "ports-build $PART: the results of the tests of run $GITHUB_RUN_ID"
          i=0
          until timeout 300 git -C "$w" push -q origin HEAD:runs; do
            i=$((i + 1)); [ $i -lt 10 ] || { echo "::warning title=test results::push to azsupport/azsupport failed"; exit 0; }
            sleep $((i * 3))
            # the rebase rewrites the commit: it needs the identity the commit was made with
            timeout 600 git -C "$w" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              pull -q --rebase origin runs || :
          done
          echo "the results of the tests: azsupport/azsupport, branch runs, ports-build/$day/$a"

      - name: Report
        id: report
        if: always()
        run: |
          # the summary goes to report.md first (tools/runs-report.sh commits it), then to the job summary
          summary="$GITHUB_STEP_SUMMARY"
          export GITHUB_STEP_SUMMARY="$PWD/report.md"
          : > report.md
          rc=0
          sh tools/report.sh results || rc=1
          cat report.md >> "$summary"
          exit $rc

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.cputype }}
          # never the results of the tests (they went to azsupport/azsupport above)
          path: |
            results/
            !results/tests/
          if-no-files-found: ignore

      - name: Publish
        id: publish
        # the servers read what main builds: a run of another branch never publishes, nor a plan
        if: ${{ success() && inputs.publish && !inputs.plan && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          # the snapshots of a level kept (tools/release-snapshot.sh; aZ, 18.11.2026: «может
          # 31 последних версий будем хранить?»); 0: every one
          AZSUPPORT_SNAPSHOTS: 31
        run: |
          major="${RELEASE%%.*}"
          level="${CPUTYPE#x86-64-}"
          tag="azsupport-fbsd$major-amd64-$level"
          dir=repo
          # the servers read the catalog with signature_type pubkey: an unsigned one is not published
          last="$(tail -n 1 results/pkg-repo.log 2>/dev/null)"
          case "$last" in
            "pkg repo: signed"*) ;;
            *) echo "::error title=publish::the catalog is not signed ($last): not published"; exit 1 ;;
          esac
          # publish_only (yt-dlp-update.yml): the release takes the repository only when
          # it differs from it by packages of these ports alone; else nothing is published,
          # the report says so, and what the run built goes out with the next publish of
          # aZ (the cache of the run keeps it): tools/publish-gate.sh
          if [ -n "$PUBLISH_ONLY" ]; then
            r=0
            sh tools/publish-gate.sh "$dir" "$tag" $PUBLISH_ONLY > gate.md || r=$?
            cat gate.md
            { echo; cat gate.md; } >> report.md
            cat gate.md >> "$GITHUB_STEP_SUMMARY"
            case "$r" in
              0) ;;
              3) echo "nothing new to publish in $tag"; exit 0 ;;
              1) echo "::warning title=publish::not published: the repository differs from the release $tag by more than $PUBLISH_ONLY (the summary)"; exit 0 ;;
              *) echo "::error title=publish::tools/publish-gate.sh failed (exit $r): not published"; exit 1 ;;
            esac
          fi
          # the release as it is, kept first as a snapshot when none has its catalog (the
          # repository published before the snapshots began, or by a publish whose snapshot
          # failed): no publish that would lose it
          if ! sh tools/release-snapshot.sh before "$tag"; then
            echo "::error title=publish::the release $tag as it is was not kept as a snapshot (tools/release-snapshot.sh): not published"
            exit 1
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          commit="$(sed -n 's/^ports_commit="\([0-9a-f]*\)".*/\1/p' tools/build.sh)"
          # the versions of PHP of the repository: its cores phpXY-<version>.pkg
          php="$(ls "$dir" | sed -n 's/^php\([0-9]\)\([0-9]\)-[0-9][^/]*\.pkg$/\1.\2/p' | sort -u | tr '\n' ' ' | sed 's/ $//; s/ /, /g')"
          notes="A repository of pkg for FreeBSD $major (amd64, CPUTYPE $CPUTYPE) of the packages of $GITHUB_REPOSITORY: the ports of this overlay built over freebsd-ports $commit with the make.conf of tools/make.conf.in: azsupport (the libraries of /usr/local/azsupport), curl (with SCP and SFTP), ffmpeg, ImageMagick6, ImageMagick7, GraphicsMagick, mc, yt-dlp and PHP $php (phpXY with phpXY-apache and the modules phpXY-<module>, phpXY-ssh2 among them). On a server, /usr/local/etc/pkg/repos/azsupport.conf: azsupport: { url: \"$url\", signature_type: \"pubkey\", pubkey: \"/usr/local/etc/pkg/keys/azsupport.pub\", priority: 100, enabled: yes } with the key keys/azsupport.pub of $GITHUB_REPOSITORY, then: pkg update -r azsupport, pkg install -r azsupport php84 php84-apache php84-gd ... (yt-dlp: pkg install yt-dlp, its Python packages are those of FreeBSD; README.md). Each publish is kept also as a release of its own that does not change, $tag-<YYYYMMDD>-<HHMM> (UTC, the newest $AZSUPPORT_SNAPSHOTS): its url in azsupport.conf takes a server back to it (README.md, A server and the repository azsupport)."
          # a new release: its tag at the head of main. The token of a run may not make a
          # ref whose files of .github/workflows differ from those of main: HTTP 403
          # "Resource not accessible by integration" for the tag azsupport-fbsd15-amd64-v2 at
          # the commit of the run (e6ab6bb, run 42687480870) and at a66ae75 (run
          # 42710559503), each made while main was at a commit with another build.yml;
          # the tag of x86-64-v3 was made at the head of main (e10d5f6). The tag only
          # names the release, the files are those of this run
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "$notes" --target main ||
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          # GitHub keeps at most 1000 files in a release (HTTP 422 "file_count limited to
          # 1000 assets per release": run 43930987665, 16.11.2026, after a build of every
          # port gave every package a new name): when the files of the release and those of
          # this repository it lacks would pass 1000, away first with what this repository
          # has no more (until the new catalog is up, the catalog of the release still names
          # them: a pkg upgrade of a server in those minutes fails and is done again)
          # a file of the release away: GitHub answers DELETE now and then with HTTP 502 (run
          # 44530940378, 19.11.2026: the publish stopped halfway through the old files, the
          # release left without some packages its catalog names), and the file may be gone
          # all the same: again up to five times, done once the release has it no more
          drop_asset() {
            for t in 1 2 3 4 5; do
              gh release delete-asset "$tag" "$1" --repo "$GITHUB_REPOSITORY" -y && return 0
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qxF "$1" || return 0
              sleep $((t * 10))
            done
            echo "::warning title=publish::$1 not deleted from $tag"
            return 1
          }
          have="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          nhave="$(printf '%s\n' "$have" | grep -c . || :)"
          nnew="$(ls "$dir" | while read -r f; do printf '%s\n' "$have" | grep -qxF "$f" || echo "$f"; done | grep -c . || :)"
          if [ $((nhave + nnew)) -gt 1000 ]; then
            echo "the release has $nhave files and lacks $nnew of this repository: over 1000, its old files away first"
            for a in $have; do
              [ -e "$dir/$a" ] || drop_asset "$a" || :
            done
          fi
          # the packages first, the catalog of pkg repo last (the files that are not
          # <name>-<version>.pkg), then away with what the repository has no more.
          # A package the release has already with the same sha256 (the digest of its
          # file) is not uploaded again: each publish uploaded every package with
          # --clobber, a DELETE and an upload each, and two publishes within an hour
          # went over the 1000 requests an hour of GITHUB_TOKEN (run 44624023922,
          # 19.11.2026: 617 packages uploaded again for 11 new ones, then HTTP 403 "API
          # rate limit exceeded for installation" once the catalog was up)
          rid="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$rid/assets?per_page=100" \
            --jq '.[] | "\(.name) \(.digest)"' > "$AZSUPPORT_RUNS_STATE/release-digests.txt"
          pk="$(ls "$dir" | grep -E '^[^/]+-[0-9][^/]*\.pkg$' | while read -r f; do
            grep -qxF "$f sha256:$(sha256sum "$dir/$f" | cut -d ' ' -f 1)" "$AZSUPPORT_RUNS_STATE/release-digests.txt" || echo "$dir/$f"
          done)"
          echo "packages to upload: $(printf '%s\n' "$pk" | grep -c . || :) of $(ls "$dir" | grep -cE '^[^/]+-[0-9][^/]*\.pkg$' || :) (the others are in the release with the same sha256)"
          # in batches of 20 with a pause between them, each batch again up to six times:
          # GitHub answers a run of uploads with HTTP 403 "You have exceeded a secondary
          # rate limit" (run 44949024609, 21.11.2026: 526 packages at once, the publish
          # stopped once the old files were away, the release left with the old catalog
          # and without some packages it names)
          up_batch() {
            for t in 1 2 3 4 5 6; do
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$@" && return 0
              echo "the upload of $# files failed (try $t of 6), again in $((t * 60)) s"
              sleep $((t * 60))
            done
            return 1
          }
          if [ -n "$pk" ]; then
            printf '%s\n' "$pk" > "$AZSUPPORT_RUNS_STATE/upload.txt"
            split -l 20 "$AZSUPPORT_RUNS_STATE/upload.txt" "$AZSUPPORT_RUNS_STATE/upload-part."
            for part in "$AZSUPPORT_RUNS_STATE"/upload-part.*; do
              # shellcheck disable=SC2046
              up_batch $(cat "$part") || { echo "::error title=publish::the packages of $part not uploaded"; exit 1; }
              sleep 15
            done
          fi
          # shellcheck disable=SC2046
          up_batch $(ls -d "$dir"/* | grep -v -E '/[^/]+-[0-9][^/]*\.pkg$') ||
            { echo "::error title=publish::the catalog not uploaded"; exit 1; }
          for a in $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            [ -e "$dir/$a" ] || drop_asset "$a" || :
          done
          # every file of the repository is in the release under its own name
          have="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for f in $(ls "$dir"); do
            printf '%s\n' "$have" | grep -qxF "$f" || { echo "not in the release $tag: $f"; exit 1; }
          done
          echo "published: $url ($(ls "$dir" | wc -l) files)"
          echo "$tag" > "$AZSUPPORT_RUNS_STATE/published"
          # the repository just published as a snapshot of its own, the newest AZSUPPORT_SNAPSHOTS of
          # the level kept; a failure here does not undo the publish: the next one keeps
          # this repository first (before, above)
          sh tools/release-snapshot.sh after "$dir" "$tag" "$AZSUPPORT_SNAPSHOTS" ||
            echo "::warning title=snapshot::the repository just published is not kept as a snapshot (tools/release-snapshot.sh): the next publish keeps it first"

      # the drafts of the packages saved (tools/runs-save.sh) once a publish has their
      # packages: those taken into repo/ at the start, and that of this run. Not once the
      # cache of a run has them: GitHub pushes caches out past the 10 GB of the repository,
      # and what was there alone was built again (17.11.2026, run 44188852322: 179 packages)
      - name: The drafts of the packages saved, once the release has them
        if: ${{ always() && steps.publish.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$AZSUPPORT_RUNS_STATE/published" ]; then
            echo "nothing published: the drafts stay for the next publish"
            exit 0
          fi
          if [ -s "$AZSUPPORT_RUNS_STATE/wip-taken" ]; then
            while read -r id tag; do
              # tools/release-drop.sh: a draft of hundreds of files answered DELETE with HTTP 502
              # (18.11.2026), so its files go one by one first
              if sh tools/release-drop.sh "$id" "$tag"; then
                echo "deleted: $tag (its packages are in the release now)"
              else
                echo "::warning title=drafts::$tag not deleted: the next publish tries again"
              fi
            done < "$AZSUPPORT_RUNS_STATE/wip-taken"
          fi
          if [ -s "$AZSUPPORT_RUNS_STATE/runs-save.id" ]; then
            if sh tools/release-drop.sh "$(cat "$AZSUPPORT_RUNS_STATE/runs-save.id")" "$(cat "$AZSUPPORT_RUNS_STATE/runs-save.tag")"; then
              echo "deleted: $(cat "$AZSUPPORT_RUNS_STATE/runs-save.tag") (its packages are in the release now)"
            else
              echo "::warning title=drafts::$(cat "$AZSUPPORT_RUNS_STATE/runs-save.tag") not deleted: the next publish tries again"
            fi
          else
            echo "no draft of this run (tools/runs-save.sh saved no package)"
          fi

      - name: The log of the progress reporter
        if: always()
        continue-on-error: true
        run: tail -n 20 "$AZSUPPORT_RUNS_STATE/runs-progress.log" 2>/dev/null || echo "no log of tools/runs-progress.sh"

      - name: The log of the saver of the packages
        if: always()
        continue-on-error: true
        run: tail -n 40 "$AZSUPPORT_RUNS_STATE/runs-save.log" 2>/dev/null || echo "no log of tools/runs-save.sh"

      # the report into the branch runs of the private azsupport/azsupport (secret RUNS_TOKEN)
      - name: Report to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: release=${{ inputs.release }} cputype=${{ matrix.cputype }} ports=${{ inputs.ports }} force=${{ inputs.force }} jobs=${{ inputs.jobs }} configure_check=${{ inputs.configure_check }} plan=${{ inputs.plan }} fork_ref=${{ inputs.fork_ref }} publish=${{ inputs.publish }} publish_only=${{ inputs.publish_only }} drafts=${{ inputs.drafts }} vm_mem=${{ inputs.vm_mem }}
          RUNS_STEPS: build=${{ steps.build.outcome }} outcome=${{ steps.outcome.outcome }} report=${{ steps.report.outcome }} publish=${{ steps.publish.outcome }}
          PART: ${{ matrix.cputype }}
        run: sh tools/runs-report.sh report.md "$PART"

      # a run whose time was over (results/time-limit) and that built something goes on in
      # a new run of this workflow with the same inputs (not force: what it built is in the
      # cache of the repository); GITHUB_TOKEN may start a workflow_dispatch, and the new
      # job waits for this one (the concurrency of the level). With "both", a v3 that goes
      # on stops this run here, so that x86-64-v2 does not start before v3 is done (aZ,
      # 11.11.2026). At most 6 runs in a row
      - name: The next run, when the time of this one was over
        if: ${{ always() && !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IN_RELEASE: ${{ inputs.release }}
          IN_CPUTYPE: ${{ inputs.cputype }}
          IN_PORTS: ${{ inputs.ports }}
          IN_JOBS: ${{ inputs.jobs }}
          IN_CCHECK: ${{ inputs.configure_check }}
          IN_FORK_REF: ${{ inputs.fork_ref }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_PUBLISH_ONLY: ${{ inputs.publish_only }}
          IN_CONT: ${{ inputs.continuation }}
          IN_DRAFTS: ${{ inputs.drafts }}
          LEVEL: ${{ matrix.cputype }}
        run: |
          [ -f results/time-limit ] || { echo "the time of this run was enough: no next run"; exit 0; }
          first="$(head -n 1 results/time-limit)"
          echo "results/time-limit: $first"
          built="$(printf '%s' "$first" | sed -n 's/.*built=\([0-9]*\).*/\1/p')"
          cached="$(printf '%s' "$first" | sed -n 's/.*cached=\([0-9]*\).*/\1/p')"
          n="${IN_CONT:-0}"; case "$n" in ''|*[!0-9]*) n=0 ;; esac
          # a port with a cache between the runs (AZSUPPORT_PORT_CACHE) that the time stopped goes
          # on from it in the next run: progress too
          if [ "${built:-0}" -eq 0 ] && [ "${cached:-0}" -eq 0 ]; then
            echo "::error title=time limit::this run built nothing in its time: no next run (a port that takes longer than a run?)"
            exit 1
          fi
          if [ "$n" -ge 5 ]; then
            echo "::error title=time limit::6 runs in a row and the build is not done: no next run"
            exit 1
          fi
          cp="$IN_CPUTYPE"
          [ "$IN_CPUTYPE" = both ] && [ "$LEVEL" = x86-64-v2 ] && cp=x86-64-v2
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f release="$IN_RELEASE" -f cputype="$cp" -f ports="$IN_PORTS" -f force=false \
            -f jobs="$IN_JOBS" -f configure_check="$IN_CCHECK" -f plan=false -f fork_ref="$IN_FORK_REF" \
            -f publish="$IN_PUBLISH" -f publish_only="$IN_PUBLISH_ONLY" -f drafts="$IN_DRAFTS" -f continuation="$((n + 1))"
          echo "the next run: build.yml, cputype $cp, continuation $((n + 1))" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$IN_CPUTYPE" = both ] && [ "$LEVEL" = x86-64-v3 ]; then
            echo "x86-64-v3 goes on in the next run: this run stops, so that x86-64-v2 does not start before it"
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi
