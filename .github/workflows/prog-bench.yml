# prog-bench: the speed of programs of this tree built by the base clang (clang19), by
# clang 23 (clang23, of the package llvm23; the compiler of our ports since 26.11.2026) and by
# GCC 16 of the packages (gcc16), from the same sources with the flags of our builds
# (tools/prog-bench.sh: the groups, the versions, the benchmarks), a job per group in a
# FreeBSD VM. The report of each job goes into the branch runs of azsupport/azsupport
# (tools/runs-report.sh: ports-prog-bench/<date>/<run>-<group>.md) and into the
# summary of the run. Started by hand (aZ, 17.11.2026: which programs besides PHP are
# faster with GCC): Actions, "prog-bench", "Run workflow", or gh api.
name: prog-bench

on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'Groups (compress redis postgresql python magick vips), separated by spaces'
        required: true
        default: 'compress redis postgresql python magick vips'
      rounds:
        description: 'Rounds of each benchmark (their median)'
        required: true
        default: '5'
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'

permissions:
  contents: read

jobs:
  groups:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.json }}
    steps:
      - id: list
        env:
          PB_GROUPS: ${{ inputs.groups }}
        run: |
          # shellcheck disable=SC2086
          printf 'json=%s\n' "$(printf '%s\n' $PB_GROUPS | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  bench:
    needs: groups
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.list) }}
    steps:
      - uses: actions/checkout@v5

      # the disk of the VM grows on that of the runner
      - name: Free space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: The benchmarks in FreeBSD ${{ inputs.release }}
        id: bench
        uses: vmactions/freebsd-vm@v1
        env:
          PB_GROUP: ${{ matrix.group }}
          PB_ROUNDS: ${{ inputs.rounds }}
        with:
          release: ${{ inputs.release }}
          mem: 12288
          envs: 'PB_GROUP PB_ROUNDS'
          # GCC 16 is in the repository latest of the packages; the tools of the builds
          # (Python 3 of the packages runs pyperformance, against our builds of Python)
          # latest for the repository FreeBSD-ports of the base (/etc/pkg/FreeBSD.conf of 15.1): a
          # repository "FreeBSD" of its own next to it made pkg upgrade itself again and again
          # ("New version of pkg detected", run 45856622649: each group killed after 75 minutes)
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: { url: "https://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            env ASSUME_ALWAYS_YES=yes pkg update -f
            env ASSUME_ALWAYS_YES=yes pkg install -y gcc16 llvm23 gmake cmake-core ninja meson pkgconf curl python3 libffi glib expat perl5 bison
          # the script ends well (vmactions copies results/ back only then); what failed
          # is in its report
          run: |
            sh tools/prog-bench.sh "$PB_GROUP" "$PB_ROUNDS" || echo "prog-bench: exit $?"

      - name: Report
        if: always()
        env:
          PB_GROUP: ${{ matrix.group }}
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: groups=${{ inputs.groups }} rounds=${{ inputs.rounds }} release=${{ inputs.release }}
          RUNS_STEPS: bench=${{ steps.bench.outcome }}
        run: |
          f="results/prog-bench/$PB_GROUP.md"
          mkdir -p results/prog-bench
          [ -s "$f" ] || echo "no report of the group $PB_GROUP (the step of the VM: ${{ steps.bench.outcome }})" > "$f"
          if [ -s "results/prog-bench/$PB_GROUP.log" ]; then
            { echo; echo "## The log of the job"; echo; echo '```'; tail -n 200 "results/prog-bench/$PB_GROUP.log"; echo '```'; } >> "$f"
          fi
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
          sh tools/runs-report.sh "$f" "$PB_GROUP"
