# SPDX-License-Identifier: BSD-2-Clause
# prog-bench: the speed of programs of this tree built by the base clang (clang19), by
# clang 23 (clang23, of the package llvm23; the compiler of our ports since 26.11.2026) and by
# our GCC 16 (gcc16, the package of lang/gcc16 in the repository azsupport), from the same
# sources with the flags of our builds (tools/prog-bench.sh: the groups, the versions, the
# benchmarks), a job per group in a FreeBSD VM. The report of each job goes into the branch
# runs of azsupport/azsupport (tools/runs-report.sh: ports-prog-bench/<date>/<run>-<group>.md)
# and into the summary of the run. Started by hand (aZ, 17.11.2026: which programs besides PHP
# are faster with GCC; 26.11.2026 20:49: every program of the tree, our gcc16 16.2.0, clang 19
# and clang 23): Actions, "prog-bench", "Run workflow", or gh api.
#
# groups: a group per VM; a+b+c: those groups one after another in one VM (each with its
# own report). split: groups whose builds take a VM each (jobs build: a group and a
# variant, tools/prog-bench.sh <group> build <variant>, the builds as an artifact), then
# measured in one VM (jobs measure), as one VM must measure all three.
name: prog-bench

on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'Groups (compress redis postgresql python magick vips, and tools/prog-bench/*.sh), separated by spaces; a+b: one VM (none: no group)'
        required: false
        default: 'none'
      split:
        description: 'Groups built in a VM per variant and measured in one (node24 node18 mariadb …)'
        required: false
        default: ''
      from_run:
        description: 'The split groups measured with the builds of these earlier runs (their artifacts pb-<group>-<variant>; a later run over an earlier one), not built again'
        required: false
        default: ''
      variants:
        description: 'The variants of the split groups built in this run (clang19 clang23 gcc16; default: all three, none with from_run); with from_run, over its builds'
        required: false
        default: ''
      measure:
        description: 'The split groups measured in this run (no: their builds alone, for a later run with from_run)'
        required: false
        default: 'yes'
      rounds:
        description: 'Rounds of each benchmark (their median)'
        required: true
        default: '5'
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'

permissions:
  contents: read
  # the artifacts of the builds of an earlier run (from_run)
  actions: read

jobs:
  groups:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.json }}
      builds: ${{ steps.list.outputs.builds }}
      split: ${{ steps.list.outputs.split }}
    steps:
      - id: list
        env:
          PB_GROUPS: ${{ inputs.groups }}
          PB_SPLIT: ${{ inputs.split }}
          PB_FROM: ${{ inputs.from_run }}
          PB_VARIANTS: ${{ inputs.variants }}
        run: |
          if [ -n "$PB_VARIANTS" ]; then vs="$PB_VARIANTS"; elif [ -n "$PB_FROM" ]; then vs=""; else vs="clang19 clang23 gcc16"; fi
          for v in $vs; do
            case " clang19 clang23 gcc16 " in *" $v "*) ;; *) echo "unknown variant $v (clang19 clang23 gcc16)"; exit 1 ;; esac
          done
          # shellcheck disable=SC2086
          {
            printf 'json=%s\n' "$(printf '%s\n' $PB_GROUPS | jq -R . | jq -sc 'map(select(length > 0 and . != "none"))')"
            printf 'split=%s\n' "$(printf '%s\n' $PB_SPLIT | jq -R . | jq -sc 'map(select(length > 0))')"
            printf 'builds=%s\n' "$(for g in $PB_SPLIT; do for v in $vs; do printf '{"group":"%s","variant":"%s"}\n' "$g" "$v"; done; done | jq -sc .)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  bench:
    needs: groups
    if: needs.groups.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.list) }}
    steps:
      - uses: actions/checkout@v5

      # the disk of the VM grows on that of the runner
      - name: Free space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: The benchmarks in FreeBSD ${{ inputs.release }}
        id: bench
        uses: vmactions/freebsd-vm@v1
        env:
          PB_GROUP: ${{ matrix.group }}
          PB_ROUNDS: ${{ inputs.rounds }}
        with:
          release: ${{ inputs.release }}
          mem: 12288
          envs: 'PB_GROUP PB_ROUNDS'
          # The tools of the builds (Python 3 of the packages runs pyperformance, against our
          # builds of Python) and clang 23 from the repository latest of the packages (latest
          # for the repository FreeBSD-ports of the base, /etc/pkg/FreeBSD.conf of 15.1: a
          # repository "FreeBSD" of its own next to it made pkg upgrade itself again and again,
          # run 45856622649); our gcc16 from the repository azsupport (README.md: a server and
          # the repository azsupport), off for everything else (-r azsupport for gcc16 alone:
          # the tools and the libraries of the benchmarks are those of FreeBSD), its binutils
          # from FreeBSD-ports before it
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos /usr/local/etc/pkg/keys
            echo 'FreeBSD-ports: { url: "https://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            env ASSUME_ALWAYS_YES=yes pkg update -f
            env ASSUME_ALWAYS_YES=yes pkg install -y llvm23 binutils gmake cmake-core ninja meson pkgconf curl python3 libffi glib expat perl5 bison
            fetch -o /usr/local/etc/pkg/keys/azsupport.pub https://raw.githubusercontent.com/azsupport/ports/main/keys/azsupport.pub
            [ "$(sha256 -q /usr/local/etc/pkg/keys/azsupport.pub)" = 2620217e69f7bf680f4e78d51fd2135bb55dbd8709fa0b78cd217975a801c4e6 ]
            echo 'azsupport: { url: "https://github.com/azsupport/ports/releases/download/azsupport-fbsd15-amd64-v3", signature_type: "pubkey", pubkey: "/usr/local/etc/pkg/keys/azsupport.pub", enabled: no }' > /usr/local/etc/pkg/repos/azsupport.conf
            env ASSUME_ALWAYS_YES=yes pkg update -r azsupport
            env ASSUME_ALWAYS_YES=yes pkg install -y -r azsupport gcc16
            gcc16 --version | head -n 1 | grep ' 16\.2\.0'
          # the script ends well (vmactions copies results/ back only then); what failed
          # is in its report
          run: |
            for g in $(echo "$PB_GROUP" | tr '+' ' '); do sh tools/prog-bench.sh "$g" "$PB_ROUNDS" || echo "prog-bench $g: exit $?"; done

      - name: Report
        if: always()
        env:
          PB_GROUP: ${{ matrix.group }}
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: groups=${{ inputs.groups }} split=${{ inputs.split }} from_run=${{ inputs.from_run }} variants=${{ inputs.variants }} rounds=${{ inputs.rounds }} release=${{ inputs.release }}
          RUNS_STEPS: bench=${{ steps.bench.outcome }}
        run: |
          for g in $(echo "$PB_GROUP" | tr '+' ' '); do
            f="results/prog-bench/$g.md"
            mkdir -p results/prog-bench
            [ -s "$f" ] || echo "no report of the group $g (the step of the VM: ${{ steps.bench.outcome }})" > "$f"
            if [ -s "results/prog-bench/$g.log" ]; then
              { echo; echo "## The log of the job"; echo; echo '```'; tail -n 200 "results/prog-bench/$g.log"; echo '```'; } >> "$f"
            fi
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            sh tools/runs-report.sh "$f" "$g"
          done

  build:
    needs: groups
    if: needs.groups.outputs.builds != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.groups.outputs.builds) }}
    steps:
      - uses: actions/checkout@v5

      - name: Free space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: The builds of ${{ matrix.group }} by ${{ matrix.variant }} in FreeBSD ${{ inputs.release }}
        id: build
        uses: vmactions/freebsd-vm@v1
        env:
          PB_GROUP: ${{ matrix.group }}
          PB_VARIANT: ${{ matrix.variant }}
        with:
          release: ${{ inputs.release }}
          mem: 12288
          envs: 'PB_GROUP PB_VARIANT'
          # as the job bench
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos /usr/local/etc/pkg/keys
            echo 'FreeBSD-ports: { url: "https://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            env ASSUME_ALWAYS_YES=yes pkg update -f
            env ASSUME_ALWAYS_YES=yes pkg install -y llvm23 binutils gmake cmake-core ninja meson pkgconf curl python3 libffi glib expat perl5 bison
            fetch -o /usr/local/etc/pkg/keys/azsupport.pub https://raw.githubusercontent.com/azsupport/ports/main/keys/azsupport.pub
            [ "$(sha256 -q /usr/local/etc/pkg/keys/azsupport.pub)" = 2620217e69f7bf680f4e78d51fd2135bb55dbd8709fa0b78cd217975a801c4e6 ]
            echo 'azsupport: { url: "https://github.com/azsupport/ports/releases/download/azsupport-fbsd15-amd64-v3", signature_type: "pubkey", pubkey: "/usr/local/etc/pkg/keys/azsupport.pub", enabled: no }' > /usr/local/etc/pkg/repos/azsupport.conf
            env ASSUME_ALWAYS_YES=yes pkg update -r azsupport
            env ASSUME_ALWAYS_YES=yes pkg install -y -r azsupport gcc16
            gcc16 --version | head -n 1 | grep ' 16\.2\.0'
          run: |
            sh tools/prog-bench.sh "$PB_GROUP" build "$PB_VARIANT" || echo "prog-bench: exit $?"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pb-${{ matrix.group }}-${{ matrix.variant }}
          path: results/prebuilt/${{ matrix.group }}-${{ matrix.variant }}.tar
          if-no-files-found: ignore
          retention-days: 3

      - name: Report
        if: always()
        env:
          PB_PART: ${{ matrix.group }}-build-${{ matrix.variant }}
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: groups=${{ inputs.groups }} split=${{ inputs.split }} from_run=${{ inputs.from_run }} variants=${{ inputs.variants }} rounds=${{ inputs.rounds }} release=${{ inputs.release }}
          RUNS_STEPS: build=${{ steps.build.outcome }}
        run: |
          f="results/prog-bench/$PB_PART.md"
          mkdir -p results/prog-bench
          [ -s "$f" ] || echo "no report of $PB_PART (the step of the VM: ${{ steps.build.outcome }})" > "$f"
          if [ -s "results/prog-bench/$PB_PART.log" ]; then
            { echo; echo "## The log of the job"; echo; echo '```'; tail -n 200 "results/prog-bench/$PB_PART.log"; echo '```'; } >> "$f"
          fi
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
          sh tools/runs-report.sh "$f" "$PB_PART"

  measure:
    needs: [groups, build]
    # after builds that failed too, not after a cancel
    if: ${{ !cancelled() && needs.groups.outputs.split != '[]' && inputs.measure != 'no' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.split) }}
    steps:
      - uses: actions/checkout@v5

      - name: Free space on the runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      # the builds of the earlier runs (from_run: one or more, a later one over an earlier one;
      # a build that failed is a tarball too: name the run of a good one after it)
      - name: The builds of the runs ${{ inputs.from_run }}
        if: inputs.from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PB_FROM: ${{ inputs.from_run }}
          PB_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p results/prebuilt
          for r in $PB_FROM; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$r/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.expired | not) | select(.name | startswith(\"pb-$PB_GROUP-\")) | \"\(.id) \(.name)\"" > "$RUNNER_TEMP/pb-arts"
            while read -r id name; do
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$name.zip"
              unzip -o -q "$RUNNER_TEMP/$name.zip" -d results/prebuilt
              echo "$name ($id) of the run $r: $(unzip -l "$RUNNER_TEMP/$name.zip" | tail -n 1)"
            done < "$RUNNER_TEMP/pb-arts"
          done
          ls -l results/prebuilt

      # the builds of this run (over those of from_run)
      - uses: actions/download-artifact@v4
        if: needs.groups.outputs.builds != '[]'
        with:
          pattern: pb-${{ matrix.group }}-*
          merge-multiple: true
          path: results/prebuilt

      - name: The benchmarks of ${{ matrix.group }} in FreeBSD ${{ inputs.release }}
        id: bench
        uses: vmactions/freebsd-vm@v1
        env:
          PB_GROUP: ${{ matrix.group }}
          PB_ROUNDS: ${{ inputs.rounds }}
          PB_SPLIT: 'yes'
        with:
          release: ${{ inputs.release }}
          mem: 12288
          envs: 'PB_GROUP PB_ROUNDS PB_SPLIT'
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos /usr/local/etc/pkg/keys
            echo 'FreeBSD-ports: { url: "https://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            env ASSUME_ALWAYS_YES=yes pkg update -f
            env ASSUME_ALWAYS_YES=yes pkg install -y llvm23 binutils gmake cmake-core ninja meson pkgconf curl python3 libffi glib expat perl5 bison
            fetch -o /usr/local/etc/pkg/keys/azsupport.pub https://raw.githubusercontent.com/azsupport/ports/main/keys/azsupport.pub
            [ "$(sha256 -q /usr/local/etc/pkg/keys/azsupport.pub)" = 2620217e69f7bf680f4e78d51fd2135bb55dbd8709fa0b78cd217975a801c4e6 ]
            echo 'azsupport: { url: "https://github.com/azsupport/ports/releases/download/azsupport-fbsd15-amd64-v3", signature_type: "pubkey", pubkey: "/usr/local/etc/pkg/keys/azsupport.pub", enabled: no }' > /usr/local/etc/pkg/repos/azsupport.conf
            env ASSUME_ALWAYS_YES=yes pkg update -r azsupport
            env ASSUME_ALWAYS_YES=yes pkg install -y -r azsupport gcc16
            gcc16 --version | head -n 1 | grep ' 16\.2\.0'
          run: |
            sh tools/prog-bench.sh "$PB_GROUP" "$PB_ROUNDS" || echo "prog-bench: exit $?"

      - name: Report
        if: always()
        env:
          PB_GROUP: ${{ matrix.group }}
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: groups=${{ inputs.groups }} split=${{ inputs.split }} from_run=${{ inputs.from_run }} variants=${{ inputs.variants }} rounds=${{ inputs.rounds }} release=${{ inputs.release }}
          RUNS_STEPS: bench=${{ steps.bench.outcome }}
        run: |
          f="results/prog-bench/$PB_GROUP.md"
          mkdir -p results/prog-bench
          [ -s "$f" ] || echo "no report of the group $PB_GROUP (the step of the VM: ${{ steps.bench.outcome }})" > "$f"
          if [ -s "results/prog-bench/$PB_GROUP.log" ]; then
            { echo; echo "## The log of the job"; echo; echo '```'; tail -n 200 "results/prog-bench/$PB_GROUP.log"; echo '```'; } >> "$f"
          fi
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
          sh tools/runs-report.sh "$f" "$PB_GROUP"
