name: ubuntu-apt

# Once: the apt repositories of the releases az-ubuntu<24|22>-amd64-<v3|v2> taken out
# (aZ, 25.11.2026: «а может репозиторий уже не ports делать? а apt?»): the repository of
# apt is https://apt.azsupport.com (azsupport/apt), these releases keep only the files of
# tools/ubuntu/build.sh, which it takes. The index files, the packages under the names of
# their version, the public key and the part "apt" of the notes are deleted; then this
# workflow and tools/ubuntu/apt-repo.sh go.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: The apt files of the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in az-ubuntu24-amd64-v3 az-ubuntu24-amd64-v2 az-ubuntu22-amd64-v3 az-ubuntu22-amd64-v2; do
            rid="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$t" --jq .id)" || { echo "$t: no release"; continue; }
            gh api "repos/$GITHUB_REPOSITORY/releases/$rid/assets?per_page=100" \
              --jq '.[] | select(.name | test("^(Packages|Packages\\.gz|Packages\\.xz|Release|Release\\.gpg|InRelease|az-apt\\.gpg|az-apt\\.asc)$|^az-(ffmpeg|imagemagick7)_.*_amd64\\.deb$")) | "\(.id) \(.name)"' |
              while read -r id n; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" > /dev/null && echo "$t: $n deleted"
              done
            gh api "repos/$GITHUB_REPOSITORY/releases/$rid" --jq .body > notes.md
            awk '/^<!-- apt -->$/ { skip = 1 } !skip { print } /^<!-- \/apt -->$/ { skip = 0 }' notes.md > notes-new.md
            printf '\nThe apt repository of these packages: https://apt.azsupport.com (azsupport/apt).\n' >> notes-new.md
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$rid" -F "body=@notes-new.md" > /dev/null && echo "$t: notes"
          done
