# The log of OpenSearch Dashboards (textproc/opensearch-dashboards219 of
# azsupport/ports): rolled when it reaches 10 MB (the size of its own
# logging.rotate.everyBytes) and not kept: count 0, no archives (aZ). B: no line of
# newsyslog in its JSON lines; SIGHUP to the process of the pid file of the rc
# script, which opens its log file again. With another opensearch_dashboards_log in
# rc.conf, change the first field.
# logfilename				[owner:group]	mode count size	when	flags	[/pid_file]	[sig_num]
/var/log/opensearch_dashboards.log	www:www		640  0	   10240 *	B	/var/run/opensearch_dashboards/opensearch_dashboards.pid	1
