
# azsupport/ports: the rollover of every log file (aZ, 11.11.2026, as for
# elasticsearch6: no archives of old logs). The appenders, loggers and levels
# above are those of the tarball; its lines of rollover (filePattern, policies,
# strategy) are taken out and these are in their place. The tarball rolls the
# server logs every day and at 128 MB into <cluster>-<date>-<n>.json.gz and
# .log.gz (up to 2 GB of them), the deprecation, slow and task logs at 1 GB into
# four .gz each. Here a file is rolled only when it reaches its size, and the
# rolled file (<file>.1.rolled) is deleted at once by the Delete action, so that
# the directory of the logs only ever holds the files themselves, each in JSON
# and in text as the tarball writes them: <cluster>_server.json, <cluster>.log,
# <cluster>_deprecation.json and .log, <cluster>_index_search_slowlog.json and
# .log, <cluster>_index_indexing_slowlog.json and .log,
# <cluster>_task_detailslog.json and .log.

# the size of the tarball, which rolls it every day too
appender.rolling.filePattern = ${sys:opensearch.logs.base_path}${sys:file.separator}${sys:opensearch.logs.cluster_name}_server.json.%i.rolled
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 128MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 1
appender.rolling.strategy.action.type = Delete
appender.rolling.strategy.action.basepath = ${sys:opensearch.logs.base_path}
appender.rolling.strategy.action.condition.type = IfFileName
appender.rolling.strategy.action.condition.glob = ${sys:opensearch.logs.cluster_name}_server.json.*.rolled

