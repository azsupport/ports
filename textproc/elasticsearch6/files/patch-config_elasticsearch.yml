--- config/elasticsearch.yml.orig	2018-09-26 13:30:23 UTC
+++ config/elasticsearch.yml
@@ -31,10 +31,12 @@
 # Path to directory where to store the data (separate multiple locations by comma):
 #
 #path.data: /path/to/data
+path.data: /var/db/elasticsearch
 #
 # Path to log files:
 #
 #path.logs: /path/to/logs
+path.logs: /var/log/elasticsearch
 #
 # ----------------------------------- Memory -----------------------------------
 #
@@ -86,3 +88,18 @@
 # Require explicit names when deleting indices:
 #
 #action.destructive_requires_name: true
+
+# ml is not supported on FreeBSD
+xpack.ml.enabled: false
+
+# azsupport/ports: the cipher suites of TLS of X-Pack: its default list of 6.8.23
+# (XPackSettings.DEFAULT_CIPHERS, in its order) without the four TLS_RSA_WITH_AES_*
+# (256_CBC_SHA256, 256_CBC_SHA, 128_CBC_SHA256, 128_CBC_SHA), which OpenJDK 17 of
+# the ports (17.0.21) no longer has: with the default list Elasticsearch writes
+# "[ERROR][o.e.x.c.s.SSLService] unsupported ciphers [...] were requested but
+# cannot be used in this JVM" at every start and uses these eight (the four as
+# that message names them on FreeBSD 15.1, 11.11.2026). Nothing usable is dropped.
+xpack.ssl.cipher_suites: [ "TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384", "TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384",
+  "TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA", "TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA",
+  "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256", "TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256",
+  "TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA", "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA" ]
