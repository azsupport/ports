

# azsupport/ports: the rollover of every log file (aZ, 11.11.2026: no archives of
# old logs). The appenders, loggers and levels above are those of the tarball;
# its lines of rollover (filePattern, policies, strategy) are taken out and these
# are in their place. The tarball rolls the main log every day and at 128 MB into
# <cluster>-<date>-<n>.log.gz (up to 2 GB of them), the deprecation log at 1 GB
# into four .gz, the slow logs and the audit logs every day into dated files that
# nothing removes. Here a file is rolled only when it reaches its size, and the
# rolled file (<file>.1.rolled) is deleted at once by the Delete action, so that
# the directory of the logs only ever holds the files themselves: <cluster>.log,
# <cluster>_deprecation.log, <cluster>_index_search_slowlog.log,
# <cluster>_index_indexing_slowlog.log, <cluster>_audit.log, <cluster>_access.log.

# the size of the tarball
appender.rolling.filePattern = ${sys:es.logs.base_path}${sys:file.separator}${sys:es.logs.cluster_name}.log.%i.rolled
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 128MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 1
appender.rolling.strategy.action.type = Delete
appender.rolling.strategy.action.basepath = ${sys:es.logs.base_path}
appender.rolling.strategy.action.condition.type = IfFileName
appender.rolling.strategy.action.condition.glob = ${sys:es.logs.cluster_name}.log.*.rolled

# the size of the tarball
appender.deprecation_rolling.filePattern = ${sys:es.logs.base_path}${sys:file.separator}${sys:es.logs.cluster_name}_deprecation.log.%i.rolled
appender.deprecation_rolling.policies.type = Policies
appender.deprecation_rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.deprecation_rolling.policies.size.size = 1GB
appender.deprecation_rolling.strategy.type = DefaultRolloverStrategy
appender.deprecation_rolling.strategy.max = 1
appender.deprecation_rolling.strategy.action.type = Delete
appender.deprecation_rolling.strategy.action.basepath = ${sys:es.logs.base_path}
appender.deprecation_rolling.strategy.action.condition.type = IfFileName
appender.deprecation_rolling.strategy.action.condition.glob = ${sys:es.logs.cluster_name}_deprecation.log.*.rolled

# the tarball rolls it by the day alone; the size of 7.x
appender.index_search_slowlog_rolling.filePattern = ${sys:es.logs.base_path}${sys:file.separator}${sys:es.logs.cluster_name}_index_search_slowlog.log.%i.rolled
appender.index_search_slowlog_rolling.policies.type = Policies
