# the tarball rolls it by the day alone; the size of 7.x
appender.audit_rolling.filePattern = ${sys:es.logs.base_path}${sys:file.separator}${sys:es.logs.cluster_name}_audit.log.%i.rolled
appender.audit_rolling.policies.type = Policies
