# ffmpeg-nonfree.conf - what the nonfree variant multimedia/ffmpeg-nonfree
# (nonfree/ffmpeg/Makefile.in) adds to ffmpeg.conf: the AAC encoder libfdk_aac of the
# Fraunhofer FDK AAC library, which the formats of old video sites ask for
# (-c:a libfdk_aac). tools/ffmpeg-build.sh with AZ_FFMPEG_NONFREE=yes builds its
# program lines before FFmpeg (fdk-aac: static, with cmake, into the work directory)
# and puts its configure lines after those of ffmpeg.conf (after
# --disable-everything). FFmpeg with libfdk_aac and libx264 (--enable-gpl) needs
# --enable-nonfree: "the resulting libs and binaries will be unredistributable"
# (configure), so its package is never in a release of this repository.

program fdkaac    audio/fdk-aac

configure --enable-nonfree --enable-libfdk-aac
configure --enable-encoder=libfdk_aac
