# tools/build-minutes.conf: how long the longest builds take, in minutes, on the free
# runners of GitHub (build.yml: 4 CPUs, its FreeBSD VM). The longest time of each port
# in the reports of build.yml (ports-build/<date>/<run>-<level>.md of the branch runs of
# azsupport/azsupport: the lines "<origin> OK <package>: <seconds>s ..."), rounded up;
# lang/gcc16 alone, which no report has whole on these runners, estimated (stopped at
# AZSUPPORT_TIME_HARD after 2 h on 22.11.2026; killed by the memory at its LTO after 2 h 38 min
# beside databases/mongodb80 on 21.11.2026).
#
# tools/build.sh starts no port of this list when less time than this is left until
# AZSUPPORT_TIME_HARD: the next run builds it, at its start, instead of one that stops the
# build after hours of it (lang/gcc16, 22.11.2026: about 2 h lost; aZ 22.11.2026: «ну да,
# конечно»). A port that keeps a cache between the runs (AZSUPPORT_PORT_CACHE: databases/mongodb80,
# the disk cache of Bazel) goes on from it after a stop and starts in any case. A port not
# listed starts as before. The hash of no port takes this file.
#
# azsupport/azsupport: the 55 minutes of the one package azsupport of before the split
# (every library, static and shared, as the reports of build.yml had it). Since the split (aZ, 26.11.2026:
# every library a port of its own, azsupport/<lib> and x11-fonts/fontconfig, the static tree
# a port of its own) the line is to be measured again after the first run of the split, and
# the longest library ports (icu, the libraries of the bundle of curl) added then; until then
# no library port is held back by this file.
#
# <origin>                     <minutes>
devel/llvm19                   240
lang/gcc16                     240
www/node24                     205
www/node18                     120
lang/gcc16-libs                80
databases/mariadb1011-server   75
java/openjdk21                 70
azsupport/azsupport                          55
textproc/manticore14           55
textproc/manticore32           55
java/openjdk17                 45
