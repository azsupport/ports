# The sources of tools/ubuntu/build.sh: our FFmpeg and ImageMagick 7 for Ubuntu 24.04,
# with the libraries of the package az they link, in build order. The versions are
# those of this tree: the ports of freebsd-ports at the commit of az/az/files/deps.conf
# and the take lines there, those of multimedia/ffmpeg/files/ffmpeg.conf (fdk-aac:
# audio/fdk-aac of the nonfree build) and of graphics/ImageMagick7/files/imagemagick.conf;
# the SHA-256 those of the distinfo of the ports and of the take lines.
#
#   <name> <version> <file> <sha256> <url>[,<url>...]
#
# <file>: the name the release file is kept under; the addresses are tried in turn.
# zlib and bzip2: those of Ubuntu (zlib1g, libbz2-1.0), as the FreeBSD builds take those
# of the base system.

# the build tool of fontconfig, dav1d and x264: the meson of devel/meson at that commit
# (Ubuntu 24.04 has 1.3.2), run from its release file
