# ffmpeg-nvidia.conf - what the FFmpeg of tools/ubuntu/build.sh (Ubuntu, Debian) adds to
# multimedia/ffmpeg/files/ffmpeg.conf and ffmpeg-nonfree.conf: the NVIDIA codecs and the
# CUDA filters (aZ, 25.11.2026: «убунтовский ффмпег должен поддерживать куда от
# нвидия»). Its configure lines go after those of the two (after --disable-everything).
#
# ffnvcodec: the headers of nv-codec-headers (tools/ubuntu/sources.conf); FFmpeg loads
# libcuda.so.1, libnvcuvid.so.1 and libnvidia-encode.so.1 of the NVIDIA driver when it
# opens a CUDA device, so it is linked with glibc dynamically and runs without the driver
# and a GPU as without these. cuda-llvm: the CUDA kernels of the filters (scale_cuda,
# overlay_cuda, yadif_cuda, bwdif_cuda, thumbnail_cuda...) compiled into PTX by clang,
# which the driver compiles for its GPU; --enable-filters of ffmpeg.conf turns them on.
#
#   encoders  h264_nvenc (8-bit 4:2:0 as libx264: tools/ubuntu/ffmpeg/
#             h264-nvenc-8bit-420.patch), hevc_nvenc, av1_nvenc (the GPUs with AV1 NVENC:
#             Ada and later)
#   decoders  the CUVID ones (h264_cuvid, hevc_cuvid, av1_cuvid, vp9_cuvid, vp8_cuvid,
#             mjpeg_cuvid: -c:v h264_cuvid), and the hwaccels NVDEC of the decoders of
#             FFmpeg (-hwaccel cuda): those of h264, hevc, vp9, vp8, mjpeg, and of av1, the
#             decoder of FFmpeg that decodes only with a hwaccel (-hwaccel cuda -c:v av1;
#             libdav1d stays the decoder of AV1 by default)

configure --enable-ffnvcodec --enable-cuda --enable-cuda-llvm --enable-cuvid --enable-nvdec --enable-nvenc
configure --enable-encoder=h264_nvenc,hevc_nvenc,av1_nvenc
configure --enable-decoder=h264_cuvid,hevc_cuvid,av1_cuvid,vp9_cuvid,vp8_cuvid,mjpeg_cuvid
configure --enable-decoder=av1
configure --enable-hwaccel=h264_nvdec,hevc_nvdec,av1_nvdec,vp9_nvdec,vp8_nvdec,mjpeg_nvdec
